<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFFICE MANAGER</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OFFICE MANAGER">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* If a saved, unexpired login exists, mark the page as "restoring" before the first paint so the sign-in form never flashes. */
(function(){try{var t=localStorage.getItem("kss_auth")||sessionStorage.getItem("kss_auth");if(!t)return;var a=JSON.parse(t);if(a&&a.id&&(!a.exp||a.exp>Date.now()))document.documentElement.classList.add("restoring");}catch(e){}})();
</script>
<style>
  :root{
    --ink:#16212b; --muted:#5d6b78; --line:#d5dce2; --bg:#eef1f4; --panel:#ffffff;
    --steel:#1f3a52; --steel-2:#2d5373; --amber:#e0a100; --amber-bg:#fff4d1;
    --green:#1f8a4c; --green-bg:#dff3e6; --red:#c0392b;
    --font: "Segoe UI", system-ui, -apple-system, "Noto Sans", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.45}
  button,input,select{font:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .hidden{display:none !important}

  /* ---------- Session-restore splash: while a saved login is being re-checked, show this instead of the login page ---------- */
  #restoreView{display:none;min-height:100vh;place-items:center;text-align:center;color:#fff;padding:20px;
    background:linear-gradient(160deg,var(--steel) 0%,#12273a 100%)}
  #restoreView .rs-spin{width:38px;height:38px;margin:0 auto 14px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--amber);border-radius:50%;animation:rsspin .8s linear infinite}
  #restoreView p{margin:0;font-size:.95rem;opacity:.9;letter-spacing:.3px}
  @keyframes rsspin{to{transform:rotate(360deg)}}
  html.restoring #loginView{display:none !important}
  html.restoring #restoreView{display:grid}

  /* ---------- Login ---------- */
  #loginView{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:
      repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.05) 47px 48px),
      linear-gradient(160deg,var(--steel) 0%,#12273a 100%)}
  .login-card{width:100%;max-width:400px;background:var(--panel);border-radius:6px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .login-head{padding:26px 28px 18px;border-bottom:4px solid var(--amber)}
  .login-logo{display:block;width:100%;max-width:250px;height:auto;margin:0 auto 14px}
  .login-head{text-align:center}
  .login-head h1{margin:0;font-size:1.3rem;letter-spacing:.5px;color:var(--steel);line-height:1.3}
  .login-head p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  .role-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 16px;border-bottom:1px solid var(--line);background:#f7f9fb}
  .role-switch button{padding:13px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-weight:600;
    border-bottom:3px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .15s}
  .role-switch button:hover{background:#f0f4f7;color:var(--steel)}
  .role-switch button.active{background:#fff;color:var(--steel);border-color:var(--steel);border-bottom-color:var(--amber);box-shadow:0 3px 8px rgba(31,58,82,.08)}
  .role-switch button:last-child{grid-column:1 / -1;justify-self:center;width:50%}
  .login-body{padding:22px 28px 28px}
  label{display:block;font-size:.9rem;font-weight:600;margin:0 0 5px}
  input[type=text],input[type=password],input[type=date]{width:100%;padding:10px 12px;border:1px solid #b9c3cc;
    border-radius:4px;background:#fff;color:var(--ink)}
  .field{margin-bottom:14px}
  .btn{padding:10px 18px;border:0;border-radius:4px;background:var(--steel);color:#fff;font-weight:600}
  .btn:hover{background:var(--steel-2)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.wide{width:100%}
  .btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--steel)}
  .btn.ghost:hover{background:#e6edf3}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#a02e22}
  .btn.small{padding:6px 11px;font-size:.85rem}
  .error{color:var(--red);font-size:.9rem;min-height:1.3em;margin:0 0 10px}
  .mode-note{margin:14px 0 0;font-size:.8rem;color:var(--muted)}
  .linkbtn{display:block;margin:14px auto 0;padding:4px 8px;border:0;background:none;color:var(--steel-2);
    font-size:.9rem;text-decoration:underline}
  .linkbtn:hover{color:var(--steel)}
  .okmsg{color:var(--green);font-size:.95rem;margin:0 0 12px}
  .rqbox{margin:0 0 16px;padding:12px;border:1px solid var(--amber);background:var(--amber-bg);border-radius:4px}
  .rqbox h4{margin:0 0 8px;font-size:.95rem}
  .rqitem{padding:10px 0;border-top:1px solid #ecd9a0}
  .rqitem:first-of-type{border-top:0}
  .rqitem .row{margin:6px 0 0}
  .rqitem small{color:var(--muted)}
  .msgbox{padding:10px 12px;background:#f4f6f8;border:1px solid var(--line);border-radius:4px;font-size:.92rem;margin:0 0 12px;word-break:break-word}

  /* ---------- App ---------- */
  header.top{background:var(--steel);color:#fff;border-bottom:4px solid var(--amber)}
  .top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top-in h2{margin:0;font-size:1.2rem;letter-spacing:.4px;flex:1;min-width:200px}
  .top-logo{display:block;width:92px;height:42px;object-fit:contain;object-position:left center;flex:0 0 auto}
  .top-title{font-weight:700;font-size:1.2rem;letter-spacing:.8px;white-space:nowrap}
  @media(max-width:520px){.top-logo{width:76px;height:36px}.top-title{font-size:1rem}}
  .who{font-size:.9rem;opacity:.9}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--amber);color:#2a2000;
    font-size:.78rem;font-weight:700;margin-left:6px}
  .top-in .btn{background:rgba(255,255,255,.14)}
  .top-in .btn:hover{background:rgba(255,255,255,.26)}
  .sync{font-size:.8rem;padding:3px 11px 3px 24px;border-radius:99px;background:rgba(255,255,255,.14);
    cursor:pointer;position:relative;user-select:none}
  .sync::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#8aa0b3}
  .sync.ok::before{background:#4cd98a}
  .sync.saving::before{background:var(--amber)}
  .sync.offline::before,.sync.error::before{background:#ff6b5b}
  .sess{font-size:.8rem;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap;font-variant-numeric:tabular-nums}
  .sess.warn{background:var(--amber);color:#2a2000;font-weight:600}
  .remtog{display:flex;align-items:center;gap:6px;width:100%;max-width:340px;text-align:left;background:#f5f7f9;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:.84rem;color:var(--ink);cursor:pointer;margin:0 0 6px}
  .remtog .car{display:inline-block;color:var(--muted);transition:transform .15s}
  .remtog.open .car{transform:rotate(90deg)}
  .remtog .pv{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .rtree{margin:0 0 8px 8px;padding-left:14px;border-left:2px solid var(--line)}
  .rtree .rn{position:relative;margin:0 0 8px;padding:6px 8px;background:#f5f7f9;border-radius:4px}
  .rtree .rn::before{content:"";position:absolute;left:-14px;top:15px;width:14px;border-top:2px solid var(--line)}
  .rtree .rn::after{content:"";position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--steel)}
  .wcur{font-weight:700;color:#0a7a3c}.wup{font-weight:700;color:#a86500}.wold{color:var(--muted)}

  main{max-width:1100px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .tab{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;
    background:#e1e7ec;color:var(--ink);font-weight:600;white-space:nowrap}
  .tab .cnt{margin-left:7px;font-size:.78rem;padding:1px 7px;border-radius:99px;background:var(--amber-bg);color:#6b5000}
  .tab .cnt.zero{background:var(--green-bg);color:#14602f}
  .tab.active{background:var(--panel);border-color:var(--steel);box-shadow:inset 0 3px 0 var(--steel)}
  .tab.add{background:transparent;border-style:dashed;color:var(--steel)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:18px;margin-top:-1px}
  .panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head h3{margin:0;font-size:1.25rem}
  .stats{display:flex;gap:16px;font-size:.92rem;color:var(--muted)}
  .stats b{color:var(--ink)}
  .mbar{margin:-6px 0 14px;display:flex;gap:8px;flex-wrap:wrap}
  .progress{height:8px;border-radius:99px;background:#e3e8ec;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

  .datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;
    background:var(--steel);border-radius:6px;color:#fff}
  .datebar input[type=date]{width:auto;padding:6px 10px}
  .datebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
  .datebar .btn.ghost:hover{background:rgba(255,255,255,.15)}
  .datebar .btn:not(.ghost){background:var(--amber);color:#2a2000}
  .datebar .btn:disabled{opacity:.5;cursor:default}
  .dlabel{font-weight:600;margin-left:auto}
  .carry{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--amber-bg);border:1px solid #ecc85a;border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
  .chip{border:1px solid #c9a227;background:#fff;border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;font-size:.82rem;color:var(--ink)}
  .chip:hover{background:#fff8e0}
  .quick{display:flex;gap:6px;margin-bottom:6px}

  .add-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end;
    padding:14px;background:#f5f7f9;border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
  .add-row .field{margin:0}

  .filters{display:flex;gap:6px;margin-bottom:10px}
  .filters button{padding:5px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:.88rem}
  .filters button.active{background:var(--steel);color:#fff;border-color:var(--steel)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.chk{width:56px;text-align:center}
  td.act{width:220px;text-align:right;white-space:nowrap}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer}
  tr.done .wt{text-decoration:line-through;color:var(--muted)}
  /* work priority colours: Normal = black, High = yellow, Urgent = red */
  .wt.wp-normal{color:#000}
  .wt.wp-high{color:#c99700;font-weight:700}
  .wt.wp-urgent{color:#d11a0a;font-weight:700}
  tr.done .wt.wp-normal,tr.done .wt.wp-high,tr.done .wt.wp-urgent{color:var(--muted);font-weight:400}
  .add-row select{min-width:130px}
  .cmt{display:block;font-size:.85rem;color:var(--ink);background:#f1f5f2;border-left:3px solid var(--green);padding:3px 8px;margin-top:4px;border-radius:2px;white-space:pre-wrap}
  textarea{width:100%;padding:10px 12px;border:1px solid #b9c3cc;border-radius:4px;font:inherit;resize:vertical;min-height:84px;background:#fff;color:var(--ink)}
  tr.done{background:#f6fbf8}
  .doneat{display:block;font-size:.78rem;color:var(--green);text-decoration:none}
  .stb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:0;min-height:0;padding:0;margin:0 2px;border:1px solid #c9a227;background:#fff;border-radius:50%;cursor:pointer;vertical-align:middle;line-height:0}
  .stb svg{width:21px;height:21px;display:block}
  .stb .sp{fill:none;stroke:#b8860b;stroke-width:1.4;stroke-linejoin:round}
  .stb .sl{font:700 9px/1 Arial,sans-serif;fill:#8a6a00}
  .stb.on{background:#fff3c4;border-color:#b8860b}
  .stb.on .sp{fill:#f2b705}
  .stb.on .sl{fill:#3b2a00}
  .stag{display:inline-block;font-size:.72rem;font-weight:700;color:#8a6a00;background:#fff3c4;border:1px solid #e0c060;border-radius:99px;padding:0 7px;margin:3px 4px 0 0}
  .stpick{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:2px 0 12px;font-size:.85rem;color:var(--muted)}
  .stpick span.l{display:inline-flex;align-items:center;gap:4px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f3a52;color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:99999;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .6s}
  .toast.off{opacity:0}
  .clmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 12px}
  .clmchips{display:flex;gap:6px;flex-wrap:wrap}
  .clmchips button{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:.85rem;color:var(--steel)}
  .clmchips button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
  .clm{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:0 0 10px}
  .clm-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
  .clm-top b{color:var(--steel);font-size:1rem}
  .clm-type{margin-left:auto;background:#eef3f8;color:var(--steel);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
  .clm-v{font-weight:600;margin:6px 0 2px}
  .clm-v small{font-weight:400;color:var(--muted);margin-left:6px}
  .clm-d{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
  .clm-q{color:var(--muted);white-space:nowrap}
  .clm-rem{font-size:.85rem;color:var(--muted);margin:0 0 4px;white-space:pre-wrap}
  .cld{border:1px solid var(--line);border-radius:14px;background:#fff;margin:0 0 12px;box-shadow:0 2px 10px rgba(31,58,82,.07);overflow:hidden}
  .cld-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:0;background:linear-gradient(135deg,#1f3a52,#2f5778);color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;text-align:left}
  .cld-head small{display:block;font-weight:400;opacity:.8;font-size:.78rem;margin-top:2px}
  .cld-head .chev{transition:transform .2s;font-size:1.1rem}.cld.open .cld-head .chev{transform:rotate(180deg)}
  .cld-body{display:none;padding:14px}.cld.open .cld-body{display:block}
  .cld-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cld-box{background:#f5f7fa;border-radius:10px;padding:10px 12px;border-left:4px solid #c3ccd6}
  .cld-box small{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.02em}
  .cld-box b{font-size:1.1rem;color:var(--ink);display:block;margin-top:2px}
  .cld-box em{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:1px}
  .cld-box.big{grid-column:1/-1;background:#eef3f8;border-left-color:#1f3a52}.cld-box.big b{font-size:1.4rem;color:#1f3a52}
  .cld-box.ok{background:#eef8f1;border-left-color:#1a7f37}.cld-box.ok b{color:#1a7f37}
  .cld-box.pend{background:#fff4e8;border-left-color:#b3541e}.cld-box.pend b{color:#b3541e}
  .cld-bar{grid-column:1/-1;height:8px;border-radius:99px;background:#fde3cc;overflow:hidden}.cld-bar i{display:block;height:100%;background:#1a7f37;border-radius:99px}
  .cld-sub{grid-column:1/-1;font-size:.76rem;color:var(--muted);margin:-4px 0 0}
  .cld h4{margin:14px 0 6px;font-size:.9rem;color:var(--steel)}
  .cld-ppl button{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:center;text-align:left;padding:8px 10px;margin:0 0 5px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.9rem;color:var(--ink)}
  .cld-ppl button.on{border-color:var(--steel);background:#eef3f8}
  .cld-ppl small{display:block;color:var(--muted)}
  .clm-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .clm-act select{padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-weight:600}
  .clm-act select[data-v="Not applied"]{color:#8a6500;background:#fff7e0}
  .clm-act select[data-v="Applied"]{color:#1d4f91;background:#e8f1fc}
  .clm-act select[data-v="Settled"]{color:#1b7f3b;background:#e6f5ea}
  .pm-act{border:2px solid #1b7f3b;background:#f0faf3}
  .pm-badge{display:inline-block;background:#1b7f3b;color:#fff;border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:700;letter-spacing:.3px}
  .dff{border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 10px;overflow:hidden}
  .dff-h{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:#f4f7fa;border:0;text-align:left;font-size:.95rem;color:var(--steel);cursor:pointer}
  .dff-h .dff-ic{flex:none;font-size:1.1rem}
  .dff-h b{flex:1;min-width:0;overflow-wrap:anywhere}
  .dff-h .dff-n{flex:none;background:#fff3dc;color:#8a5a00;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
  .dff-h .dff-ch{flex:none;transition:transform .15s}
  .dff.open .dff-ch{transform:rotate(90deg)}
  .dff-b{display:none;padding:10px 10px 0;border-top:1px solid var(--line)}
  .dff.open .dff-b{display:block}
  .dcf{border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 8px;overflow:hidden}
  .dcf-h{display:flex;align-items:stretch;background:#f4f7fa}
  .dcf-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 12px;background:transparent;border:0;text-align:left;font-size:.95rem;color:var(--steel);cursor:pointer}
  .dcf-t.leaf{cursor:default}
  .dcf-t .dcf-ic{flex:none;font-size:1.1rem}
  .dcf-t b{flex:1;min-width:0;overflow-wrap:anywhere}
  .dcf-t .dcf-n{flex:none;background:#e6eef6;color:#1f3a52;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
  .dcf-t .dcf-ch{flex:none;transition:transform .15s}
  .dcf.open>.dcf-h .dcf-ch{transform:rotate(90deg)}
  .dcf-go{flex:none;align-self:center;margin:0 10px 0 0;padding:6px 14px;border-radius:999px;background:#1f3a52;color:#fff;font-size:.82rem;font-weight:700;text-decoration:none;white-space:nowrap}
  .dcf-b{display:none;padding:10px 10px 2px 14px;border-top:1px solid var(--line)}
  .dcf.open>.dcf-b{display:block}
  .dcf-act{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  .dcf-url{margin:0 0 10px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
  .wps{display:flex;align-items:center;gap:10px;margin:18px 0 10px;padding:8px 12px;background:var(--steel);color:#fff;border-radius:8px;font-size:1rem}
  .wps .wps-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--amber);color:#2a2000;font-weight:700;font-size:.9rem;flex:0 0 auto}
  .wps small{margin-left:auto;font-weight:400;opacity:.8;font-size:.78rem}
  .wpnext{margin:4px 0 6px}
  .wpt{border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 12px;overflow:hidden}
  .wpt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:#f4f7fa;color:var(--steel);font-size:1rem}
  .wpt-b{padding:10px}

<script>
(function(){
  "use strict";

  /* =====================================================================
     SETUP: paste your Google Apps Script Web App URL between the quotes.
     Leave it as is to run in local (single device) mode.
     Master and user passwords are checked on the Google server (Code.gs),
     so no password is stored in this file.
     ===================================================================== */
  var PAGE_VER = "v18.46";   // bump this (and VERSION in the .gs) on every update; shown on the login page
  (function(){ var el = document.getElementById("verLine"); if(el) el.textContent = "Page " + PAGE_VER; })();
  var API_URL = "https://script.google.com/macros/s/AKfycbyV3-iaQXXsFh70EicRzuSPKsYT572gYXZsngRyUaB01W24Q8j2LpijWHu19YXwl6JvAw/exec";
  var POLL_MS = 8000;                                   // live refresh interval

  var SYNC = /^https:\/\//.test(API_URL);

  /* ---------- State ---------- */
  var KEY = "kozhikode_ss_daily_work_v1";
  var state = { employees: [], xfers: [], users: [], events: [], assignments: [], amp: [], notice: "", contracts: [], amcUsers: [], amcWorks: [], sched: [], amcDaily: [], amcTemp: [], amcHours: [], fu: [], pr: [], avail: [], online: { count: 0, list: [] } };
  var assignFilter = "all", assignTo = "", lastBy = "";
  var empView = "work";         // inside an employee tab: "work" or "cal"
  var dashPeriod = "today";     // dashboard range
  var calMonths = {};           // visible month per calendar scope
  var session = null;           // { role, id }
  var auth = null;              // { role, id, pass } (sync mode)
  var activeTab = null;
  var ampBusy = 0, ampChain = Promise.resolve(), ampText = "";
  var ampMonth = null, ampUpTo = "", ampFilter = "all";
  var noticeShown = null;       // last banner text drawn (avoids restarting the animation)
  var userPass = null;          // master only: { userId: password }
  var filter = "all";
  var loginRole = "user";
  var viewDate = today();
  var version = 0;              // bumps on every local change
  var queue = [], flushing = false, lastText = "", pendingRefresh = null, pollTimer = null, lastTok = "", lastFullAt = 0, pullBusy = 0;

  /* ---------- Helpers ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
  function today(){ return toISO(new Date()); }
  function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseISO(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(iso,n){ var d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function fmtDate(iso){ if(!iso) return ""; var p = iso.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
  function fmtStamp(ts){
    var d = new Date(ts);
    return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }
  function dayLabel(iso){
    var d = parseISO(iso), t = parseISO(today());
    var diff = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);
    var rel = diff===0?"Today":diff===-1?"Yesterday":diff===1?"Tomorrow":"";
    return d.toLocaleDateString("en-GB",{weekday:"long"})+", "+fmtDate(iso)+(rel?" – "+rel:"");
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function isMaster(){ return session && session.role === "master"; }
  function isSupport(){ return session && session.role === "support"; }
  function emp(id){ return state.employees.find(function(e){ return e.id === id; }); }
  /* the employee record that belongs to the logged-in normal user */
  function myEmpId(){
    if(!session || session.role !== "user") return "";
    if(session.employeeId && emp(session.employeeId)) return session.employeeId;
    var l = state.employees.find(function(e){ return e.userId && e.userId === session.id; });
    return l ? l.id : "";
  }
  function canEditWorks(e){ return isMaster() || (!!e && e.id === myEmpId()); }
  /* availability for today: "yes" | "no" | "" (not answered) */
  function availOf(empId){
    var a = (state.avail || []).find(function(x){ return x.empId === empId && (SYNC || x.date === today()); });
    return a ? (a.available ? "yes" : "no") : "";
  }
  function availChip(empId){
    var v = availOf(empId);
    return v === "yes" ? '<span class="availchip" style="color:#1b7f3b;font-weight:600">&#9679; Available today</span>'
         : v === "no"  ? '<span class="availchip" style="color:#b3261e;font-weight:600">&#9679; Not available today</span>'
         : '<span class="availchip" style="color:var(--muted)">&#9679; Availability not updated</span>';
  }
  var availBusy = 0;
  function toast(msg){
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function(){ t.classList.add("off"); }, 3500); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4200);
  }
  /* The answer is shown at once; the server copy is saved in the background (retried quietly, reverted with a message only if every try fails). */
  function availSave(empId, yes, done, fail){
    var prev = (state.avail || []).find(function(a){ return a.empId === empId && (SYNC || a.date === today()); });
    state.avail = (state.avail || []).filter(function(a){ return a !== prev; });
    state.avail.push({ empId: empId, date: today(), available: !!yes });
    version++;                                         // any refresh already on its way is now out of date: ignore it
    if(!SYNC){ saveLocal(); done(); return; }
    availBusy++;
    done();                                            // close the popup / update the screen immediately
    var tries = 0;
    function send(){
      tries++;
      api({ action: "availSet", empId: empId, available: !!yes }).then(function(){
        availBusy--; lastTok = "";                     // next refresh confirms with the server
      }).catch(function(err){
        if(!(err && err.server) && tries < 3){ setTimeout(send, 3000); return; }       // network hiccup: retry quietly
        availBusy--;
        state.avail = state.avail.filter(function(a){ return !(a.empId === empId && a.date === today()); });
        if(prev) state.avail.push(prev);
        version++; render();
        var m = "Availability was not saved" + (err && err.server && err.message ? ": " + err.message : " (no connection)") + ". Please try again.";
        try{ toast(m); }catch(x){}
      });
    }
    send();
  }
  function availPrompt(){
    var me = myEmpId(); if(!me || availOf(me) || modalOpen()) return;
    openModal('<h3>Are you available today?</h3><p style="margin-top:0;color:var(--muted)">'+esc(dayLabel(today()))+'</p>'+
      '<p class="error" id="avErr"></p>'+
      '<div class="row"><button class="btn" id="avYes" type="button">Yes, available</button><button class="btn danger" id="avNo" type="button">No, not available</button></div>');
    var ov = $("ov"); if(ov) ov.parentNode.replaceChild(ov.cloneNode(true), ov);   // must answer: no close on outside click
    function pick(yes){
      $("avYes").disabled = true; $("avNo").disabled = true;
      availSave(me, yes, function(){ closeModal(); render(); }, function(){});
    }
    $("avYes").onclick = function(){ pick(true); };
    $("avNo").onclick = function(){ pick(false); };
  }
  function modalOpen(){ return $("modalRoot").innerHTML !== ""; }
  /* The notice is stored as one hidden office record (works with every version of the Google script) */
  var NOTICE_ID = "noticeboard";

  /* ---------- Employee designation & roles ----------
     Stored inside the existing "name" field as  Name§Designation§Role1|Role2
     so the Google Apps Script backend needs no change. */
  var DESIGS = ["Apprentice/Intern","TT","DT","ET","Technician","Junior Engineer","Engineer","Assistant Manager","Deputy Manager","Manager","Chief Manager","DGM","Sr. DGM","GM","Sr. GM","CGM"];
  var ROLES = ["HR","SAFETY","IT","GUESTHOUSE","STORE","SS O&M","TLM","COURT CASES","ESG","HINDI","C&M","INCHARGE","MRT","AUXILIARY SYSTEMS","COLONY MAINTENANCE","OTHER (SPECIFY)"];
  var ESEP = "\u00A7";
  function cleanNm(s){ return String(s == null ? "" : s).split(ESEP)[0].trim(); }     // "Name§Designation§Roles" -> "Name" (names are shown / saved without designation and roles)
  function parseEmp(raw){
    var p = String(raw == null ? "" : raw).split(ESEP);
    return { name: (p[0]||"").trim(), desig: (p[1]||"").trim(),
             roles: (p[2]||"").split("|").map(function(x){ return x.trim(); }).filter(Boolean) };
  }
  function encEmp(e){
    if(!e.desig && !(e.roles && e.roles.length)) return e.name;
    return [e.name, e.desig||"", (e.roles||[]).join("|")].join(ESEP);
  }
  function desigHTML(e){ return e.desig ? '<span class="desig">'+esc(e.desig)+'</span>' : ""; }
  function rolesHTML(e){ return (e.roles && e.roles.length) ? '<span class="roletxt">'+esc(e.roles.join(", "))+'</span>' : ""; }

  /* ---------- Local storage (local mode only) ---------- */
  function defaults(){
    var emps = [];
    for(var i=1;i<=11;i++) emps.push({ id: uid()+i, name: "Employee "+i, works: [] });
    return { employees: emps, users: [], events: [], assignments: [], amp: [], notice: "", contracts: [], amcUsers: [], amcWorks: [], sched: [], fu: [], pr: [] };
  }
  function loadLocal(){
    try{ var raw = localStorage.getItem(KEY); if(raw){ var st = JSON.parse(raw); st.events = st.events || []; st.assignments = st.assignments || []; st.amp = st.amp || []; st.notice = st.notice || ""; st.contracts = st.contracts || []; st.amcUsers = st.amcUsers || []; st.amcWorks = st.amcWorks || []; st.sched = st.sched || []; st.fu = st.fu || []; st.pr = st.pr || []; return st; } }catch(e){}
    return defaults();
  }
  function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  if(!SYNC) state = loadLocal();

  /* ---------- Sync layer ---------- */
  function api(body){
    body.auth = auth;
    var ctl = null, tm = null;
    if(body.action !== "ops" && body.action !== "backupAll" && typeof AbortController !== "undefined"){ ctl = new AbortController(); tm = setTimeout(function(){ ctl.abort(); }, 45000); }   // reads give up after 45 s (saves are never cut off)
    return fetch(API_URL, { method: "POST", body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function(r){ if(tm) clearTimeout(tm); return r.text(); }, function(e){ if(tm) clearTimeout(tm); throw e; })
      .then(function(t){
        var j; try{ j = JSON.parse(t); }catch(e){ throw new Error("Bad response from server"); }
        if(!j.ok){ var er = new Error(j.error || "Server error"); er.server = true; throw er; }
        return { json: j, text: t };
      });
  }

  function applyData(d){
    d = d || {};
    var map = {};
    // Keep locally entered Employee No. values while a save response is being applied.
    // This also makes the UI tolerant of an older deployed backend that omits userId.
    var pendingUid = {};
    (queue || []).forEach(function(op){
      if(op && op.t === 'emp.put' && op.emp && op.emp.id) pendingUid[String(op.emp.id)] = String(op.emp.userId || '');
    });
    state.employees = (d.employees || []).map(function(e){
      var pe = parseEmp(e.name);
      var uid = String(e.userId || '');
      if(!uid && pendingUid[String(e.id)]) uid = pendingUid[String(e.id)];
      var o = { id: e.id, userId: uid, name: pe.name || e.name, desig: pe.desig, roles: pe.roles, works: [] }; map[e.id] = o; return o;
    });
    (d.works || []).forEach(function(w){
      if(map[w.empId]) map[w.empId].works.push({
        id: w.id, text: w.text, date: w.date, done: !!w.done, doneAt: w.doneAt || null,
        movedFrom: w.movedFrom || "", comment: w.comment || "", created: w.created || 0, apr: !!w.apr, mh: !!w.mh,
        priority: (w.priority === "high" || w.priority === "urgent") ? w.priority : "normal",
        xferFrom: w.xferFrom || ""
      });
    });
    state.xfers = d.xfers || [];
    state.users = (d.users || []).map(function(id){ return typeof id === "object" ? id : { id: id }; });
    state.events = d.events || [];
    state.assignments = d.assignments || [];
    state.contracts = d.contracts || [];
    state.amcUsers = d.amcUsers || [];
    state.amcWorks = d.amcWorks || [];
    state.amcStaff = d.amcStaff || [];
    state.amcTransfers = d.amcTransfers || [];
    state.amcEmployees = d.amcEmployees || [];
    state.amcDaily = d.amcDaily || [];
    state.amcTemp = d.amcTemp || [];
    state.amcHours = d.amcHours || [];
    state.amcAssignees = d.amcAssignees || [];
    state.minWage = d.minWage || [];
    state.wageRules = d.wageRules || null;
    state.mandays = d.mandays || [];
    state.avail = d.avail || [];
    state.online = d.online || { count: 0, list: [] };
    var nev = null;
    state.events = state.events.filter(function(x){ if(x.id === NOTICE_ID){ nev = x; return false; } return true; });
    state.notice = nev ? (nev.note || "") : "";
    if(isSupport()){
      if(activeTab !== "home" && activeTab !== "assign") activeTab = "home";
    } else if(activeTab !== "dash" && activeTab !== "assign" && activeTab !== "amp" && activeTab !== "maint" && activeTab !== "follow" && activeTab !== "proc" && activeTab !== "amc" && activeTab !== "misc" && activeTab !== "home" && activeTab !== "works" && activeTab !== "contracts" && !emp(activeTab)) activeTab = "dash";
  }

  // Contracts & AMC admin responses include direct contracts/users arrays as well as a snapshot.
  function applyAdminData(r){
    var j = (r && r.json) || {};
    if(j.data) applyData(j.data);
    if(Array.isArray(j.contracts)) state.contracts = j.contracts;
    if(Array.isArray(j.users)) state.amcUsers = j.users;
  }

  function setStatus(kind,msg){
    var el = $("syncPill"); if(!el) return;
    if(!SYNC){ el.className = "sync"; el.textContent = "Local only – this device"; el.style.cursor = "default"; return; }
    var text = { ok: "Live – synced "+new Date().toLocaleTimeString("en-GB"),
                 saving: "Saving…", offline: "Offline – retrying", error: msg || "Sync problem" }[kind];
    el.className = "sync "+kind; el.textContent = text;
  }

  var KEEP = ["dioQ","inDate","inParty","inVeh","inBy","inPh","inRem","audLQ","audDQ","fuText","fuRem","prDesc","prQty","prUnit","prSt","prPoNo","prPoDt","prRem","exFrom","exTo","exStat","rgFrom","rgTo","rgQ","rgSt","wText","wPri","gpTo","gpFrom","gpVeh","gpTrans","gpOther","gpRecv","gpPhone","gpRem","gpQ","giDesc","giQty","audName","oilName","otType","otLast","otFreq","otUnit","apDesc","apDept","apLink","aWork","aRem","aBy","aTo","aDate","aPri","mpPlan","mpDesc","mpDue","mpComp","mpStat"];
  function softRender(){
    var saved = {}, ae = document.activeElement, focusId = ae && ae.id, pos = 0;
    KEEP.forEach(function(id){ var n = $(id); if(n) saved[id] = n.value; });
    try{ if(ae && ae.selectionStart != null) pos = ae.selectionStart; }catch(e){}
    render();
    KEEP.forEach(function(id){ var n = $(id); if(n && saved[id] !== undefined && saved[id] !== "") n.value = saved[id]; });
    if(focusId && KEEP.indexOf(focusId) >= 0){
      var f = $(focusId);
      if(f){ f.focus(); try{ f.setSelectionRange(pos,pos); }catch(e){} }
    }
  }

  function onSyncError(err){
    if(err && err.server && err.message === "auth"){ doLogout("Your login is no longer valid. Please sign in again."); return; }
    setStatus(err && err.server ? "error" : "offline", err && err.server ? err.message : "");
  }

  /* fetch the latest data; skips quietly if local changes are in flight */
  function pull(force){
    if(!SYNC || !auth) return;
    if(!force && (flushing || queue.length || availBusy)) return;
    if(pullBusy && Date.now() - pullBusy < 30000) return;       // the previous refresh is still on its way: do not pile up another one
    pullBusy = Date.now();
    var v = version;
    var since = (lastTok && Date.now() - lastFullAt < 60000) ? lastTok : "";   // a full reload at least once a minute as a safety net
    api({ action: "getAll", since: since }).then(function(r){
      pullBusy = 0;
      if(!force && (v !== version || flushing || queue.length || availBusy)) return;
      setStatus("ok");
      if(r.json.same){                                           // nothing changed on the server: only refresh the online count
        if(r.json.online){ state.online = r.json.online; paintOnline(); }
        return;
      }
      if(r.text === lastText){ lastTok = r.json.tok || ""; lastFullAt = Date.now(); return; }
      if(modalOpen()){ pendingRefresh = { r: r, v: version }; return; }
      lastText = r.text; lastTok = r.json.tok || ""; lastFullAt = Date.now(); applyData(r.json.data); softRender();
    }).catch(function(err){ pullBusy = 0; onSyncError(err); });
  }

  function commit(ops){
    version++;
    if(!SYNC){ saveLocal(); return; }
    queue = queue.concat(ops);
    setStatus("saving");
    flush();
  }

  function flush(){
    if(flushing || !queue.length || !auth) return;
    flushing = true;
    var n = queue.length, batch = queue.slice(0,n);
    api({ action: "ops", ops: batch }).then(function(r){
      queue.splice(0,n); flushing = false;
      var lost = batch.filter(function(o){ return o.t==='emp.put' && !((r.json.data||{}).employees||[]).some(function(e){ return String(e.id)===String(o.emp.id) && parseEmp(e.name).name === parseEmp(o.emp.name).name; }); });
      if(lost.length){
        try{ alert("The server replied OK but did NOT save the employee correctly.\n\nThe Apps Script deployed on Google is probably an old version. Paste the new Code.gs and use Deploy > Manage deployments > Edit > New version > Deploy."); }catch(e){}
      }
      if(queue.length){ flush(); return; }
      lastText = r.text; setStatus("ok");
      if(!modalOpen()){ lastTok = r.json.tok || ""; lastFullAt = Date.now(); applyData(r.json.data); softRender(); } else { lastTok = ""; }
    }).catch(function(err){
      flushing = false;
      if(err.server && err.message !== "auth"){      // rejected by server: drop and resync
        queue.splice(0,n); setStatus("error", err.message); setTimeout(function(){ pull(true); }, 300);
        try{ alert("The server did not accept the last change, so it was not saved.\n\nReason: "+err.message); }catch(e){}
      } else if(err.server){ onSyncError(err); }
      else { setStatus("offline"); setTimeout(flush, 5000); }
    });
  }

  /* AMP plans use their own actions (ampList / ampPut / ampDel) */
  function ampFetch(){
    if(!SYNC || !auth || ampBusy || isSupport()) return;
    api({ action: "ampList" }).then(function(r){
      if(ampBusy || r.text === ampText) return;
      ampText = r.text; state.amp = r.json.amp || []; state.sched = r.json.sched || state.sched || []; state.fu = r.json.fu || state.fu || []; state.pr = r.json.pr || state.pr || []; state.audits = r.json.audits || state.audits || []; state.audPts = r.json.audPts || state.audPts || []; state.oilEquip = r.json.oilEquip || state.oilEquip || []; state.oilTests = r.json.oilTests || state.oilTests || []; state.calib = r.json.calib || state.calib || []; state.fext = r.json.fext || state.fext || []; state.rlyBays = r.json.relayBays || state.rlyBays || []; state.rly = r.json.relays || state.rly || []; state.maintPerm = r.json.maintPerm || state.maintPerm || null; state.gatePasses = r.json.gatePasses || state.gatePasses || []; state.gateItems = r.json.gateItems || state.gateItems || []; state.inwards = r.json.inwards || state.inwards || []; state.inwardItems = r.json.inwardItems || state.inwardItems || [];
      if(modalOpen()) return;
      if(activeTab === "maint" || activeTab === "follow" || activeTab === "proc" || activeTab === "home" || activeTab === "misc") softRender(); else renderTabs();
    }).catch(function(err){ if(err && err.server && err.message === "auth") onSyncError(err); });
  }
  function ampSend(body){
    version++;
    if(!SYNC){ saveLocal(); return; }
    ampBusy++; setStatus("saving");
    var failed = false;
    ampChain = ampChain.then(function(){ return api(body); }).then(function(r){
      if(ampBusy === 1){ state.amp = r.json.amp || state.amp; if(r.json.sched) state.sched = r.json.sched; if(r.json.fu) state.fu = r.json.fu; if(r.json.pr) state.pr = r.json.pr; if(r.json.audits) state.audits = r.json.audits; if(r.json.audPts) state.audPts = r.json.audPts; if(r.json.oilEquip) state.oilEquip = r.json.oilEquip; if(r.json.oilTests) state.oilTests = r.json.oilTests; if(r.json.calib) state.calib = r.json.calib; if(r.json.fext) state.fext = r.json.fext; if(r.json.relayBays) state.rlyBays = r.json.relayBays; if(r.json.relays) state.rly = r.json.relays; if(r.json.maintPerm) state.maintPerm = r.json.maintPerm; if(r.json.gatePasses) state.gatePasses = r.json.gatePasses; if(r.json.gateItems) state.gateItems = r.json.gateItems; if(r.json.inwards) state.inwards = r.json.inwards; if(r.json.inwardItems) state.inwardItems = r.json.inwardItems; ampText = r.text; }
      setStatus("ok");
    }).catch(function(err){
      failed = true; ampText = "";
      if(err && err.server && err.message === "auth"){ onSyncError(err); return; }
      setStatus(err && err.server ? "error" : "offline", err && err.server ? "AMP not saved: "+err.message : "");
    }).then(function(){
      ampBusy--;
      if(ampBusy) return;
      if(failed) ampFetch();
      else if(!modalOpen() && (activeTab === "maint" || activeTab === "follow" || activeTab === "proc" || activeTab === "misc")) softRender();
    });
  }

  /* op builders */
  function wput(e,w){
    return { t: "work.put", work: { id: w.id, empId: e.id, date: w.date, text: w.text, done: !!w.done,
             doneAt: w.doneAt || null, movedFrom: w.movedFrom || "", comment: w.comment || "", created: w.created,
             priority: wpri(w), xferFrom: w.xferFrom || "", apr: !!w.apr, mh: !!w.mh } };
  }
  /* priority of a daily work: normal (black) | high (yellow) | urgent (red) */
  function wpri(w){ return (w && (w.priority === "high" || w.priority === "urgent")) ? w.priority : "normal"; }
  var WP_LABEL = { normal:"Normal", high:"High", urgent:"Urgent" };
  var WP_PRINT = { normal:"#000", high:"#c99700", urgent:"#d11a0a" };
  function wpriOptions(sel){
    return ["normal","high","urgent"].map(function(k){ return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+WP_LABEL[k]+'</option>'; }).join("");
  }
  function wpriTag(w){ var p = wpri(w); return p === "normal" ? "" : ' <span class="pri p-'+p+'">'+WP_LABEL[p]+'</span>'; }
  function wpriPrint(w){   // coloured work text for the PDF exports
    var p = wpri(w); return p === "normal" ? "" : ' style="color:'+WP_PRINT[p]+';font-weight:700"';
  }

  /* ---------- Transfer of a work to ANOTHER employee: pending -> accepted / declined ---------- */
  function xfersIn(empId){ return (state.xfers||[]).filter(function(x){ return x.status === "pending" && x.toEmp === empId; }); }
  function xferOut(wId){ return (state.xfers||[]).find(function(x){ return x.status === "pending" && x.workId === wId; }); }
  function xferDeclined(wId){ var c = Date.now() - 3*86400000; return (state.xfers||[]).find(function(x){ return x.status === "declined" && x.workId === wId && (x.resolved||0) >= c; }); }
  function xferSend(e, w, toEmp, date){
    var to = emp(toEmp); if(!to) return;
    var x = { id: uid(), workId: w.id, fromEmp: e.id, fromName: e.name, toEmp: toEmp, toName: to.name, text: w.text, priority: wpri(w),
              fromDate: w.date, date: date, status: "pending", created: Date.now(), resolved: 0 };
    state.xfers = (state.xfers||[]).concat([x]);
    commit([{ t: "xfer.req", id: x.id, workId: w.id, toEmp: toEmp, date: date }]); render();
  }
  function xferAccept(x){
    var rec = emp(x.toEmp); if(!rec) return;
    var snd = emp(x.fromEmp), nid = uid();
    if(snd) snd.works = snd.works.filter(function(w){ return w.id !== x.workId; });
    rec.works.push({ id: nid, text: x.text, date: x.date, done: false, doneAt: null, movedFrom: "", comment: "", created: Date.now(), priority: x.priority, xferFrom: x.fromName });
    x.status = "accepted"; x.resolved = Date.now();
    commit([{ t: "xfer.accept", id: x.id, newId: nid }]);
    viewDate = x.date; filter = "all"; render();
  }
  function xferDecline(x){ x.status = "declined"; x.resolved = Date.now(); commit([{ t: "xfer.decline", id: x.id }]); render(); }
  function xferCancel(x){ state.xfers = state.xfers.filter(function(r){ return r.id !== x.id; }); commit([{ t: "xfer.cancel", id: x.id }]); render(); }

  /* ---------- Login session: 7 days, renewed by activity, silent sign-out; header shows the last login time ----------
     The login is kept in localStorage (falls back to sessionStorage) so a page refresh,
     a reopened tab or a restarted installed app does not sign the person out. */
  function authStoreSet(v){ var t = JSON.stringify(v); try{ localStorage.setItem("kss_auth", t); }catch(e){} try{ sessionStorage.setItem("kss_auth", t); }catch(e){} }
  function authStoreGet(){ var t = null; try{ t = localStorage.getItem("kss_auth"); }catch(e){} if(!t){ try{ t = sessionStorage.getItem("kss_auth"); }catch(e){} } try{ return JSON.parse(t || "null"); }catch(e){ return null; } }
  function authStoreClear(){ try{ localStorage.removeItem("kss_auth"); }catch(e){} try{ sessionStorage.removeItem("kss_auth"); }catch(e){} }
  var SESSION_MIN = 7 * 24 * 60, SESSION_LABEL = "7 days", SESSION_MS = SESSION_MIN * 60000, sessExp = 0, sessTick = null, sessLastBump = 0;
  var lastLoginTxt = "";
  function llKey(id){ return "kss_lastlogin_" + id; }
  function llNote(id, fresh){            // fresh = a real sign-in (not a page refresh): remember this login, show the one before it
    var ll = null; try{ ll = JSON.parse(localStorage.getItem(llKey(id)) || "null"); }catch(e){}
    ll = ll || {};
    if(fresh){ ll = { prev: ll.cur || 0, cur: Date.now() }; }
    else if(!ll.cur){ ll = { prev: 0, cur: Date.now() }; }
    try{ localStorage.setItem(llKey(id), JSON.stringify(ll)); }catch(e){}
    lastLoginTxt = ll.prev ? "Last login: " + fmtStamp(ll.prev) : "First login on this device";
  }
  function sessSave(){
    if(auth) authStoreSet({ role: auth.role, id: auth.id, pass: auth.pass, exp: sessExp });
  }
  function sessPaint(){
    var el = $("sessLabel");
    if(!session){ if(el){ el.textContent = ""; el.classList.remove("warn"); } return; }
    var left = sessExp - Date.now();
    if(left <= 0){
      if(SYNC && (flushing || queue.length)){ sessExp = Date.now() + 60000; left = 60000; }   // never drop unsaved changes
      else { doLogout(); return; }                                                            // silent sign-out after 7 days
    }
    if(el){ el.textContent = lastLoginTxt; el.classList.remove("warn"); }
  }
  function sessBump(){
    if(!session) return;
    var n = Date.now();
    if(n > sessExp){ sessPaint(); return; }
    if(n - sessLastBump < 5000) return;
    sessLastBump = n; sessExp = n + SESSION_MS;
    if(SYNC) sessSave();
    sessPaint();
  }
  function sessStart(){
    sessLastBump = Date.now(); sessExp = sessLastBump + SESSION_MS;
    if(SYNC) sessSave();
    clearInterval(sessTick); sessTick = setInterval(sessPaint, 30000); sessPaint();
  }
  ["click","keydown","touchstart","mousemove","scroll"].forEach(function(ev){
    document.addEventListener(ev, sessBump, { passive: true, capture: true });
  });

  /* ---------- Login ---------- */
  function setRole(r){
    loginRole = r;
    $("roleUser").classList.toggle("active", r==="user");
    $("roleSupport").classList.toggle("active", r==="support");
    $("roleMaster").classList.toggle("active", r==="master");
    $("loginErr").textContent = "";
    $("forgotBtn").classList.toggle("hidden", r==="master");
    $("loginId").value = ""; $("loginPass").value = "";
    $("loginId").focus();
  }
  $("roleUser").onclick = function(){ setRole("user"); };

      $("fpOk").textContent = "Password changed. You can sign in with the new password now.";
      ["fpId","fpOld","fpNew","fpNew2"].forEach(function(x){ $(x).disabled = true; });
      btn.textContent = "Changed"; btn.disabled = true;
      $("loginId").value = id; $("loginPass").value = "";
    }
    function send(){
      var id = $("fpId").value.trim(), oldP = $("fpOld").value, nw = $("fpNew").value, nw2 = $("fpNew2").value;
      $("fpErr").textContent = ""; $("fpOk").textContent = "";
      if(!id || !oldP || !nw){ $("fpErr").textContent = "Fill in User ID, old password and new password."; return; }
      if(nw.length < 4){ $("fpErr").textContent = "New password must be at least 4 characters."; return; }
      if(nw !== nw2){ $("fpErr").textContent = "New password and confirmation do not match."; return; }
      if(nw === oldP){ $("fpErr").textContent = "New password must be different from the old one."; return; }
      if(!SYNC){
        var u = state.users.find(function(x){ return x.id === id && x.pass === oldP; });
        if(!u){ $("fpErr").textContent = "Wrong User ID or old password."; return; }
        u.pass = nw; saveLocal(); success(id); return;
      }
      btn.disabled = true; btn.textContent = "Changing…";
      auth = null;
      api({ action: "changePassword", userId: id, oldPass: oldP, newPass: nw }).then(function(){
        success(id);

        $("fpErr").textContent = err.server
          ? (err.message === "auth" ? "Wrong User ID or old password." : "Could not change the password ("+err.message+").")
          : "Cannot reach the server. Check your internet connection.";
        btn.disabled = false; btn.textContent = "Change password";
      });
    }

  /* restore session after page refresh (sync mode) */
  function endRestore(){ document.documentElement.classList.remove("restoring"); }

    try{
      var saved = authStoreGet();
      if(saved && saved.exp && saved.exp < Date.now()){
        authStoreClear(); saved = null;                  // expired: show the normal sign-in page, no message
      }
      if(!saved) endRestore();
      if(saved){
        var restoreTry = 0;
        (function restore(){
          auth = { role: saved.role, id: saved.id, pass: saved.pass };
          api({ action: "login" }).then(function(r){
            applyData(r.json.data); lastText = r.text; lastTok = r.json.tok || ""; lastFullAt = Date.now(); enterApp(r.json.role || auth.role, auth.id, r.json.user);
          }).catch(function(err){

            if(++restoreTry < 4){ setTimeout(restore, 3000); return; }                                                                                // network hiccup: keep the saved login and retry
            endRestore(); $("loginErr").textContent = "Cannot reach the server. Refresh the page to continue your session.";
          });
        })();
      }
    }catch(e){ endRestore(); }
  }

  /* ---------- Notices (Master sets one or more; shown in the ticker and on Home) ---------- */
  var NSEP = " \u00A6 ", NMAX = 300;      // notices are stored in one text value, separated by " ¦ "
  function noticeList(){ return String(state.notice || "").split("\u00A6").map(function(x){ return x.trim(); }).filter(Boolean); }

  /* Office Calendar -> automatic Notice ticker.
     Calendar events are not copied into the stored manual notices; they are generated
     dynamically so edits/deletes in Office Calendar are reflected automatically. */
  function officeEventNotices(){
    var t = today();
    return state.events
      .filter(function(ev){ return ev.id !== NOTICE_ID && ev.scope === "office" && ev.date && ev.date >= t; })
      .sort(function(a,b){
        return a.date.localeCompare(b.date) || evSort(a,b);
      })
      .slice(0,8)
      .map(function(ev){
        var when = dayLabel(ev.date) + (ev.time ? " – " + ev.time : "");
        return when + " — " + ev.title;
      });
  }

  function allNoticeItems(){
    return noticeList().concat(officeEventNotices());
  }

  function renderNotice(){
    var list = allNoticeItems();
    var txt = list.join("\u00A6");
    if(txt === noticeShown) return;
    noticeShown = txt;
    var bar = $("noticeBar"); if(!bar) return;
    if(!list.length){ bar.classList.add("hidden"); return; }
    $("noticeText").innerHTML = list.map(function(n){ return '<span class="ni">'+esc(n)+'</span>'; }).join("");
    bar.classList.remove("hidden");
    var track = $("noticeTrack");
    track.style.animation = "none"; void track.offsetWidth;       // restart from the right edge
    track.style.setProperty("--dur", Math.max(45, Math.round(track.offsetWidth / 35)) + "s");   // ~35 px/s (slow, easy to read)
    track.style.animation = "";
  }

  function noticeModal(){
    var items = noticeList(); if(!items.length) items = [""];
    function clean(arr){ return arr.map(function(x){ return x.replace(/\s+/g," ").trim(); }).filter(Boolean); }
    function collect(){
      var out = [];
      Array.prototype.forEach.call(document.querySelectorAll("[data-nt]"),function(i){ out.push(i.value.replace(/\u00A6/g,"|")); });
      return out;
    }
    function count(){
      var n = clean(collect()).join(NSEP).length, c = $("ntCount");
      c.textContent = n+" / "+NMAX+" characters"; c.style.color = n > NMAX ? "var(--red)" : "var(--muted)";
    }
    function save(v){
      state.notice = v; closeModal();
      commit(v ? [{ t:"ev.put", ev:{ id:NOTICE_ID, scope:"office", date:today(), time:"", title:"NOTICE", cat:"other", note:v, created:1 } }]
               : [{ t:"ev.del", id:NOTICE_ID }]);
      noticeShown = null; render();
    }
    function draw(focusIdx){
      openModal('<h3>Notices</h3>'+
        '<p style="margin:0 0 10px;color:var(--muted);font-size:.92rem">These scroll across the top for everyone and are listed on the Home screen. Add as many as fit in the limit below.</p>'+
        items.map(function(v,i){
          return '<div class="row" style="align-items:center;margin-bottom:8px"><input type="text" data-nt="'+i+'" value="'+esc(v)+'" maxlength="300" placeholder="Notice '+(i+1)+'">'+
                 '<button class="btn danger small" style="flex:0 0 auto" data-ntdel="'+i+'" type="button" aria-label="Remove this notice">&#10005;</button></div>';
        }).join("")+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px">'+
          '<button class="btn ghost small" id="ntAdd" type="button">+ Add another notice</button>'+
          '<span id="ntCount" style="font-size:.85rem"></span></div>'+
        '<p class="error" id="ntErr"></p>'+
        '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button>'+
        '<button class="btn danger" id="ntClear" type="button">Remove all</button>'+
        '<button class="btn" id="mOk" type="button">Save</button></div>');
      $("mNo").onclick = closeModal;
      Array.prototype.forEach.call(document.querySelectorAll("[data-nt]"),function(i){ i.oninput = count; });
      Array.prototype.forEach.call(document.querySelectorAll("[data-ntdel]"),function(b){
        b.onclick = function(){ items = collect(); items.splice(+b.getAttribute("data-ntdel"),1); if(!items.length) items = [""]; draw(); };
      });
      $("ntAdd").onclick = function(){ items = collect(); items.push(""); draw(items.length-1); };
      $("ntClear").onclick = function(){ save(""); };
      $("mOk").onclick = function(){
        var v = clean(collect()).join(NSEP);
        if(v.length > NMAX){ $("ntErr").textContent = "Too long by "+(v.length-NMAX)+" characters. Shorten or remove a notice."; return; }
        save(v);
      };
      count();
      var f = document.querySelector('[data-nt="'+(focusIdx == null ? 0 : focusIdx)+'"]'); if(f) f.focus();
    }
    draw();
  }

  function wageRateOn(skill, date){

    (state.minWage||[]).forEach(function(r){ if(r.skill === skill && r.effective <= date && (!best || r.effective > best.effective)) best = r; });
    return best ? parseFloat(best.rate) : 0;

  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  /* Wages of ONE AMC staff for a month (ym = "YYYY-MM"): paid days = P + 1/2 for FHL / SHL + NH, each day at the minimum wage rate in force on that date */
  function wageCalc(s, ym){
    var rules = wrGet(), last = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(), t = today();
    var rec = {}; (state.amcDaily||[]).forEach(function(x){ if(x.staffId === s.id && x.date.slice(0,7) === ym) rec[x.date] = x.attendance; });
    var c = { P:0, A:0, FHL:0, SHL:0, NH:0 }, nu = 0, segs = [], gross = 0, missing = false;
    for(var i = 1; i <= last; i++){
      var d = ym+"-"+pad2(i), a = rec[d];
      if(!a){ if(d <= t) nu++; continue; }
      if(c[a] != null) c[a]++;
      var w = (a === "P" || a === "NH") ? 1 : (a === "FHL" || a === "SHL") ? 0.5 : 0;
      if(!w) continue;
      var rate = wageRateOn(s.skill, d);
      if(!(rate > 0)){ missing = true; continue; }
      gross += w*rate;
      var sg = segs.find(function(z){ return z.rate === rate; });
      if(!sg){ sg = { rate:rate, days:0 }; segs.push(sg); }
      sg.days += w;
    }
    gross = r2(gross);
    var line = function(k, rnd){ var x = rules[k]; if(!x.on) return null; var base = Math.min(gross, x.max); return { pct:x.pct, max:x.max, base:r2(base), amt: rnd(base*x.pct/100) }; };
    var bonus = line("bonus", Math.round), pf = line("pf", Math.round), esi = line("esi", Math.ceil);
    var net = r2(gross + (bonus ? bonus.amt : 0) - (pf ? pf.amt : 0) - (esi ? esi.amt : 0));
    return { staff:s, ym:ym, days:last, c:c, nu:nu, paid: c.P + (c.FHL + c.SHL)/2 + c.NH, segs:segs, gross:gross, bonus:bonus, pf:pf, esi:esi, net:net, missing:missing };
  }

            '<td>'+(c.bonus ? money(c.bonus.amt) : '&ndash;')+'</td><td>'+(c.pf ? money(c.pf.amt) : '&ndash;')+'</td><td>'+(c.esi ? money(c.esi.amt) : '&ndash;')+'</td><td><b>'+money(c.net)+'</b></td></tr>';

  function slipExport(calcs){

    var body = calcs.map(function(c){
      var er = c.segs.length ? c.segs.map(function(z){ return '<tr><td class="l">Wages &ndash; '+z.days+' day'+(z.days===1?'':'s')+' @ '+money(z.rate)+' / day</td><td class="r">'+money(z.days*z.rate)+'</td></tr>'; }).join("") : '<tr><td class="l">Wages</td><td class="r">'+money(0)+'</td></tr>';

      if(c.esi) dd += '<tr><td class="l">ESI &ndash; '+c.esi.pct+'% of '+money(c.esi.base)+(c.gross > c.esi.max ? ' <small>(limit '+money(c.esi.max)+')</small>' : '')+'</td><td class="r">'+money(c.esi.amt)+'</td></tr>';
      if(!dd) dd = '<tr><td class="l" style="color:#5d6b78">No deductions</td><td class="r">'+money(0)+'</td></tr>';
      var earn = c.gross + (c.bonus ? c.bonus.amt : 0), ded = (c.pf ? c.pf.amt : 0) + (c.esi ? c.esi.amt : 0);

        '<table style="margin-top:12px"><tbody><tr class="net"><td class="l" style="font-size:12pt">NET PAY</td><td class="r" style="font-size:12pt">'+money(c.net)+'</td></tr></tbody></table>'+

        '<div class="sg"><div>Employee signature</div><div>Contractor / AMC</div><div>Verified by (POWERGRID)</div></div>'+docFoot()+'</div>';
    }).join("");

  /* ---------- Mandays: allotted by Master per contract and skill category (incl. TEMP); used = from attendance; balance visible to all ---------- */
  var MD_CATS = AMC_SKILLS.concat(AMC_SKILLS.map(function(k){ return k+" (TEMP)"; }));
  var mdContract = "";
  function mdEntry(cid, cat){ return (state.mandays||[]).find(function(x){ return x.contractId === cid && x.category === cat; }) || null; }
  function mdNum(n){ return String(r2(n)); }
  function mdBal(e){ return e && e.allotted != null ? r2(e.allotted - e.used) : null; }
  function mdBalHTML(b){ return b === null ? '<span style="color:var(--muted)">&ndash;</span>' : '<b style="color:'+(b < 0 ? 'var(--red)' : '#1a7f37')+'">'+(b < 0 ? '&minus;'+mdNum(-b) : mdNum(b))+'</b>'; }
  function mandaysTable(cid, edit){
    var h = '<div style="overflow-x:auto"><table><thead><tr><th>Category</th><th>Allotted</th><th>Used</th><th>Balance</th></tr></thead><tbody>';
    MD_CATS.forEach(function(cat, i){
      var e = mdEntry(cid, cat), isTemp = cat.indexOf("(TEMP)") > 0;
      h += '<tr'+(isTemp ? ' style="background:rgba(0,0,0,.025)"' : '')+'><td><b>'+esc(cat)+'</b></td><td>'+
        (edit ? '<input type="number" min="0" step="any" inputmode="decimal" data-mdi="'+i+'" style="width:110px" value="'+(e && e.allotted != null ? esc(mdNum(e.allotted)) : '')+'" placeholder="not set">'
              : (e && e.allotted != null ? mdNum(e.allotted) : '<span style="color:var(--muted)">Not set</span>'))+'</td>'+
        '<td>'+mdNum(e ? e.used : 0)+'</td><td>'+mdBalHTML(mdBal(e))+'</td></tr>';
    });
    return h+'</tbody></table></div><p style="margin:8px 0 0;color:var(--muted);font-size:.82rem">Used = attendance updated by the AMC login: Present = 1 manday, First / Second half leave = &frac12;. The balance reduces automatically; a negative balance (red) means the allotted mandays are exceeded. (TEMP) rows count the temporary labour of that skill.</p>';
  }
  function mandaysHTML(master, onlyOwn){
    var cts = state.contracts || [];
    if(!cts.length) return '<div class="empty">No contracts yet.</div>';
    if(!cts.some(function(c){ return c.id === mdContract; })) mdContract = cts[0].id;
    var h = '<div class="panel-head"><h3>Mandays balance</h3></div>'+
      (master ? '<p style="margin:-6px 0 12px;color:var(--muted);font-size:.9rem">'+'Enter the initial mandays of each contract and skill category. Used mandays and the balance are calculated automatically from the daily attendance.'+'</p>' : '');
    if(cts.length > 1) h += '<div class="filters"><select id="mdCt" aria-label="Contract">'+cts.map(function(c){ return '<option value="'+esc(c.id)+'"'+(c.id===mdContract?' selected':'')+'>'+esc(c.name)+'</option>'; }).join("")+'</select></div>';
    else h += '<p style="margin:0 0 10px"><b>Contract:</b> '+esc(cts[0].name)+(cts[0].agency ? ' &middot; '+esc(cts[0].agency) : '')+'</p>';
    h += mandaysTable(mdContract, master);
    if(master) h += '<p class="error" id="mdErr"></p><button class="btn" id="mdSave" type="button" style="margin-top:10px">Save mandays</button>';
    return h;
  }
  function bindMandays(p, master){
    var sel = $("mdCt"); if(sel) sel.onchange = function(){ mdContract = sel.value; renderPanel(); };
    var sv = $("mdSave"); if(!sv) return;
    sv.onclick = function(){
      var items = [], err = $("mdErr"); err.textContent = "";
      var ok = Array.prototype.every.call(p.querySelectorAll("[data-mdi]"),function(inp){
        var cat = MD_CATS[+inp.getAttribute("data-mdi")], v = inp.value.trim();
        if(v !== "" && !(parseFloat(v) >= 0)){ err.textContent = "Enter valid mandays for "+cat+"."; return false; }
        items.push({ category:cat, allotted: v === "" ? null : parseFloat(v) }); return true;
      });
      if(!ok) return;
      amcCall({ action:"mandaysPut", contractId:mdContract, items:items }, function(){ alert("Mandays saved."); });
    };
  }
  function renderMandaysPanel(){

  /* ----- Overtime / early leave panel (Master adjusts; everyone else views) ----- */

      '<p style="margin:-6px 0 12px;color:var(--muted);font-size:.9rem">Hours are recorded when the AMC login marks a worker\u2019s work as COMPLETED (late = extra hours, early = less hours). '+
      (master ? 'Use \u201cAdjust\u201d to deduct hours when a worker takes leave against his accumulated hours.' : '')+'</p>';
    if(multi) h += '<div class="filters"><select id="amcFilter" aria-label="Filter by contract"><option value="all">All contracts</option>'+
      state.contracts.map(function(c){ return '<option value="'+esc(c.id)+'"'+(amcFilter===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join("")+'</select></div>';
    if(!staff.length) return h+'<div class="empty">No AMC staff.</div>';
    h += '<div style="overflow-x:auto"><table class="atable"><thead><tr><th>#</th><th>Name</th><th>Skill</th>'+(multi?'<th>Contract</th>':'')+'<th>Extra hours (late)</th><th>Less hours (early / leave)</th><th>Balance</th>'+(master?'<th></th>':'')+'</tr></thead><tbody>';
    staff.forEach(function(s,i){
      var rows = (state.amcHours||[]).filter(function(x){ return x.staffId === s.id; });
      var plus = r2(rows.reduce(function(a,x){ return x.hours > 0 ? a+x.hours : a; },0)), minus = r2(rows.reduce(function(a,x){ return x.hours < 0 ? a+x.hours : a; },0));
      h += '<tr><td data-label="#">'+(i+1)+'</td><td data-label="Name"><b>'+esc(s.name)+'</b></td><td data-label="Skill">'+esc(s.skill)+'</td>'+(multi?'<td data-label="Contract">'+esc(contractName(s.contractId))+'</td>':'')+
        '<td data-label="Extra hours">'+(plus ? '+'+hrsNum(plus)+' h' : '–')+'</td><td data-label="Less hours">'+(minus ? '&minus;'+hrsNum(minus)+' h' : '–')+'</td><td data-label="Balance">'+hrsBalHTML(r2(plus+minus))+'</td>'+

    });
    h += '</tbody></table></div>';
    if(hoursSel !== "all" && !staff.some(function(x){ return x.id === hoursSel; })) hoursSel = "all";
    var ids = {}; staff.forEach(function(x){ ids[x.id] = true; });
    var led = (state.amcHours||[]).filter(function(x){ return ids[x.staffId] && (hoursSel === "all" || x.staffId === hoursSel); })
      .sort(function(a,b){ return b.date.localeCompare(a.date) || b.created - a.created; }).slice(0,100);
    h += '<h3 class="sec">Hours history</h3><div class="filters"><select id="hrSel" aria-label="Select worker"><option value="all">All AMC staff</option>'+
      staff.map(function(x){ return '<option value="'+esc(x.id)+'"'+(hoursSel===x.id?' selected':'')+'>'+esc(x.name)+'</option>'; }).join("")+'</select></div>';
    if(!led.length) return h+'<div class="empty">No hours recorded yet.</div>';
    h += '<div style="overflow-x:auto"><table class="atable"><thead><tr><th>Date</th><th>Name</th><th>Hours</th><th>Entry</th><th>Note</th><th>By</th>'+(master?'<th></th>':'')+'</tr></thead><tbody>'+
      led.map(function(x){
        return '<tr><td data-label="Date">'+esc(fmtDate(x.date))+'</td><td data-label="Name">'+esc(x.staffName)+'</td>'+
          '<td data-label="Hours">'+(x.hours > 0 ? '<b style="color:#1a7f37">+'+hrsNum(x.hours)+' h</b>' : x.hours < 0 ? '<b style="color:var(--red)">&minus;'+hrsNum(x.hours)+' h</b>' : '0 h')+'</td>'+
          '<td data-label="Entry">'+(x.kind === "adjust" ? 'Master adjustment' : 'Check-out ('+esc(hrsLabel(x.hours))+')')+'</td><td data-label="Note">'+(x.note ? esc(x.note) : '–')+'</td><td data-label="By">'+esc(x.by)+'</td>'+
          (master ? '<td class="act" style="width:auto">'+(x.kind === "adjust" ? '<button class="btn danger small" data-hrdel="'+esc(x.id)+'" type="button">Remove</button>' : '')+'</td>' : '')+'</tr>';
      }).join("")+'</tbody></table></div>'+(led.length >= 100 ? '<p style="color:var(--muted);font-size:.85rem">Showing the latest 100 entries.</p>' : '');
    return h;
  }

  /* ---------- Calendar (shared by office + employee calendars) ---------- */
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var CATS = { meeting:"Meeting", leave:"Leave / Holiday", maintenance:"Maintenance", training:"Training", other:"Other" };
  function catOf(ev){ return CATS[ev.cat] ? ev.cat : "other"; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function canEditCal(scope){ return scope === "office" ? isMaster() : true; }
  function evSort(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99") || (a.created||0)-(b.created||0); }
  function getCal(scope){
    if(!calMonths[scope]){ var d = new Date(); calMonths[scope] = { y: d.getFullYear(), m: d.getMonth() }; }
    return calMonths[scope];
  }

  function calHTML(scope){
    var c = getCal(scope), mk = c.y+"-"+pad2(c.m+1), t = today();
    var evs = state.events.filter(function(ev){ return ev.scope===scope && ev.date.slice(0,7)===mk; }).sort(function(a,b){
      return a.date.localeCompare(b.date) || evSort(a,b);
    });
    var by = {};
    evs.forEach(function(ev){ (by[ev.date] = by[ev.date] || []).push(ev); });
    var lead = new Date(c.y,c.m,1).getDay(), dim = new Date(c.y,c.m+1,0).getDate(), i, d;

    var h = '<div class="calbar">'+
      '<button class="btn ghost small" data-cnav="-1" type="button" aria-label="Previous month">‹</button>'+
      '<strong class="caltitle">'+MONTHS[c.m]+' '+c.y+'</strong>'+
      '<button class="btn ghost small" data-cnav="1" type="button" aria-label="Next month">›</button>'+
      '<button class="btn small" data-cnav="0" type="button">This month</button></div>';
    h += '<div class="calgrid">';
    WDAYS.forEach(function(n){ h += '<div class="cwd">'+n+'</div>'; });
    for(i=0;i<lead;i++) h += '<div class="cday blank"></div>';
    for(d=1; d<=dim; d++){
      var iso = mk+"-"+pad2(d), list = by[iso] || [];
      h += '<button type="button" class="cday'+(iso===t?" today":"")+(list.length?" has":"")+'" data-day="'+iso+'" aria-label="'+esc(fmtDate(iso))+(list.length?", "+list.length+" event(s)":"")+'">'+
           '<span class="dn">'+d+'</span>';
      list.slice(0,2).forEach(function(ev){
        h += '<span class="ev c-'+catOf(ev)+'">'+(ev.time?esc(ev.time)+' ':'')+esc(ev.title)+'</span>';
      });
      if(list.length>2) h += '<span class="more">+'+(list.length-2)+' more</span>';
      if(list.length) h += '<span class="dots">'+list.map(function(ev){ return '<i class="c-'+catOf(ev)+'"></i>'; }).join("")+'</span>';
      h += '</button>';
    }
    h += '</div>';
    h += '<div class="legend">'+Object.keys(CATS).map(function(k){ return '<span><i class="c-'+k+'"></i>'+CATS[k]+'</span>'; }).join("")+'</div>';

    h += '<h4 class="agenda-h">Events in '+MONTHS[c.m]+' '+c.y+'</h4>';
    if(!evs.length){
      h += '<div class="empty">No events this month.'+(canEditCal(scope)?' Click a date to add one.':'')+'</div>';
    } else {
      h += '<ul class="agenda">'+evs.map(function(ev){
        var k = catOf(ev);
        return '<li><button type="button" class="ag c-'+k+'" data-day="'+ev.date+'">'+
          '<span class="agd">'+parseISO(ev.date).getDate()+' '+WDAYS[parseISO(ev.date).getDay()]+'</span>'+
          '<span class="agb"><b>'+(ev.time?esc(ev.time)+' – ':'')+esc(ev.title)+'</b>'+
          '<small>'+CATS[k]+(ev.note?' – '+esc(ev.note):'')+'</small></span></button></li>';
      }).join("")+'</ul>';
    }
    return h;
  }

  function bindCal(scope, root){
    Array.prototype.forEach.call(root.querySelectorAll("[data-cnav]"),function(b){
      b.onclick = function(){
        var n = +b.getAttribute("data-cnav"), c = getCal(scope);
        if(n === 0){ var d = new Date(); c.y = d.getFullYear(); c.m = d.getMonth(); }
        else { c.m += n; if(c.m<0){ c.m = 11; c.y--; } if(c.m>11){ c.m = 0; c.y++; } }
        render();
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-day]"),function(b){
      b.onclick = function(){ dayModal(scope, b.getAttribute("data-day")); };
    });
  }

        '<div class="row"><div><label for="evTime">Time (optional)</label><input type="time" id="evTime" value="'+esc(ed?(ed.time||""):"")+'"></div>'+

        '</select></div></div>'+
        '<div class="field"><label for="evNote">Note (optional)</label><input type="text" id="evNote" maxlength="300" value="'+esc(ed?(ed.note||""):"")+'"></div>'+

    }

      else { ev = { id: uid(), scope: scope, date: date, time: time, title: title, cat: cat, note: note, created: Date.now() }; state.events.push(ev); }
      commit([{ t:"ev.put", ev: { id:ev.id, scope:ev.scope, date:ev.date, time:ev.time, title:ev.title, cat:ev.cat, note:ev.note, created:ev.created } }]);
      render(); dayModal(scope, date);

    Array.prototype.forEach.call(document.querySelectorAll("[data-eedit]"),function(b){
      b.onclick = function(){ dayModal(scope, date, b.getAttribute("data-eedit")); };

    Array.prototype.forEach.call(document.querySelectorAll("[data-edel]"),function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-edel"), ev = state.events.find(function(x){ return x.id===id; });
        confirmModal("Delete event “"+(ev?ev.title:"")+"”?", function(){
          state.events = state.events.filter(function(x){ return x.id!==id; });
          commit([{ t:"ev.del", id:id }]); render(); dayModal(scope, date);
        });
