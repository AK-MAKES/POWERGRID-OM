<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOZHIKODE SS – Daily Work Manager</title>
<style>
  :root{
    --ink:#16212b; --muted:#5d6b78; --line:#d5dce2; --bg:#eef1f4; --panel:#ffffff;
    --steel:#1f3a52; --steel-2:#2d5373; --amber:#e0a100; --amber-bg:#fff4d1;
    --green:#1f8a4c; --green-bg:#dff3e6; --red:#c0392b;
    --font: "Segoe UI", system-ui, -apple-system, "Noto Sans", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.45}
  button,input,select{font:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #loginView{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:
      repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.05) 47px 48px),
      linear-gradient(160deg,var(--steel) 0%,#12273a 100%)}
  .login-card{width:100%;max-width:400px;background:var(--panel);border-radius:6px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .login-head{padding:26px 28px 18px;border-bottom:4px solid var(--amber)}
  .login-head h1{margin:0;font-size:1.55rem;letter-spacing:.5px;color:var(--steel)}
  .login-head p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  .role-switch{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .role-switch button{padding:13px;border:0;background:#f4f6f8;color:var(--muted);font-weight:600;
    border-bottom:3px solid transparent}
  .role-switch button.active{background:#fff;color:var(--steel);border-bottom-color:var(--steel)}
  .login-body{padding:22px 28px 28px}
  label{display:block;font-size:.9rem;font-weight:600;margin:0 0 5px}
  input[type=text],input[type=password],input[type=date]{width:100%;padding:10px 12px;border:1px solid #b9c3cc;
    border-radius:4px;background:#fff;color:var(--ink)}
  .field{margin-bottom:14px}
  .btn{padding:10px 18px;border:0;border-radius:4px;background:var(--steel);color:#fff;font-weight:600}
  .btn:hover{background:var(--steel-2)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.wide{width:100%}
  .btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--steel)}
  .btn.ghost:hover{background:#e6edf3}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#a02e22}
  .btn.small{padding:6px 11px;font-size:.85rem}
  .error{color:var(--red);font-size:.9rem;min-height:1.3em;margin:0 0 10px}
  .mode-note{margin:14px 0 0;font-size:.8rem;color:var(--muted)}

  /* ---------- App ---------- */
  header.top{background:var(--steel);color:#fff;border-bottom:4px solid var(--amber)}
  .top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top-in h2{margin:0;font-size:1.2rem;letter-spacing:.4px;flex:1;min-width:200px}
  .who{font-size:.9rem;opacity:.9}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--amber);color:#2a2000;
    font-size:.78rem;font-weight:700;margin-left:6px}
  .top-in .btn{background:rgba(255,255,255,.14)}
  .top-in .btn:hover{background:rgba(255,255,255,.26)}
  .sync{font-size:.8rem;padding:3px 11px 3px 24px;border-radius:99px;background:rgba(255,255,255,.14);
    cursor:pointer;position:relative;user-select:none}
  .sync::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#8aa0b3}
  .sync.ok::before{background:#4cd98a}
  .sync.saving::before{background:var(--amber)}
  .sync.offline::before,.sync.error::before{background:#ff6b5b}

  main{max-width:1100px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .tab{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;
    background:#e1e7ec;color:var(--ink);font-weight:600;white-space:nowrap}
  .tab .cnt{margin-left:7px;font-size:.78rem;padding:1px 7px;border-radius:99px;background:var(--amber-bg);color:#6b5000}
  .tab .cnt.zero{background:var(--green-bg);color:#14602f}
  .tab.active{background:var(--panel);border-color:var(--steel);box-shadow:inset 0 3px 0 var(--steel)}
  .tab.add{background:transparent;border-style:dashed;color:var(--steel)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:18px;margin-top:-1px}
  .panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head h3{margin:0;font-size:1.25rem}
  .stats{display:flex;gap:16px;font-size:.92rem;color:var(--muted)}
  .stats b{color:var(--ink)}
  .mbar{margin:-6px 0 14px;display:flex;gap:8px;flex-wrap:wrap}
  .progress{height:8px;border-radius:99px;background:#e3e8ec;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

  .datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;
    background:var(--steel);border-radius:6px;color:#fff}
  .datebar input[type=date]{width:auto;padding:6px 10px}
  .datebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
  .datebar .btn.ghost:hover{background:rgba(255,255,255,.15)}
  .datebar .btn:not(.ghost){background:var(--amber);color:#2a2000}
  .datebar .btn:disabled{opacity:.5;cursor:default}
  .dlabel{font-weight:600;margin-left:auto}
  .carry{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--amber-bg);border:1px solid #ecc85a;border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
  .chip{border:1px solid #c9a227;background:#fff;border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;font-size:.82rem;color:var(--ink)}
  .chip:hover{background:#fff8e0}
  .quick{display:flex;gap:6px;margin-bottom:6px}

  .add-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;
    padding:14px;background:#f5f7f9;border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
  .add-row .field{margin:0}

  .filters{display:flex;gap:6px;margin-bottom:10px}
  .filters button{padding:5px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:.88rem}
  .filters button.active{background:var(--steel);color:#fff;border-color:var(--steel)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.chk{width:56px;text-align:center}
  td.act{width:220px;text-align:right;white-space:nowrap}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer}
  tr.done .wt{text-decoration:line-through;color:var(--muted)}
  .cmt{display:block;font-size:.85rem;color:var(--ink);background:#f1f5f2;border-left:3px solid var(--green);padding:3px 8px;margin-top:4px;border-radius:2px;white-space:pre-wrap}
  textarea{width:100%;padding:10px 12px;border:1px solid #b9c3cc;border-radius:4px;font:inherit;resize:vertical;min-height:84px;background:#fff;color:var(--ink)}
  tr.done{background:#f6fbf8}
  .doneat{display:block;font-size:.78rem;color:var(--green);text-decoration:none}
  .moved{display:block;font-size:.78rem;color:#8a6500;text-decoration:none}
  .empty{padding:28px 10px;text-align:center;color:var(--muted)}

  /* ---- dashboard ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .card{border:1px solid var(--line);border-left:5px solid var(--steel);border-radius:6px;padding:10px 12px;background:#fff}
  .card b{display:block;font-size:1.7rem;line-height:1.1}
  .card span{font-size:.82rem;color:var(--muted)}
  .card.g{border-left-color:var(--green)} .card.a{border-left-color:var(--amber)} .card.r{border-left-color:var(--red)}
  .card.r b{color:var(--red)}
  .tscroll{overflow-x:auto;margin-top:6px}
  tr.link{cursor:pointer} tr.link:hover{background:#f4f8fc}
  .pbar{display:inline-block;width:90px;height:8px;background:#e3e8ec;border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:6px}
  .pbar i{display:block;height:100%;background:var(--green)}
  h3.sec{margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line);font-size:1.1rem}
  .trend{display:flex;gap:6px;align-items:flex-end}
  .tcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .tbw{height:110px;width:100%;display:flex;align-items:flex-end}
  .tbar{width:70%;margin:0 auto;background:#c9d3dc;position:relative;border-radius:3px 3px 0 0;min-height:2px}
  .tdone{position:absolute;left:0;right:0;bottom:0;background:var(--green);border-radius:0 0 0 0}
  .tl{font-size:.75rem;color:var(--muted);margin-top:4px}
  .tn{font-size:.78rem;font-weight:600}
  .lg-done,.lg-all{display:inline-block;width:10px;height:10px;border-radius:2px}
  .lg-done{background:var(--green)} .lg-all{background:#c9d3dc}

  /* ---- employee view switch ---- */
  .viewsw{display:inline-flex;border:1px solid var(--steel);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .viewsw button{padding:8px 18px;border:0;background:#fff;color:var(--steel);font-weight:600}
  .viewsw button.active{background:var(--steel);color:#fff}
  .panel-head + .viewsw{margin-top:0}
  .viewsw + .mbar{margin-top:-2px}

  /* ---- calendar ---- */
  .c-meeting{--cc:#2d6cdf;--cb:#e3edff;--ct:#143c8c}
  .c-leave{--cc:#c0392b;--cb:#fde8e5;--ct:#8a2318}
  .c-maintenance{--cc:#d99100;--cb:#fff1cc;--ct:#6b4800}
  .c-training{--cc:#7a4fc7;--cb:#efe8fb;--ct:#47288a}
  .c-other{--cc:#4a7c6a;--cb:#e3f1ec;--ct:#1f4a3b}
  .calbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .caltitle{flex:1;text-align:center;font-size:1.15rem}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .cwd{background:#e9eef2;padding:6px 2px;text-align:center;font-size:.8rem;font-weight:600;color:var(--muted)}
  .cday{background:#fff;min-height:96px;padding:4px 5px;border:0;text-align:left;display:flex;flex-direction:column;
    align-items:stretch;font:inherit;cursor:pointer;color:var(--ink);min-width:0}
  .cday.blank{background:#f6f8fa;cursor:default}
  .cday:not(.blank):hover{background:#f1f6fb}
  .cday .dn{font-weight:700;font-size:.85rem;margin-bottom:1px;width:24px;height:24px;display:grid;place-items:center}
  .cday.today .dn{background:var(--steel);color:#fff;border-radius:99px}
  .ev{display:block;font-size:.72rem;line-height:1.25;padding:2px 5px;margin-top:3px;border-radius:3px;
    border-left:3px solid var(--cc);background:var(--cb);color:var(--ct);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:600}
  .more{font-size:.7rem;color:var(--muted);margin-top:2px}
  .dots{display:none;gap:3px;margin-top:3px;flex-wrap:wrap}
  .dots i,.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 4px;font-size:.82rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .agenda-h{margin:16px 0 8px;font-size:1rem}
  .agenda{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ag{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);
    border-left:5px solid var(--cc);background:var(--cb);border-radius:5px;padding:8px 10px;color:var(--ct)}
  .ag:hover{filter:brightness(.98)}
  .agd{min-width:52px;font-weight:700;font-size:.9rem}
  .agb{display:flex;flex-direction:column;min-width:0}
  .agb small{color:var(--ink);opacity:.75}
  .evlist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
  .evlist li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-left:5px solid var(--cc);
    background:var(--cb);color:var(--ct);border-radius:4px;padding:8px 10px}
  .evmain{display:flex;flex-direction:column;min-width:0}
  .evmain small{opacity:.8}
  .evnote{color:var(--ink);font-size:.88rem;margin-top:2px;word-break:break-word}
  .evact{white-space:nowrap;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .evform{border-top:1px solid var(--line);padding-top:12px;margin-bottom:12px}
  .evform h4{margin:0 0 10px}
  select,input[type=time]{width:100%;padding:10px 12px;border:1px solid #b9c3cc;border-radius:4px;background:#fff;color:var(--ink)}
  .modal .row.wrap{flex-wrap:wrap}
  .modal .row.wrap>*{flex:1 1 30%}

  /* ---- assignments ---- */
  .assign-form{border:1px solid var(--line);background:#f5f7f9;border-radius:6px;padding:14px;margin-bottom:16px}
  .assign-form h4{margin:0 0 10px}
  .agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:6px}
  .agrid .field{margin:0}
  .agrid .span2{grid-column:1/-1}
  .filters select{padding:6px 10px}
  .pri{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
  .p-normal{background:#e6edf3;color:var(--steel)}
  .p-high{background:var(--amber-bg);color:#6b4800}
  .p-urgent{background:#fde8e5;color:#8a2318}
  tr.late{background:#fff7f6}
  .late-t{display:block;font-size:.78rem;font-weight:700;color:var(--red)}
  .atable td{font-size:.93rem}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:grid;place-items:center;padding:16px;z-index:50}
  .modal{background:#fff;border-radius:6px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 14px}
  .modal .row{display:flex;gap:10px;margin-bottom:10px}
  .modal .row>*{flex:1}
  .ulist{margin:14px 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:4px}
  .ulist li{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
  .ulist li:last-child{border-bottom:0}
  .ulist small{color:var(--muted)}

  @media(max-width:700px){
    .add-row{grid-template-columns:1fr}
    td.act{width:auto}
    td.act .btn{margin-top:4px}
    .stats{flex-wrap:wrap}
    .dlabel{margin-left:0;width:100%}
    .cday{min-height:54px;padding:3px}
    .cday .ev,.cday .more{display:none}
    .dots{display:flex}
    .cwd{font-size:.7rem}
    .viewsw button{padding:8px 14px}
    .atable thead{display:none}
    .atable tr{display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:4px 4px}
    .atable td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:4px 8px;text-align:right}
    .atable td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;flex:0 0 38%}
    .atable td.act{justify-content:flex-end}
    .atable td.act::before{content:none}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="loginView">
  <div class="login-card">
    <div class="login-head">
      <h1>KOZHIKODE SS</h1>
      <p>Daily work management</p>
    </div>
    <div class="role-switch" role="tablist">
      <button type="button" id="roleUser" class="active" role="tab">User login</button>
      <button type="button" id="roleMaster" role="tab">Master login</button>
    </div>
    <div class="login-body">
      <div class="field">
        <label for="loginId">User ID</label>
        <input type="text" id="loginId" autocomplete="username" autocapitalize="off">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" autocomplete="current-password">
      </div>
      <p class="error" id="loginErr" role="alert"></p>
      <button class="btn wide" id="loginBtn" type="button">Sign in</button>
      <p class="mode-note" id="modeNote"></p>
    </div>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="appView" class="hidden">
  <header class="top">
    <div class="top-in">
      <h2>KOZHIKODE SS – Daily Work Manager</h2>
      <span class="sync" id="syncPill" role="button" tabindex="0" title="Click to refresh now"></span>
      <span class="who" id="whoLabel"></span>
      <button class="btn small hidden" id="manageUsersBtn" type="button">Manage logins</button>
      <button class="btn small" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </main>
</section>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     SETUP: paste your Google Apps Script Web App URL between the quotes.
     Leave it as is to run in local (single device) mode.
     Master and user passwords are checked on the Google server (Code.gs),
     so no password is stored in this file.
     ===================================================================== */
  var API_URL = "https://script.google.com/macros/s/AKfycbyV3-iaQXXsFh70EicRzuSPKsYT572gYXZsngRyUaB01W24Q8j2LpijWHu19YXwl6JvAw/exec";
  var POLL_MS = 8000;                                   // live refresh interval

  var SYNC = /^https:\/\//.test(API_URL);

  /* ---------- State ---------- */
  var KEY = "kozhikode_ss_daily_work_v1";
  var state = { employees: [], users: [], events: [], assignments: [] };
  var assignFilter = "all", assignTo = "", lastBy = "";
  var empView = "work";         // inside an employee tab: "work" or "cal"
  var dashPeriod = "today";     // dashboard range
  var calMonths = {};           // visible month per calendar scope
  var session = null;           // { role, id }
  var auth = null;              // { role, id, pass } (sync mode)
  var activeTab = null;
  var filter = "all";
  var loginRole = "user";
  var viewDate = today();
  var version = 0;              // bumps on every local change
  var queue = [], flushing = false, lastText = "", pendingRefresh = null, pollTimer = null;

  /* ---------- Helpers ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
  function today(){ return toISO(new Date()); }
  function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseISO(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(iso,n){ var d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function fmtDate(iso){ if(!iso) return ""; var p = iso.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
  function fmtStamp(ts){
    var d = new Date(ts);
    return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }
  function dayLabel(iso){
    var d = parseISO(iso), t = parseISO(today());
    var diff = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);
    var rel = diff===0?"Today":diff===-1?"Yesterday":diff===1?"Tomorrow":"";
    return d.toLocaleDateString("en-GB",{weekday:"long"})+", "+fmtDate(iso)+(rel?" – "+rel:"");
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function isMaster(){ return session && session.role === "master"; }
  function emp(id){ return state.employees.find(function(e){ return e.id === id; }); }
  function modalOpen(){ return $("modalRoot").innerHTML !== ""; }

  /* ---------- Local storage (local mode only) ---------- */
  function defaults(){
    var emps = [];
    for(var i=1;i<=11;i++) emps.push({ id: uid()+i, name: "Employee "+i, works: [] });
    return { employees: emps, users: [ { id: "User", pass: "Power@400" } ], events: [], assignments: [] };
  }
  function loadLocal(){
    try{ var raw = localStorage.getItem(KEY); if(raw){ var st = JSON.parse(raw); st.events = st.events || []; st.assignments = st.assignments || []; return st; } }catch(e){}
    return defaults();
  }
  function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  if(!SYNC) state = loadLocal();

  /* ---------- Sync layer ---------- */
  function api(body){
    body.auth = auth;
    return fetch(API_URL, { method: "POST", body: JSON.stringify(body) })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j; try{ j = JSON.parse(t); }catch(e){ throw new Error("Bad response from server"); }
        if(!j.ok){ var er = new Error(j.error || "Server error"); er.server = true; throw er; }
        return { json: j, text: t };
      });
  }

  function applyData(d){
    var map = {};
    state.employees = d.employees.map(function(e){
      var o = { id: e.id, name: e.name, works: [] }; map[e.id] = o; return o;
    });
    d.works.forEach(function(w){
      if(map[w.empId]) map[w.empId].works.push({
        id: w.id, text: w.text, date: w.date, done: !!w.done, doneAt: w.doneAt || null,
        movedFrom: w.movedFrom || "", comment: w.comment || "", created: w.created || 0
      });
    });
    state.users = (d.users || []).map(function(id){ return { id: id }; });
    state.events = d.events || [];
    state.assignments = d.assignments || [];
    if(activeTab !== "dash" && activeTab !== "assign" && !emp(activeTab)) activeTab = "dash";
  }

  function setStatus(kind,msg){
    var el = $("syncPill"); if(!el) return;
    if(!SYNC){ el.className = "sync"; el.textContent = "Local only – this device"; el.style.cursor = "default"; return; }
    var text = { ok: "Live – synced "+new Date().toLocaleTimeString("en-GB"),
                 saving: "Saving…", offline: "Offline – retrying", error: msg || "Sync problem" }[kind];
    el.className = "sync "+kind; el.textContent = text;
  }

  var KEEP = ["wText","aWork","aRem","aBy","aTo","aDate","aPri"];
  function softRender(){
    var saved = {}, ae = document.activeElement, focusId = ae && ae.id, pos = 0;
    KEEP.forEach(function(id){ var n = $(id); if(n) saved[id] = n.value; });
    try{ if(ae && ae.selectionStart != null) pos = ae.selectionStart; }catch(e){}
    render();
    KEEP.forEach(function(id){ var n = $(id); if(n && saved[id] !== undefined && saved[id] !== "") n.value = saved[id]; });
    if(focusId && KEEP.indexOf(focusId) >= 0){
      var f = $(focusId);
      if(f){ f.focus(); try{ f.setSelectionRange(pos,pos); }catch(e){} }
    }
  }

  function onSyncError(err){
    if(err && err.server && err.message === "auth"){ doLogout("Your login is no longer valid. Please sign in again."); return; }
    setStatus(err && err.server ? "error" : "offline", err && err.server ? err.message : "");
  }

  /* fetch the latest data; skips quietly if local changes are in flight */
  function pull(force){
    if(!SYNC || !auth) return;
    if(!force && (flushing || queue.length)) return;
    var v = version;
    api({ action: "getAll" }).then(function(r){
      if(!force && (v !== version || flushing || queue.length)) return;
      setStatus("ok");
      if(r.text === lastText) return;
      if(modalOpen()){ pendingRefresh = { r: r, v: version }; return; }
      lastText = r.text; applyData(r.json.data); softRender();
    }).catch(onSyncError);
  }

  function commit(ops){
    version++;
    if(!SYNC){ saveLocal(); return; }
    queue = queue.concat(ops);
    setStatus("saving");
    flush();
  }

  function flush(){
    if(flushing || !queue.length || !auth) return;
    flushing = true;
    var n = queue.length, batch = queue.slice(0,n);
    api({ action: "ops", ops: batch }).then(function(r){
      queue.splice(0,n); flushing = false;
      if(queue.length){ flush(); return; }
      lastText = r.text; setStatus("ok");
      if(!modalOpen()){ applyData(r.json.data); softRender(); }
    }).catch(function(err){
      flushing = false;
      if(err.server && err.message !== "auth"){      // rejected by server: drop and resync
        queue.splice(0,n); setStatus("error", err.message); setTimeout(function(){ pull(true); }, 300);
      } else if(err.server){ onSyncError(err); }
      else { setStatus("offline"); setTimeout(flush, 5000); }
    });
  }

  /* op builders */
  function wput(e,w){
    return { t: "work.put", work: { id: w.id, empId: e.id, date: w.date, text: w.text, done: !!w.done,
             doneAt: w.doneAt || null, movedFrom: w.movedFrom || "", comment: w.comment || "", created: w.created } };
  }

  /* ---------- Login ---------- */
  function setRole(r){
    loginRole = r;
    $("roleUser").classList.toggle("active", r==="user");
    $("roleMaster").classList.toggle("active", r==="master");
    $("loginErr").textContent = "";
    $("loginId").value = ""; $("loginPass").value = "";
    $("loginId").focus();
  }
  $("roleUser").onclick = function(){ setRole("user"); };
  $("roleMaster").onclick = function(){ setRole("master"); };
  $("modeNote").textContent = SYNC ? "" : "Demo mode: data stays on this device. Add the Web App URL in the file to share live data with the team.";

  function enterApp(role,id){
    session = { role: role, id: id };
    activeTab = "dash"; empView = "work";
    filter = "all"; viewDate = today();
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    $("manageUsersBtn").classList.toggle("hidden", !isMaster());
    $("whoLabel").innerHTML = esc(id) + '<span class="badge">' + (isMaster() ? "MASTER" : "USER") + "</span>";
    setStatus("ok");
    render();
    if(SYNC){
      clearInterval(pollTimer);
      pollTimer = setInterval(function(){ if(!document.hidden) pull(); }, POLL_MS);
    }
  }

  function doLogin(){
    var id = $("loginId").value.trim(), pw = $("loginPass").value;
    if(!SYNC){
      var ok = loginRole === "user" && state.users.some(function(u){ return u.id === id && u.pass === pw; });
      if(!ok){ $("loginErr").textContent = "Wrong ID or password. Check and try again."; return; }
      enterApp(loginRole, id); return;
    }
    var btn = $("loginBtn"); btn.disabled = true; btn.textContent = "Signing in…";
    $("loginErr").textContent = "";
    auth = { role: loginRole, id: id, pass: pw };
    api({ action: "login" }).then(function(r){
      try{ sessionStorage.setItem("kss_auth", JSON.stringify(auth)); }catch(e){}
      applyData(r.json.data); lastText = r.text;
      enterApp(auth.role, auth.id);
    }).catch(function(err){
      auth = null;
      $("loginErr").textContent = err.server
        ? "Wrong ID or password. Check and try again."
        : "Cannot reach the server. Check your internet connection and the Web App URL.";
    }).then(function(){ btn.disabled = false; btn.textContent = "Sign in"; });
  }
  $("loginBtn").onclick = doLogin;
  $("loginPass").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  $("loginId").addEventListener("keydown",function(e){ if(e.key==="Enter") $("loginPass").focus(); });

  function doLogout(msg){
    clearInterval(pollTimer);
    session = null; auth = null; queue = []; flushing = false; pendingRefresh = null;
    try{ sessionStorage.removeItem("kss_auth"); }catch(e){}
    closeModal();
    if(SYNC){ state = { employees: [], users: [], events: [], assignments: [] }; lastText = ""; }
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    setRole("user");
    if(msg) $("loginErr").textContent = msg;
  }
  $("logoutBtn").onclick = function(){
    if(SYNC && (flushing || queue.length) && !confirm("Some changes are still saving. Log out anyway?")) return;
    doLogout();
  };
  $("syncPill").onclick = function(){ pull(true); };
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) pull(); });

  /* restore session after page refresh (sync mode) */
  if(SYNC){
    try{
      var saved = JSON.parse(sessionStorage.getItem("kss_auth") || "null");
      if(saved){
        auth = saved;
        api({ action: "login" }).then(function(r){
          applyData(r.json.data); lastText = r.text; enterApp(auth.role, auth.id);
        }).catch(function(){ auth = null; });
      }
    }catch(e){}
  }

  /* ---------- Render ---------- */
  function render(){ renderTabs(); renderPanel(); }

  function renderTabs(){
    var html = '<button type="button" class="tab'+(activeTab==="dash"?" active":"")+'" data-tab="dash">Dashboard</button>';
    var pa = state.assignments.filter(function(a){ return !a.done; }).length;
    html += '<button type="button" class="tab'+(activeTab==="assign"?" active":"")+'" data-tab="assign">Assignments<span class="cnt'+(pa===0?" zero":"")+'" title="Pending assignments">'+pa+'</span></button>';
    html += state.employees.map(function(e){
      var pending = e.works.filter(function(w){ return !w.done && w.date===viewDate; }).length;
      return '<button type="button" class="tab'+(e.id===activeTab?" active":"")+'" data-tab="'+esc(e.id)+'">'+
        esc(e.name)+'<span class="cnt'+(pending===0?" zero":"")+'" title="Pending works on selected date">'+pending+'</span></button>';
    }).join("");
    if(isMaster()) html += '<button type="button" class="tab add" id="addEmpBtn">+ Add employee</button>';
    $("tabs").innerHTML = html;
    Array.prototype.forEach.call($("tabs").querySelectorAll("[data-tab]"),function(b){
      b.onclick = function(){ activeTab = b.getAttribute("data-tab"); filter = "all"; empView = "work"; render(); };
    });
    var ab = $("addEmpBtn"); if(ab) ab.onclick = addEmployeeModal;
  }

  /* ---------- Calendar (shared by office + employee calendars) ---------- */
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var CATS = { meeting:"Meeting", leave:"Leave / Holiday", maintenance:"Maintenance", training:"Training", other:"Other" };
  function catOf(ev){ return CATS[ev.cat] ? ev.cat : "other"; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function canEditCal(scope){ return scope === "office" ? isMaster() : true; }
  function evSort(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99") || (a.created||0)-(b.created||0); }
  function getCal(scope){
    if(!calMonths[scope]){ var d = new Date(); calMonths[scope] = { y: d.getFullYear(), m: d.getMonth() }; }
    return calMonths[scope];
  }

  function calHTML(scope){
    var c = getCal(scope), mk = c.y+"-"+pad2(c.m+1), t = today();
    var evs = state.events.filter(function(ev){ return ev.scope===scope && ev.date.slice(0,7)===mk; }).sort(function(a,b){
      return a.date.localeCompare(b.date) || evSort(a,b);
    });
    var by = {};
    evs.forEach(function(ev){ (by[ev.date] = by[ev.date] || []).push(ev); });
    var lead = new Date(c.y,c.m,1).getDay(), dim = new Date(c.y,c.m+1,0).getDate(), i, d;

    var h = '<div class="calbar">'+
      '<button class="btn ghost small" data-cnav="-1" type="button" aria-label="Previous month">‹</button>'+
      '<strong class="caltitle">'+MONTHS[c.m]+' '+c.y+'</strong>'+
      '<button class="btn ghost small" data-cnav="1" type="button" aria-label="Next month">›</button>'+
      '<button class="btn small" data-cnav="0" type="button">This month</button></div>';
    h += '<div class="calgrid">';
    WDAYS.forEach(function(n){ h += '<div class="cwd">'+n+'</div>'; });
    for(i=0;i<lead;i++) h += '<div class="cday blank"></div>';
    for(d=1; d<=dim; d++){
      var iso = mk+"-"+pad2(d), list = by[iso] || [];
      h += '<button type="button" class="cday'+(iso===t?" today":"")+(list.length?" has":"")+'" data-day="'+iso+'" aria-label="'+esc(fmtDate(iso))+(list.length?", "+list.length+" event(s)":"")+'">'+
           '<span class="dn">'+d+'</span>';
      list.slice(0,2).forEach(function(ev){
        h += '<span class="ev c-'+catOf(ev)+'">'+(ev.time?esc(ev.time)+' ':'')+esc(ev.title)+'</span>';
      });
      if(list.length>2) h += '<span class="more">+'+(list.length-2)+' more</span>';
      if(list.length) h += '<span class="dots">'+list.map(function(ev){ return '<i class="c-'+catOf(ev)+'"></i>'; }).join("")+'</span>';
      h += '</button>';
    }
    h += '</div>';
    h += '<div class="legend">'+Object.keys(CATS).map(function(k){ return '<span><i class="c-'+k+'"></i>'+CATS[k]+'</span>'; }).join("")+'</div>';

    h += '<h4 class="agenda-h">Events in '+MONTHS[c.m]+' '+c.y+'</h4>';
    if(!evs.length){
      h += '<div class="empty">No events this month.'+(canEditCal(scope)?' Click a date to add one.':'')+'</div>';
    } else {
      h += '<ul class="agenda">'+evs.map(function(ev){
        var k = catOf(ev);
        return '<li><button type="button" class="ag c-'+k+'" data-day="'+ev.date+'">'+
          '<span class="agd">'+parseISO(ev.date).getDate()+' '+WDAYS[parseISO(ev.date).getDay()]+'</span>'+
          '<span class="agb"><b>'+(ev.time?esc(ev.time)+' – ':'')+esc(ev.title)+'</b>'+
          '<small>'+CATS[k]+(ev.note?' – '+esc(ev.note):'')+'</small></span></button></li>';
      }).join("")+'</ul>';
    }
    return h;
  }

  function bindCal(scope, root){
    Array.prototype.forEach.call(root.querySelectorAll("[data-cnav]"),function(b){
      b.onclick = function(){
        var n = +b.getAttribute("data-cnav"), c = getCal(scope);
        if(n === 0){ var d = new Date(); c.y = d.getFullYear(); c.m = d.getMonth(); }
        else { c.m += n; if(c.m<0){ c.m = 11; c.y--; } if(c.m>11){ c.m = 0; c.y++; } }
        render();
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-day]"),function(b){
      b.onclick = function(){ dayModal(scope, b.getAttribute("data-day")); };
    });
  }

  function dayModal(scope, date, editId){
    var can = canEditCal(scope);
    var list = state.events.filter(function(ev){ return ev.scope===scope && ev.date===date; }).sort(evSort);
    var ed = editId ? list.find(function(x){ return x.id===editId; }) : null;
    var owner = scope==="office" ? "Office calendar" : (emp(scope) ? emp(scope).name+" – calendar" : "Calendar");

    var h = '<h3>'+esc(dayLabel(date))+'</h3><p style="margin:-8px 0 12px;color:var(--muted)">'+esc(owner)+'</p>';
    if(list.length){
      h += '<ul class="evlist">'+list.map(function(ev){
        var k = catOf(ev);
        return '<li class="c-'+k+'"><div class="evmain"><b>'+(ev.time?esc(ev.time)+' – ':'')+esc(ev.title)+'</b>'+
          '<small>'+CATS[k]+'</small>'+(ev.note?'<span class="evnote">'+esc(ev.note)+'</span>':'')+'</div>'+
          (can?'<div class="evact"><button class="btn ghost small" data-eedit="'+esc(ev.id)+'" type="button">Edit</button> '+
               '<button class="btn danger small" data-edel="'+esc(ev.id)+'" type="button">Delete</button></div>':'')+'</li>';
      }).join("")+'</ul>';
    } else {
      h += '<p style="color:var(--muted)">No events on this date.</p>';
    }
    if(can){
      h += '<div class="evform"><h4>'+(ed?'Edit event':'Add event')+'</h4>'+
        '<div class="field"><label for="evTitle">Title</label><input type="text" id="evTitle" maxlength="100" value="'+esc(ed?ed.title:"")+'"></div>'+
        '<div class="row"><div><label for="evTime">Time (optional)</label><input type="time" id="evTime" value="'+esc(ed?(ed.time||""):"")+'"></div>'+
        '<div><label for="evCat">Type</label><select id="evCat">'+
          Object.keys(CATS).map(function(k){ return '<option value="'+k+'"'+(ed&&catOf(ed)===k?' selected':'')+'>'+CATS[k]+'</option>'; }).join("")+
        '</select></div></div>'+
        '<div class="field"><label for="evNote">Note (optional)</label><input type="text" id="evNote" maxlength="300" value="'+esc(ed?(ed.note||""):"")+'"></div>'+
        '<p class="error" id="evErr"></p></div>';
    } else {
      h += '<p style="color:var(--muted);font-size:.9rem">Only Master can change office events.</p>';
    }
    h += '<div class="row wrap"><button class="btn ghost" id="mNo" type="button">Close</button>'+
         (scope!=="office"?'<button class="btn ghost" id="evWork" type="button">Open worklist</button>':'')+
         (can?'<button class="btn" id="evSave" type="button">'+(ed?'Save changes':'Add event')+'</button>':'')+'</div>';
    openModal(h);

    $("mNo").onclick = closeModal;
    var ew = $("evWork");
    if(ew) ew.onclick = function(){ closeModal(); activeTab = scope; empView = "work"; viewDate = date; filter = "all"; render(); };
    if(!can) return;

    function save(){
      var title = $("evTitle").value.trim();
      if(!title){ $("evErr").textContent = "Enter a title for the event."; $("evTitle").focus(); return; }
      var time = $("evTime").value || "", cat = $("evCat").value, note = $("evNote").value.trim(), ev;
      if(ed){ ev = ed; ev.title = title; ev.time = time; ev.cat = cat; ev.note = note; }
      else { ev = { id: uid(), scope: scope, date: date, time: time, title: title, cat: cat, note: note, created: Date.now() }; state.events.push(ev); }
      commit([{ t:"ev.put", ev: { id:ev.id, scope:ev.scope, date:ev.date, time:ev.time, title:ev.title, cat:ev.cat, note:ev.note, created:ev.created } }]);
      render(); dayModal(scope, date);
    }
    $("evSave").onclick = save;
    $("evTitle").addEventListener("keydown",function(e){ if(e.key==="Enter") save(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-eedit]"),function(b){
      b.onclick = function(){ dayModal(scope, date, b.getAttribute("data-eedit")); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-edel]"),function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-edel"), ev = state.events.find(function(x){ return x.id===id; });
        confirmModal("Delete event “"+(ev?ev.title:"")+"”?", function(){
          state.events = state.events.filter(function(x){ return x.id!==id; });
          commit([{ t:"ev.del", id:id }]); render(); dayModal(scope, date);
        });
      };
    });
  }

  /* ---------- Dashboard ---------- */
  var PERIODS = { today:"Today", week:"This week", month:"This month", all:"All time" };
  function rangeFor(period){
    var t = today();
    if(period === "today") return [t,t];
    if(period === "week"){ var dow = (parseISO(t).getDay()+6)%7, f = addDays(t,-dow); return [f, addDays(f,6)]; }
    if(period === "month"){ var d = parseISO(t); return [toISO(new Date(d.getFullYear(),d.getMonth(),1)), toISO(new Date(d.getFullYear(),d.getMonth()+1,0))]; }
    return ["0000-01-01","9999-12-31"];
  }
  function pctOf(a,b){ return b ? Math.round(a/b*100) : 0; }

  function renderDashboard(){
    var p = $("panel"), t = today(), r = rangeFor(dashPeriod);
    var rows = state.employees.map(function(e){
      var inR = e.works.filter(function(w){ return w.date>=r[0] && w.date<=r[1]; });
      var done = inR.filter(function(w){ return w.done; }).length;
      return { e:e, total:inR.length, done:done, pending:inR.length-done,
               overdue:e.works.filter(function(w){ return !w.done && w.date<t; }).length };
    });
    var T = { total:0, done:0, pending:0, overdue:0 };
    rows.forEach(function(x){ T.total+=x.total; T.done+=x.done; T.pending+=x.pending; T.overdue+=x.overdue; });
    var pct = pctOf(T.done,T.total);
    var aPend = state.assignments.filter(function(a){ return !a.done; }).length;
    var aOver = state.assignments.filter(asOverdue).length;

    var h = '<div class="panel-head"><h3>Work progress</h3><span style="color:var(--muted)">'+esc(dayLabel(t))+'</span></div>';
    h += '<div class="filters">'+Object.keys(PERIODS).map(function(k){
      return '<button type="button" data-period="'+k+'" class="'+(dashPeriod===k?"active":"")+'">'+PERIODS[k]+'</button>';
    }).join("")+'</div>';

    h += '<div class="cards">'+
      '<div class="card"><b>'+T.total+'</b><span>Total works</span></div>'+
      '<div class="card g"><b>'+T.done+'</b><span>Completed</span></div>'+
      '<div class="card a"><b>'+T.pending+'</b><span>Pending</span></div>'+
      '<div class="card'+(T.overdue?' r':'')+'"><b>'+T.overdue+'</b><span>Overdue (earlier dates, all time)</span></div>'+
      '<div class="card'+(aOver?' r':' a')+'"><b>'+aPend+'</b><span>Open assignments'+(aOver?' ('+aOver+' overdue)':'')+'</span></div></div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px"><span>Overall completion</span><b>'+pct+'%</b></div>';
    h += '<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';

    if(!rows.length){
      h += '<div class="empty">No employees yet.</div>';
    } else {
      h += '<div class="tscroll"><table><thead><tr><th>Employee</th><th>Total</th><th>Done</th><th>Pending</th><th>Overdue</th><th>Progress</th></tr></thead><tbody>';
      rows.forEach(function(x){
        var pc = pctOf(x.done,x.total);
        h += '<tr class="link" data-goto="'+esc(x.e.id)+'" tabindex="0"><td><b>'+esc(x.e.name)+'</b></td><td>'+x.total+'</td><td>'+x.done+'</td><td>'+x.pending+'</td>'+
             '<td'+(x.overdue?' style="color:var(--red);font-weight:700"':'')+'>'+x.overdue+'</td>'+
             '<td style="white-space:nowrap"><span class="pbar"><i style="width:'+pc+'%"></i></span>'+(x.total?pc+'%':'–')+'</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* last 7 days trend */
    var days = [], i, all = [];
    state.employees.forEach(function(e){ all = all.concat(e.works); });
    for(i=6;i>=0;i--) days.push(addDays(t,-i));
    var stats = days.map(function(d){
      var day = all.filter(function(w){ return w.date===d; });
      return { d:d, total:day.length, done:day.filter(function(w){ return w.done; }).length };
    });
    var max = Math.max.apply(null, stats.map(function(s){ return s.total; }).concat([1]));
    h += '<h3 class="sec">Last 7 days</h3><div class="trend">'+stats.map(function(s){
      var hh = Math.round(s.total/max*100);
      return '<div class="tcol"><div class="tbw"><div class="tbar" style="height:'+hh+'%"><div class="tdone" style="height:'+pctOf(s.done,s.total)+'%"></div></div></div>'+
        '<span class="tl">'+WDAYS[parseISO(s.d).getDay()]+' '+parseISO(s.d).getDate()+'</span><span class="tn">'+(s.total?s.done+'/'+s.total:'–')+'</span></div>';
    }).join("")+'</div><div class="legend"><span><i class="lg-done"></i>Completed</span><span><i class="lg-all"></i>Total works</span></div>';

    /* office calendar */
    h += '<h3 class="sec">Office calendar</h3>'+
         '<p style="margin:-4px 0 12px;color:var(--muted);font-size:.9rem">'+
         (isMaster() ? 'Click a date to add or change office events.' : 'Office events set by Master. Click a date to see details.')+'</p>';
    h += calHTML("office");
    p.innerHTML = h;

    Array.prototype.forEach.call(p.querySelectorAll("[data-period]"),function(b){
      b.onclick = function(){ dashPeriod = b.getAttribute("data-period"); renderPanel(); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-goto]"),function(tr){
      function go(){ activeTab = tr.getAttribute("data-goto"); empView = "work"; filter = "all"; render(); }
      tr.onclick = go;
      tr.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
    });
    bindCal("office", p);
  }

  /* ---------- Work assignments ---------- */
  var PRI = { normal:"Normal", high:"High", urgent:"Urgent" };
  function empName(id){ var e = emp(id); return e ? e.name : "(removed employee)"; }
  function empOptions(sel, placeholder){
    var o = '<option value="">'+esc(placeholder)+'</option>', found = false;
    state.employees.forEach(function(e){
      if(e.id === sel) found = true;
      o += '<option value="'+esc(e.id)+'"'+(e.id===sel?' selected':'')+'>'+esc(e.name)+'</option>';
    });
    if(sel && !found) o += '<option value="'+esc(sel)+'" selected>(removed employee)</option>';
    return o;
  }
  function priOptions(sel){
    return Object.keys(PRI).map(function(k){ return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+PRI[k]+'</option>'; }).join("");
  }
  function asOverdue(a){ return !a.done && a.target && a.target < today(); }
  function asCreatedDate(a){ return a.created ? toISO(new Date(a.created)) : ""; }
  function aPut(a){
    return { t:"as.put", as:{ id:a.id, by:a.by, to:a.to, text:a.text, target:a.target||"", priority:a.priority||"normal",
             remarks:a.remarks||"", done:!!a.done, doneAt:a.doneAt||null, created:a.created } };
  }

  function renderAssignments(){
    var p = $("panel"), all = state.assignments;
    var pend = all.filter(function(a){ return !a.done; }).length;
    var over = all.filter(asOverdue).length;

    var h = '<div class="panel-head"><h3>Work assignments</h3><div class="stats"><span>Total <b>'+all.length+'</b></span>'+
            '<span>Pending <b>'+pend+'</b></span><span>Done <b>'+(all.length-pend)+'</b></span>'+
            '<span>Overdue <b'+(over?' style="color:var(--red)"':'')+'>'+over+'</b></span></div></div>';

    if(!state.employees.length){
      h += '<div class="empty">No employees yet. Master must add employees before work can be assigned.</div>';
      p.innerHTML = h; return;
    }

    h += '<div class="assign-form"><h4>Assign new work</h4><div class="agrid">'+
      '<div class="field"><label for="aBy">Assigned by</label><select id="aBy">'+empOptions(lastBy,"Select employee")+'</select></div>'+
      '<div class="field"><label for="aTo">Work assigned to</label><select id="aTo">'+empOptions("","Select employee")+'</select></div>'+
      '<div class="field span2"><label for="aWork">Work assigned</label><input type="text" id="aWork" maxlength="300" placeholder="Describe the work to be done"></div>'+
      '<div class="field"><label for="aDate">Target date</label><input type="date" id="aDate" value="'+today()+'"></div>'+
      '<div class="field"><label for="aPri">Priority</label><select id="aPri">'+priOptions("normal")+'</select></div>'+
      '<div class="field span2"><label for="aRem">Remarks (optional)</label><input type="text" id="aRem" maxlength="300"></div>'+
      '</div><p class="error" id="aErr"></p><button class="btn" id="aAdd" type="button">Assign work</button></div>';

    h += '<div class="filters">'+[["all","All"],["pending","Pending"],["overdue","Overdue"],["done","Done"]].map(function(f){
      return '<button type="button" data-af="'+f[0]+'" class="'+(assignFilter===f[0]?"active":"")+'">'+f[1]+'</button>';
    }).join("")+
      '<select id="aFilterTo" style="width:auto;margin-left:auto" aria-label="Filter by employee">'+empOptions(assignTo,"All employees")+'</select></div>';

    var list = all.filter(function(a){
      if(assignTo && a.to !== assignTo) return false;
      if(assignFilter === "pending") return !a.done;
      if(assignFilter === "done") return a.done;
      if(assignFilter === "overdue") return asOverdue(a);
      return true;
    }).sort(function(a,b){
      if(a.done !== b.done) return a.done ? 1 : -1;
      if(!a.done){ return (a.target||"9999").localeCompare(b.target||"9999") || a.created-b.created; }
      return (b.doneAt||0)-(a.doneAt||0);
    });

    if(!list.length){
      h += '<div class="empty">'+(all.length ? "No assignments match this filter." : "No work assigned yet. Use the form above.")+'</div>';
    } else {
      h += '<table class="atable"><thead><tr><th>#</th><th>Assigned by</th><th>Assigned to</th><th>Work assigned</th>'+
           '<th>Assigned on</th><th>Target date</th><th>Priority</th><th>Status</th><th>Remarks</th><th></th></tr></thead><tbody>';
      list.forEach(function(a,i){
        var late = asOverdue(a), pr = PRI[a.priority] ? a.priority : "normal";
        h += '<tr class="'+(a.done?"done":"")+(late?" late":"")+'">'+
          '<td data-label="#">'+(i+1)+'</td>'+
          '<td data-label="Assigned by">'+esc(empName(a.by))+'</td>'+
          '<td data-label="Assigned to"><b>'+esc(empName(a.to))+'</b></td>'+
          '<td data-label="Work assigned"><span class="wt">'+esc(a.text)+'</span></td>'+
          '<td data-label="Assigned on">'+fmtDate(asCreatedDate(a))+'</td>'+
          '<td data-label="Target date">'+(a.target?fmtDate(a.target):'–')+(late?'<span class="late-t">Overdue</span>':'')+'</td>'+
          '<td data-label="Priority"><span class="pri p-'+pr+'">'+PRI[pr]+'</span></td>'+
          '<td data-label="Status"><label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:400">'+
            '<input type="checkbox" data-adone="'+esc(a.id)+'" '+(a.done?'checked':'')+' aria-label="Mark assignment done"> '+
            (a.done?'Done'+(a.doneAt?' '+fmtDate(toISO(new Date(a.doneAt))):''):'Pending')+'</label></td>'+
          '<td data-label="Remarks">'+(a.remarks?esc(a.remarks):'–')+'</td>'+
          '<td class="act"><button class="btn ghost small" data-aedit="'+esc(a.id)+'" type="button">Edit</button>'+
            (isMaster()?' <button class="btn danger small" data-adel="'+esc(a.id)+'" type="button">Delete</button>':'')+'</td></tr>';
      });
      h += '</tbody></table>';
    }
    p.innerHTML = h;

    function findA(id){ return state.assignments.find(function(x){ return x.id===id; }); }
    $("aAdd").onclick = function(){
      var by = $("aBy").value, to = $("aTo").value, text = $("aWork").value.trim(), err = $("aErr");
      if(!by){ err.textContent = "Select who is assigning the work."; return; }
      if(!to){ err.textContent = "Select who the work is assigned to."; return; }
      if(!text){ err.textContent = "Enter the work to be assigned."; $("aWork").focus(); return; }
      var a = { id: uid(), by: by, to: to, text: text, target: $("aDate").value || "", priority: $("aPri").value,
                remarks: $("aRem").value.trim(), done:false, doneAt:null, created: Date.now() };
      state.assignments.push(a); lastBy = by;
      commit([aPut(a)]); render();
    };
    $("aWork").addEventListener("keydown",function(e){ if(e.key==="Enter") $("aAdd").click(); });
    Array.prototype.forEach.call(p.querySelectorAll("[data-af]"),function(b){
      b.onclick = function(){ assignFilter = b.getAttribute("data-af"); renderPanel(); };
    });
    $("aFilterTo").onchange = function(){ assignTo = this.value; renderPanel(); };
    Array.prototype.forEach.call(p.querySelectorAll("[data-adone]"),function(c){
      c.onchange = function(){
        var a = findA(c.getAttribute("data-adone"));
        a.done = c.checked; a.doneAt = c.checked ? Date.now() : null;
        commit([aPut(a)]); render();
      };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-aedit]"),function(b){
      b.onclick = function(){ assignModal(findA(b.getAttribute("data-aedit"))); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-adel]"),function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-adel");
        confirmModal("Delete this assignment?", function(){
          state.assignments = state.assignments.filter(function(x){ return x.id!==id; });
          commit([{ t:"as.del", id:id }]); render();
        });
      };
    });
  }

  function assignModal(a){
    openModal('<h3>Edit assignment</h3>'+
      '<div class="field"><label for="eBy">Assigned by</label><select id="eBy">'+empOptions(a.by,"Select employee")+'</select></div>'+
      '<div class="field"><label for="eTo">Work assigned to</label><select id="eTo">'+empOptions(a.to,"Select employee")+'</select></div>'+
      '<div class="field"><label for="eWork">Work assigned</label><input type="text" id="eWork" maxlength="300" value="'+esc(a.text)+'"></div>'+
      '<div class="row"><div><label for="eTarget">Target date</label><input type="date" id="eTarget" value="'+esc(a.target||"")+'"></div>'+
      '<div><label for="ePri">Priority</label><select id="ePri">'+priOptions(PRI[a.priority]?a.priority:"normal")+'</select></div></div>'+
      '<div class="field"><label for="eRem">Remarks (optional)</label><input type="text" id="eRem" maxlength="300" value="'+esc(a.remarks||"")+'"></div>'+
      '<p class="error" id="eErr"></p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save changes</button></div>');
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      var by = $("eBy").value, to = $("eTo").value, text = $("eWork").value.trim();
      if(!by || !to){ $("eErr").textContent = "Select both employees."; return; }
      if(!text){ $("eErr").textContent = "Work description cannot be empty."; return; }
      a.by = by; a.to = to; a.text = text; a.target = $("eTarget").value || "";
      a.priority = $("ePri").value; a.remarks = $("eRem").value.trim();
      closeModal(); commit([aPut(a)]); render();
    };
  }

  /* ---------- Employee panel ---------- */
  function bindHead(e, done){
    var p = $("panel");
    Array.prototype.forEach.call(p.querySelectorAll("[data-view]"),function(b){
      b.onclick = function(){ empView = b.getAttribute("data-view"); render(); };
    });
    if(!isMaster()) return;
    $("renameEmp").onclick = function(){
      promptModal("Rename employee","Employee name",e.name,function(v){
        e.name = v; commit([{ t:"emp.put", emp:{ id:e.id, name:v } }]); render();
      });
    };
    var cd = $("clearDone");
    if(cd) cd.onclick = function(){
      if(!done) return;
      confirmModal("Delete all "+done+" completed works of "+e.name+" on "+fmtDate(viewDate)+"?", function(){
        var gone = e.works.filter(function(x){ return x.done && x.date===viewDate; });
        e.works = e.works.filter(function(x){ return !(x.done && x.date===viewDate); });
        commit(gone.map(function(x){ return { t:"work.del", id:x.id }; })); render();
      });
    };
    $("delEmp").onclick = function(){
      confirmModal("Delete employee “"+e.name+"”, their works and calendar events? This cannot be undone.", function(){
        state.employees = state.employees.filter(function(x){ return x.id!==e.id; });
        state.events = state.events.filter(function(x){ return x.scope!==e.id; });
        activeTab = "dash";
        commit([{ t:"emp.del", id:e.id }]); render();
      });
    };
  }

  function renderPanel(){
    if(activeTab === "dash"){ renderDashboard(); return; }
    if(activeTab === "assign"){ renderAssignments(); return; }
    var e = emp(activeTab), p = $("panel");
    if(!e){ p.innerHTML = '<div class="empty">No employee selected.</div>'; return; }

    var dayWorks = e.works.filter(function(w){ return w.date === viewDate; });
    var total = dayWorks.length, done = dayWorks.filter(function(w){ return w.done; }).length;
    var pct = total ? Math.round(done/total*100) : 0;
    var work = empView === "work";

    var h = '';
    h += '<div class="panel-head"><h3>'+esc(e.name)+'</h3>';
    if(work) h += '<div class="stats"><span>Total <b>'+total+'</b></span><span>Done <b>'+done+'</b></span><span>Pending <b>'+(total-done)+'</b></span></div>';
    h += '</div>';
    h += '<div class="viewsw"><button type="button" data-view="work" class="'+(work?"active":"")+'">Worklist</button>'+
         '<button type="button" data-view="cal" class="'+(!work?"active":"")+'">Calendar</button></div>';
    if(isMaster()){
      h += '<div class="mbar">'+
           '<button class="btn ghost small" id="renameEmp" type="button">Rename employee</button>'+
           (work?'<button class="btn ghost small" id="clearDone" type="button">Clear completed (this date)</button>':'')+
           '<button class="btn danger small" id="delEmp" type="button">Delete employee</button></div>';
    }

    if(!work){
      h += calHTML(e.id);
      p.innerHTML = h;
      bindHead(e, done); bindCal(e.id, p);
      return;
    }

    var overdue = e.works.filter(function(w){ return !w.done && w.date < viewDate; });
    var byDate = {};
    overdue.forEach(function(w){ byDate[w.date] = (byDate[w.date]||0)+1; });
    var oDates = Object.keys(byDate).sort().reverse();

    var myA = state.assignments.filter(function(a){ return a.to===e.id && !a.done; });
    if(myA.length){
      var myLate = myA.filter(asOverdue).length;
      h += '<div class="carry"><div class="carry-txt"><b>'+myA.length+' assignment'+(myA.length>1?'s':'')+'</b> pending for '+esc(e.name)+(myLate?' ('+myLate+' overdue)':'')+'</div>'+
           '<button class="btn small" id="viewAssign" type="button">View assignments</button></div>';
    }
    h += '<div class="datebar">'+
         '<button class="btn ghost small" id="dPrev" type="button" aria-label="Previous day">‹ Previous</button>'+
         '<input type="date" id="dPick" value="'+viewDate+'" aria-label="Select date">'+
         '<button class="btn ghost small" id="dNext" type="button" aria-label="Next day">Next ›</button>'+
         '<button class="btn small" id="dToday" type="button"'+(viewDate===today()?' disabled':'')+'>Today</button>'+
         '<span class="dlabel">'+esc(dayLabel(viewDate))+'</span></div>';

    if(overdue.length){
      h += '<div class="carry"><div class="carry-txt"><b>'+overdue.length+' pending</b> from earlier dates: '+
        oDates.slice(0,8).map(function(d){
          return '<button type="button" class="chip" data-jump="'+d+'">'+fmtDate(d)+' ('+byDate[d]+')</button>';
        }).join("")+(oDates.length>8?' …':'')+'</div>'+
        '<button class="btn small" id="bringAll" type="button">Bring all to '+fmtDate(viewDate)+'</button></div>';
    }

    h += '<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';

    h += '<div class="add-row">'+
         '<div class="field"><label for="wText">Add work for '+fmtDate(viewDate)+'</label><input type="text" id="wText" placeholder="e.g. Inspect 33 kV breaker, feeder 2" maxlength="300"></div>'+
         '<button class="btn" id="wAdd" type="button">Add work</button></div>';

    h += '<div class="filters">'+
      ['all','pending','done'].map(function(f){
        return '<button type="button" data-f="'+f+'" class="'+(filter===f?"active":"")+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>';
      }).join("")+'</div>';

    var list = dayWorks.filter(function(w){
      return filter==="all" || (filter==="done"?w.done:!w.done);
    }).sort(function(a,b){ return a.created-b.created; });

    if(!list.length){
      h += '<div class="empty">'+(total? "No works match this filter." : "No work entered for "+fmtDate(viewDate)+". Add the first work above.")+'</div>';
    } else {
      h += '<table><thead><tr><th>Done</th><th>Work details</th><th></th></tr></thead><tbody>';
      list.forEach(function(w){
        h += '<tr class="'+(w.done?"done":"")+'">'+
          '<td class="chk"><input type="checkbox" data-done="'+esc(w.id)+'" '+(w.done?"checked":"")+' aria-label="Mark complete"></td>'+
          '<td class="txt"><span class="wt">'+esc(w.text)+'</span>'+
            (w.movedFrom?'<span class="moved">Transferred from '+fmtDate(w.movedFrom)+'</span>':'')+
            (w.done&&w.doneAt?'<span class="doneat">Completed '+fmtStamp(w.doneAt)+'</span>':'')+
            (w.done&&w.comment?'<span class="cmt">Comment: '+esc(w.comment)+'</span>':'')+'</td>'+
          '<td class="act">'+
            (!w.done?'<button class="btn ghost small" data-move="'+esc(w.id)+'" type="button">Transfer</button> ':'')+
            '<button class="btn ghost small" data-edit="'+esc(w.id)+'" type="button">Edit</button>'+
            (isMaster()?' <button class="btn danger small" data-del="'+esc(w.id)+'" type="button">Delete</button>':'')+
          '</td></tr>';
      });
      h += '</tbody></table>';
    }
    p.innerHTML = h;
    bindHead(e, done);
    var va = $("viewAssign");
    if(va) va.onclick = function(){ activeTab = "assign"; assignTo = e.id; assignFilter = "pending"; render(); };

    function findWork(id){ return e.works.find(function(x){ return x.id===id; }); }
    function goDate(d){ if(!d) return; viewDate = d; filter = "all"; render(); }
    $("dPrev").onclick = function(){ goDate(addDays(viewDate,-1)); };
    $("dNext").onclick = function(){ goDate(addDays(viewDate,1)); };
    $("dToday").onclick = function(){ goDate(today()); };
    $("dPick").onchange = function(){ goDate(this.value); };
    Array.prototype.forEach.call(p.querySelectorAll("[data-jump]"),function(b){
      b.onclick = function(){ goDate(b.getAttribute("data-jump")); };
    });
    var ba = $("bringAll");
    if(ba) ba.onclick = function(){
      var ops = [];
      overdue.forEach(function(w){ w.movedFrom = w.date; w.date = viewDate; ops.push(wput(e,w)); });
      commit(ops); render();
    };

    function addWork(){
      var t = $("wText").value.trim();
      if(!t){ $("wText").focus(); return; }
      var w = { id: uid(), text: t, date: viewDate, done:false, doneAt:null, movedFrom:"", comment:"", created: Date.now() };
      e.works.push(w);
      commit([wput(e,w)]); render();
      $("wText").focus();
    }
    $("wAdd").onclick = addWork;
    $("wText").addEventListener("keydown",function(ev){ if(ev.key==="Enter") addWork(); });

    Array.prototype.forEach.call(p.querySelectorAll("[data-f]"),function(b){
      b.onclick = function(){ filter = b.getAttribute("data-f"); renderPanel(); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-done]"),function(c){
      c.onchange = function(){
        var w = findWork(c.getAttribute("data-done"));
        if(c.checked){                      // closing a work: ask for an optional comment
          c.checked = false;
          completeModal(e,w);
        } else {                            // re-opening a work
          w.done = false; w.doneAt = null; w.comment = "";
          commit([wput(e,w)]); render();
        }
      };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-move]"),function(b){
      b.onclick = function(){ transferModal(e, findWork(b.getAttribute("data-move"))); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-del]"),function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-del");
        confirmModal("Delete this work entry?", function(){
          e.works = e.works.filter(function(x){ return x.id!==id; });
          commit([{ t:"work.del", id:id }]); render();
        });
      };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-edit]"),function(b){
      b.onclick = function(){ editWorkModal(e, findWork(b.getAttribute("data-edit"))); };
    });
  }

  /* ---------- Modals ---------- */
  function openModal(inner){
    $("modalRoot").innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';
    $("ov").addEventListener("mousedown",function(e){ if(e.target.id==="ov") closeModal(); });
  }
  function closeModal(){
    $("modalRoot").innerHTML = "";
    if(pendingRefresh){
      var pr = pendingRefresh; pendingRefresh = null;
      setTimeout(function(){
        if(pr.v === version && !queue.length && !flushing && !modalOpen()){
          lastText = pr.r.text; applyData(pr.r.json.data); softRender();
        }
      },0);
    }
  }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  function confirmModal(msg, onYes){
    openModal('<h3>Please confirm</h3><p>'+esc(msg)+'</p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn danger" id="mYes" type="button">Delete</button></div>');
    $("mNo").onclick = closeModal;
    $("mYes").onclick = function(){ closeModal(); onYes(); };
  }
  function promptModal(title,label,val,onOk){
    openModal('<h3>'+esc(title)+'</h3><div class="field"><label for="mIn">'+esc(label)+'</label>'+
      '<input type="text" id="mIn" maxlength="60" value="'+esc(val||"")+'"></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save</button></div>');
    var inp = $("mIn"); inp.focus(); inp.select();
    function ok(){ var v = inp.value.trim(); if(!v) return; closeModal(); onOk(v); }
    $("mNo").onclick = closeModal; $("mOk").onclick = ok;
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") ok(); });
  }
  function addEmployeeModal(){
    promptModal("Add employee","Employee name","",function(v){
      var n = { id: uid(), name: v, works: [] };
      state.employees.push(n); activeTab = n.id;
      commit([{ t:"emp.put", emp:{ id:n.id, name:v } }]); render();
    });
  }
  function editWorkModal(e,w){
    openModal('<h3>Edit work</h3>'+
      (isMaster()?'<div class="field"><label for="eDate">Date</label><input type="date" id="eDate" value="'+esc(w.date)+'"></div>':'')+
      '<div class="field"><label for="eText">Work details</label><input type="text" id="eText" maxlength="300" value="'+esc(w.text)+'"></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save changes</button></div>');
    $("eText").focus();
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      var t = $("eText").value.trim(); if(!t) return;
      w.text = t; if(isMaster() && $("eDate")) w.date = $("eDate").value || w.date;
      closeModal(); commit([wput(e,w)]); render();
    };
  }
  function completeModal(e,w){
    openModal('<h3>Mark work as complete</h3>'+
      '<p style="margin-top:0">'+esc(w.text)+'</p>'+
      '<div class="field"><label for="cText">Comment (optional)</label>'+
      '<textarea id="cText" maxlength="300" placeholder="e.g. Replaced fuse, tested OK"></textarea></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Mark complete</button></div>');
    $("cText").focus();
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      w.done = true; w.doneAt = Date.now(); w.comment = $("cText").value.trim();
      closeModal(); commit([wput(e,w)]); render();
    };
  }
  function transferModal(e,w){
    var from = w.date;
    var def = from < today() ? today() : addDays(from,1);
    openModal('<h3>Transfer work</h3>'+
      '<p style="margin-top:0">'+esc(w.text)+'</p>'+
      '<p style="color:var(--muted);margin-top:-6px">Currently on '+fmtDate(from)+'</p>'+
      '<div class="field"><label for="tDate">Move to date</label><input type="date" id="tDate" value="'+def+'"></div>'+
      '<div class="quick"><button class="chip" id="tYest" type="button">Yesterday</button>'+
      '<button class="chip" id="tToday" type="button">Today</button>'+
      '<button class="chip" id="tTom" type="button">Tomorrow</button>'+
      '<button class="chip" id="tWeek" type="button">Next week</button></div>'+
      '<p class="error" id="tErr"></p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Transfer</button></div>');
    var t0 = today();
    $("tYest").onclick = function(){ $("tDate").value = addDays(t0,-1); };
    $("tToday").onclick = function(){ $("tDate").value = t0; };
    $("tTom").onclick = function(){ $("tDate").value = addDays(t0,1); };
    $("tWeek").onclick = function(){ $("tDate").value = addDays(t0,7); };
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      var d = $("tDate").value;
      if(!d){ $("tErr").textContent = "Pick a date."; return; }
      if(d === from){ $("tErr").textContent = "Pick a date different from "+fmtDate(from)+"."; return; }
      w.movedFrom = from; w.date = d;
      closeModal(); commit([wput(e,w)]); render();
    };
  }

  /* ---------- Manage login users (master) ---------- */
  function usersModal(){
    function body(msg){
      var li = state.users.map(function(u,i){
        return '<li><span>'+esc(u.id)+' <small>(password set)</small></span>'+
          '<button class="btn danger small" data-rm="'+i+'" type="button">Remove</button></li>';
      }).join("") || '<li><small>No user logins. Add one below.</small></li>';
      openModal('<h3>Manage user logins</h3>'+
        '<ul class="ulist">'+li+'</ul>'+
        '<div class="row"><div><label for="nuId">New user ID</label><input type="text" id="nuId" autocapitalize="off"></div>'+
        '<div><label for="nuPw">Password</label><input type="text" id="nuPw"></div></div>'+
        '<p class="error" id="nuErr">'+esc(msg||"")+'</p>'+
        '<div class="row"><button class="btn ghost" id="mNo" type="button">Close</button><button class="btn" id="nuAdd" type="button">Add user</button></div>');
      $("mNo").onclick = closeModal;
      $("nuAdd").onclick = function(){
        var id = $("nuId").value.trim(), pw = $("nuPw").value;
        if(!id || !pw){ body("Enter both a user ID and a password."); return; }
        if(id.toLowerCase()==="master" || state.users.some(function(u){return u.id.toLowerCase()===id.toLowerCase();})){
          body("That user ID is already taken."); return;
        }
        state.users.push(SYNC ? { id:id } : { id:id, pass:pw });
        commit([{ t:"user.put", id:id, pass:pw }]); body("");
      };
      Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"),function(b){
        b.onclick = function(){
          var u = state.users.splice(+b.getAttribute("data-rm"),1)[0];
          commit([{ t:"user.del", id:u.id }]); body("");
        };
      });
    }
    body("");
  }
  $("manageUsersBtn").onclick = usersModal;

  setStatus("ok");
  setRole("user");
})();
</script>
</body>
</html>
