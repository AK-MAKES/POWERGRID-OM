  /* ---------- Miscellaneous: Dispatch / Inward entry ---------- */
  var dioTab = "disp", inSel = "", inEditId = "", inDraft = null, gpRet = "gp";
  var dioF = { disp:{q:"",sel:"all",from:"",to:""}, inw:{q:"",sel:"all",from:"",to:""}, held:{q:"",sel:"all",from:"",to:""} };
  var DIO_MAX = 100;
  function inList(){ return (state.inwards = state.inwards || []); }
  function inItemsAll(){ return (state.inwardItems = state.inwardItems || []); }
  function inItemsOf(id){ return inItemsAll().filter(function(i){ return i.inId === id; }).sort(function(a,b){ return (a.created||0)-(b.created||0); }); }
  function inFind(id){ return inList().find(function(e){ return e.id === id; }); }
  function gpFind(id){ return (state.gatePasses || []).find(function(g){ return g.id === id; }); }
  function gpNo(id){ var g = gpFind(id); return g ? (g.number || "") : ""; }
  function inMine(e){ return isMaster() || (session && e.createdBy === session.id); }
  function inNo(e){ return e.number || "assigning number…"; }
  function dioInRange(d, f){ if(f.from && d < f.from) return false; if(f.to && d > f.to) return false; return true; }
  function dioHas(txt, q){ var w = String(q||"").toLowerCase().split(/\s+/).filter(Boolean), t = String(txt).toLowerCase(); return w.every(function(x){ return t.indexOf(x) >= 0; }); }

  /* list 1: Kozhikode SS assets sent out on a RETURNABLE gate pass (created automatically from the gate passes) */
  function dispRows(){
    var gps = {}; (state.gatePasses || []).forEach(function(g){ gps[g.id] = g; });
    var out = [];
    (state.gateItems || []).forEach(function(i){ var g = gps[i.gpId]; if(g && g.asset === "YES" && g.type === "RETURNABLE") out.push({ it:i, g:g }); });
    out.sort(function(a,b){ return (b.g.date||"").localeCompare(a.g.date||"") || (b.g.created||0)-(a.g.created||0) || (a.it.created||0)-(b.it.created||0); });
    return out;
  }
  /* list 2: material of another station / firm received at Kozhikode SS (held until returned on a gate pass) */
  function heldRows(){
    var ents = {}; inList().forEach(function(e){ ents[e.id] = e; });
    var out = [];
    inItemsAll().forEach(function(i){ var e = ents[i.inId]; if(e && e.asset === "NO") out.push({ it:i, e:e }); });
    out.sort(function(a,b){ return (b.e.date||"").localeCompare(a.e.date||"") || (b.e.created||0)-(a.e.created||0) || (a.it.created||0)-(b.it.created||0); });
    return out;
  }
  function inRestoreGp(gpId){ inItemsAll().forEach(function(i){ if(i.retGpId === gpId){ i.ret = ""; i.retDate = ""; i.retGpId = ""; i.retGateItemId = ""; } }); }
  function inRestoreItem(giId){ inItemsAll().forEach(function(i){ if(i.retGateItemId === giId){ i.ret = ""; i.retDate = ""; i.retGpId = ""; i.retGateItemId = ""; } }); }
  /* adds the chosen inward items to a gate pass and marks them returned */
  function inAttach(gp, itemIds){
    var map = [];
    itemIds.forEach(function(iid){
      var r = inItemsAll().find(function(x){ return x.id === iid; }); if(!r || r.ret) return;
      var gid = uid();
      (state.gateItems = state.gateItems || []).push({ id:gid, gpId:gp.id, desc:r.desc, qty:r.qty, unit:r.unit, created:Date.now()+map.length, rcv:"", rcvDate:"", rcvInId:"" });
      r.ret = "Y"; r.retDate = gp.date; r.retGpId = gp.id; r.retGateItemId = gid; map.push({ inItemId:iid, gateItemId:gid });
    });
    if(map.length) ampSend({ action:"gpAttachIn", gpId:gp.id, map:map });
    return map.length;
  }
  function applyInDraft(d, e, ids){
    d.inEntry = e.id; d.inPick = {};
    inItemsOf(e.id).forEach(function(i){ if(!i.ret && (!ids || ids.indexOf(i.id) >= 0)) d.inPick[i.id] = true; });
    d.asset = "NO"; d.type = "RETURNABLE"; d.toStn = e.party;
    if(!d.receiverName && e.deliveredBy) d.receiverName = e.deliveredBy;
    if(!d.receiverPhone && e.deliveredPhone) d.receiverPhone = e.deliveredPhone;
  }
  /* gate pass form: "fill from an existing inward entry" block */
  function gpInBlock(d, edit){
    if(edit) return "";
    var pend = heldRows().filter(function(r){ return !r.it.ret; }), by = {}, order = [];
    pend.forEach(function(r){ if(!by[r.e.id]){ by[r.e.id] = []; order.push(r.e); } by[r.e.id].push(r.it); });
    if(!order.length) return "";
    var h = '<div class="assign-form" style="background:#fff"><h4>Return material of another station / firm (optional)</h4><div class="field"><label for="gpInEntry">Fill the gate pass from an inward entry</label><select id="gpInEntry"><option value="">Not from an inward entry</option>'+
      order.map(function(e){ return '<option value="'+esc(e.id)+'"'+(e.id === d.inEntry ? ' selected' : '')+'>'+esc((e.number||"Inward")+" · "+e.party+" · "+fmtDate(e.date)+" ("+by[e.id].length+" pending)")+'</option>'; }).join("")+'</select></div>';
    if(d.inEntry && by[d.inEntry]) h += '<div style="margin-top:8px">'+by[d.inEntry].map(function(i){
      return '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:4px 0"><input type="checkbox" data-gpinpick="'+esc(i.id)+'"'+(d.inPick[i.id] ? ' checked' : '')+'> <span>'+esc(i.desc)+' &mdash; '+esc(gpQty(i))+'</span></label>'; }).join("")+
      '<p style="margin:6px 0 0;color:var(--muted);font-size:.85rem">The ticked items are added to the gate pass and marked as returned when you save it.</p></div>';
    return h+'</div>';
  }
  /* gate pass detail: add items from the inward entries */
  function gpPickInward(g){
    var pend = heldRows().filter(function(r){ return !r.it.ret; });
    if(!pend.length){ alert("No pending material of another station / firm in the inward entries."); return; }
    var html = '<h3>Add from inward entries</h3><p style="margin-top:0;color:var(--muted);font-size:.9rem">Tick the items being returned. They are added to this gate pass and marked as returned in the inward list.</p><div style="max-height:50vh;overflow:auto">', last = "";
    pend.forEach(function(r){
      if(r.e.id !== last){ last = r.e.id; html += '<p style="margin:10px 0 2px;font-weight:700">'+esc(r.e.party)+' <small style="font-weight:400;color:var(--muted)">'+esc(inNo(r.e))+' &middot; '+esc(fmtDate(r.e.date))+'</small></p>'; }
      html += '<label style="display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-weight:400"><input type="checkbox" data-pik="'+esc(r.it.id)+'"> <span>'+esc(r.it.desc)+' &mdash; '+esc(gpQty(r.it))+'</span></label>';
    });

    $("mNo").onclick = closeModal;

      if(!ids.length){ $("piErr").textContent = "Tick at least one item."; return; }
      if(gpItemsOf(g.id).length + ids.length > 50){ $("piErr").textContent = "Maximum 50 items per gate pass."; return; }
      closeModal(); inAttach(g, ids); render();

  }

  /* filter bar shared by the three lists */

      '<div class="field"><label for="dioSel">'+selLabel+'</label><select id="dioSel">'+selOpts.map(function(o){ return '<option value="'+o[0]+'"'+(o[0] === f.sel ? ' selected' : '')+'>'+o[1]+'</option>'; }).join("")+'</select></div>'+

      '<div class="field"><label for="dioTo">To</label><input type="date" id="dioTo" value="'+esc(f.to)+'"></div>'+
      '<div class="field"><button class="btn ghost small" id="dioClr" type="button">Clear</button></div></div>';

    $("dioSel").onchange = function(){ f.sel = this.value; renderDio(); };
    $("dioFrom").onchange = function(){ f.from = this.value; renderDio(); };
    $("dioTo").onchange = function(){ f.to = this.value; renderDio(); };
    $("dioClr").onclick = function(){ f.q = ""; f.sel = "all"; f.from = ""; f.to = ""; renderDio(); };

  function dioShowing(n, total){ return '<p style="margin:0 0 8px;color:var(--muted);font-size:.85rem">Showing '+Math.min(n, DIO_MAX)+' of '+n+(n !== total ? ' (filtered from '+total+')' : '')+(n > DIO_MAX ? ' &ndash; narrow the filter to see the rest' : '')+'.</p>'; }

  function renderDio(){
    var p = $("panel"), nHeld = heldRows().filter(function(r){ return !r.it.ret; }).length;

      '<div class="filters" style="flex-wrap:wrap">'+tabs.map(function(t){ return '<button type="button" data-dtab="'+t[0]+'"'+(dioTab === t[0] ? ' class="active"' : '')+'>'+esc(t[1])+'</button>'; }).join("")+'</div>';
    var f, list, total;

      f = dioF.disp; var all = dispRows(); total = all.length;

        if(!dioInRange(r.g.date, f)) return false;

        dioBar(f, "Status", [["all","All"],["sent","Sent"],["received","Received"]], "Search item, gate pass no., station…")+

              '<td data-label="Gate pass no."><button class="btn ghost small" data-gpo="'+esc(r.g.id)+'" type="button">'+esc(r.g.number || "…")+'</button></td><td data-label="Sent to">'+esc(r.g.toStn)+'</td>'+
              '<td data-label="Status">'+(r.it.rcv === "Y" ? '<span class="oilb ok">Received</span><small style="display:block;color:var(--muted)">'+esc(fmtDate(r.it.rcvDate))+(e ? ' &middot; <a href="#" data-ino="'+esc(e.id)+'">'+esc(e.number)+'</a>' : '')+'</small>' : '<span class="oilb ds">Sent</span>')+'</td></tr>';
          }).join("")+'</tbody></table></div>';

    } else if(dioTab === "inw"){

      list = ents.filter(function(e){
        if(f.sel !== "all" && e.asset !== f.sel) return false;
        if(!dioInRange(e.date, f)) return false;

      });

            '<button class="btn small" data-inopen="'+esc(e.id)+'" type="button">Open</button></div>'+

            '<small style="color:var(--muted)">'+its.length+' item'+(its.length === 1 ? '' : 's')+(own ? '' : ' &middot; '+nr+' returned')+' &middot; Entered by '+esc(e.createdByName)+'</small></div>';

      });

      h += '<p style="margin:0 0 10px;color:var(--muted);font-size:.9rem">Material of another station or firm received at Kozhikode SS. An item stays <b>Held</b> until it is added to a gate pass (from the gate pass screen, or with &ldquo;Return via gate pass&rdquo; here); it is then marked <b>Returned</b> automatically.</p>'+

      if(!total) h += '<div class="empty">No material of another station / firm has been booked in yet.</div>';

          list.slice(0, DIO_MAX).map(function(r){
            var rg = r.it.ret ? gpFind(r.it.retGpId) : null;

  /* ---------- inward entry: form ---------- */
  function inBlankRow(){ return { id:uid(), desc:"", qty:"", unit:"Nos" }; }

    });

        '<td class="l">'+esc((x && x.workingUnderName) || s.workingUnderName || "")+'</td></tr>';

      '<div class="sg"><div>Prepared by (AMC)</div><div>Verified by (POWERGRID)</div></div>'+docFoot();

  /* ---------- AMC staff daily work update ---------- */
  var ATT = { P:"P (Present)", A:"A (Absent)", FHL:"FHL (First half leave)", SHL:"SHL (Second half leave)", NH:"NH (National holiday)" };
  function attWork(a){ return a === "P" || a === "FHL" || a === "SHL"; }
  function dKey(sid, d){ return (d||amcDate)+"|"+sid; }
  function dVal(s){
    var r = amcDraft[dKey(s.id)]; if(r) return r;
    var x = (state.amcDaily||[]).find(function(y){ return y.staffId === s.id && y.date === amcDate; });
    var hx = (state.amcHours||[]).find(function(y){ return y.staffId === s.id && y.date === amcDate && y.kind === "auto"; });
    return x ? { att:x.attendance, work:x.work, status:x.status||"OPEN", srem:x.statusRemark||"", hrs: hx ? hx.hours : undefined, need:false } : { att:"", work:"", status:"OPEN", srem:"", hrs:undefined, need:false };
  }
  /* ---------- Overtime / early leave of AMC labour (hours ledger) ---------- */
  function r2(n){ return Math.round(n*100)/100; }
  function hrsNum(h){ return String(r2(Math.abs(h))); }
  function hrsLabel(h){ return h === 0 ? "on time" : (h > 0 ? hrsNum(h)+" h late (extra)" : hrsNum(h)+" h early (less)"); }
  function hrsBalance(sid){ return r2((state.amcHours||[]).reduce(function(a,x){ return x.staffId === sid ? a+x.hours : a; },0)); }
  function hrsBalHTML(b){
    if(b === 0) return '<b>0 h</b>';
    return b > 0 ? '<b style="color:#1a7f37">+'+hrsNum(b)+' h</b> <small style="color:var(--muted)">extra</small>'
                 : '<b style="color:var(--red)">&minus;'+hrsNum(b)+' h</b> <small style="color:var(--muted)">less</small>';
  }
  function hrsNote(v){ return (typeof v.hrs === "number") ? '<span class="cmt">Check-out: '+esc(hrsLabel(v.hrs))+'</span>' : ''; }
  function draftOf(s){ var k = dKey(s.id); if(!amcDraft[k]) amcDraft[k] = Object.assign({}, dVal(s)); return amcDraft[k]; }
  /* asked when work status of a worker is set from OPEN to COMPLETED */
  function hoursModal(s){
    var d = draftOf(s), cur = (typeof d.hrs === "number") ? d.hrs : null;
    openModal('<h3>Check-out time &ndash; '+esc(s.name)+'</h3><p style="margin-top:0">Work is being marked <b>COMPLETED</b> for '+esc(fmtDate(amcDate))+'. How early or late did he check out?</p>'+
      '<div class="field"><label for="hhDir">Checked out</label><select id="hhDir"><option value="0"'+(cur===0?' selected':'')+'>On time</option>'+
      '<option value="1"'+(cur>0?' selected':'')+'>Late &ndash; extra hours (overtime)</option><option value="-1"'+(cur<0?' selected':'')+'>Early &ndash; less hours</option></select></div>'+
      '<div class="field" id="hhWrap"'+(cur ? '' : ' style="display:none"')+'><label for="hhVal">Hours (e.g. 1.5 for 1 h 30 min)</label>'+
      '<input type="number" id="hhVal" min="0.25" max="24" step="0.25" inputmode="decimal" value="'+(cur ? hrsNum(cur) : '')+'"></div>'+
      '<p class="error" id="hhErr"></p><div class="row"><button class="btn ghost" id="hhNo" type="button">Cancel</button><button class="btn ghost" id="hhOk" type="button">Add to update</button><button class="btn" id="hhSave" type="button">Save update</button></div>'+
      '<p style="margin:8px 0 0;color:var(--muted);font-size:.85rem"><b>Save update</b> saves the hours and the day\u2019s update now. <b>Add to update</b> keeps the hours and lets you continue editing &ndash; press &ldquo;Save updates&rdquo; at the bottom later.</p>');
    $("hhDir").onchange = function(){ $("hhWrap").style.display = $("hhDir").value === "0" ? "none" : ""; };
    $("hhNo").onclick = function(){
      if(d.need){ d.status = "OPEN"; d.hrs = null; d.need = false; }   // not answered: work stays OPEN
      closeModal(); renderPanel();
    };
    function applyHrs(thenSave){
      var dir = +$("hhDir").value, v = 0;
      if(dir !== 0){ v = parseFloat($("hhVal").value); if(!(v > 0) || v > 24){ $("hhErr").textContent = "Enter the hours (more than 0 and up to 24)."; return; } }
      d.hrs = r2(dir*v); d.need = false; closeModal(); renderPanel();
      if(thenSave){
        var sv = $("adSave"); if(sv) sv.click();       // same save as the "Save updates" button
        var er = $("adErr"); if(er && er.textContent && er.scrollIntoView) er.scrollIntoView({ block:"center" });
      }
    }
    $("hhOk").onclick = function(){ applyHrs(false); };
    $("hhSave").onclick = function(){ applyHrs(true); };
  }
  function amcMaxDate(){ return addDays(today(), 1); }      // daily work can be entered up to tomorrow (e.g. on Friday up to Saturday)

    var h = '<div class="datebar"><input type="date" id="adDt" value="'+amcDate+'" max="'+amcMaxDate()+'" aria-label="Date"><span class="dlabel">'+esc(dayLabel(amcDate))+'</span></div>';

      '<option value="all"'+(amcExSel==="all"?' selected':'')+'>All contract employees ('+staff.length+')</option>'+

    h += '<div style="overflow-x:auto"><table class="atable"><thead><tr><th>#</th><th>Name</th><th>Attendance</th><th>Work details</th><th>Status of work</th><th>Working under</th></tr></thead><tbody>';
    staff.forEach(function(s,i){
      var v = dVal(s), w = attWork(v.att);
      h += '<tr data-srow="'+esc(s.id)+'"><td data-label="#">'+(i+1)+'</td><td data-label="Name"><b>'+esc(s.name)+'</b></td>';
      if(edit){
        h += '<td data-label="Attendance"><select data-f="att"><option value="">Select</option>'+Object.keys(ATT).map(function(k){ return '<option value="'+k+'"'+(v.att===k?' selected':'')+'>'+ATT[k]+'</option>'; }).join("")+'</select></td>'+
          '<td data-label="Work details"><input type="text" data-f="work" maxlength="300" placeholder="Work done" value="'+esc(v.work)+'"'+(w?'':' disabled')+'></td>'+
          '<td data-label="Status of work"><select data-f="status"'+(w?'':' disabled')+'><option value="OPEN"'+(v.status==="OPEN"?' selected':'')+'>OPEN</option><option value="COMPLETED"'+(v.status==="COMPLETED"?' selected':'')+'>COMPLETED</option></select>'+
          '<input type="text" data-f="srem" maxlength="200" placeholder="Status remarks" value="'+esc(v.srem)+'"'+(w?'':' disabled')+' style="margin-top:4px">'+
          (w && v.status==="COMPLETED" ? hrsNote(v)+'<button class="btn ghost small" data-hrs="'+esc(s.id)+'" type="button" style="margin-top:4px">'+(typeof v.hrs==="number"?'Change':'Set')+' check-out hours</button>' : '')+'</td>'+
          '<td data-label="Working under">'+esc(s.workingUnderName)+' <button class="btn ghost small" data-xfer="'+esc(s.id)+'" type="button">Transfer</button></td>';
      } else {
        h += '<td data-label="Attendance">'+(v.att ? esc(ATT[v.att]||v.att) : '<span style="color:var(--muted)">Not updated</span>')+'</td><td data-label="Work details">'+(v.work?esc(v.work):'–')+'</td>'+
          '<td data-label="Status of work">'+(v.att && w ? esc(v.status)+(v.srem?'<span class="cmt">Remarks: '+esc(v.srem)+'</span>':'')+(v.status==="COMPLETED"?hrsNote(v):'') : '–')+'</td><td data-label="Working under">'+esc(s.workingUnderName)+'</td>';
      }
      h += '</tr>';
    });
    return h+'</tbody></table></div>';
  }
  function bindDaily(p, edit){
    var dt = $("adDt");
    if(dt) dt.onchange = function(){ if(!this.value) return; amcDate = this.value > amcMaxDate() ? amcMaxDate() : this.value; renderPanel(); };
    var exSel = $("adExSel"), exBtn = $("adExport");
    if(exSel) exSel.onchange = function(){ amcExSel = exSel.value; };
    if(exBtn) exBtn.onclick = function(){ amcExSel = exSel.value; amcDailyExport(amcDate, amcExSel); };
    if(!edit) return;
    Array.prototype.forEach.call(p.querySelectorAll("[data-srow]"),function(tr){
      var sid = tr.getAttribute("data-srow");
      function g(f){ return tr.querySelector('[data-f="'+f+'"]'); }
      function sync(){
        var att = g("att").value, w = attWork(att), st = g("status").value, prev = dVal(amcStaffById(sid));
        var hrs = prev.hrs, need = !!prev.need;
        if(!w || st !== "COMPLETED"){ hrs = null; need = false; }                   // not completed: any check-out hours are cleared
        else if(prev.status !== "COMPLETED"){ hrs = undefined; need = true; }       // OPEN -> COMPLETED: ask the hours
        ["work","status","srem"].forEach(function(f){ g(f).disabled = !w; });
        amcDraft[dKey(sid)] = { att:att, work:g("work").value, status: w ? st : "OPEN", srem:g("srem").value, hrs:hrs, need:need };
      }
      Array.prototype.forEach.call(tr.querySelectorAll("[data-f]"),function(el){ el.addEventListener("input",sync); el.addEventListener("change",sync); });
      g("status").addEventListener("change",function(){ var dr = amcDraft[dKey(sid)], sf = amcStaffById(sid); if(dr && dr.need && sf) hoursModal(sf); });
      g("att").addEventListener("change",function(){ var dr = amcDraft[dKey(sid)], sf = amcStaffById(sid); if(dr && dr.need && sf) hoursModal(sf); });
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-hrs]"),function(b){
      b.onclick = function(){ var sf = amcStaffById(b.getAttribute("data-hrs")); if(sf) hoursModal(sf); };
    });
    var sv = $("adSave");
    if(sv) sv.onclick = function(){
      var entries = [], err = $("adErr"), d = amcDate, bad = "", badH = "";
      (state.amcStaff||[]).forEach(function(s){
        var v = dVal(s); if(!v.att) return; var w = attWork(v.att);
        if(w && !v.work.trim() && !bad) bad = s.name;
        var done = w && v.status === "COMPLETED";
        if(done && v.need && typeof v.hrs !== "number" && !badH) badH = s.name;
        entries.push({ staffId:s.id, attendance:v.att, work: w ? v.work.trim() : "", status: w ? v.status : "OPEN", statusRemark: w ? v.srem.trim() : "",
                       hours: done ? (typeof v.hrs === "number" ? v.hrs : undefined) : null });
      });
      if(bad){ err.textContent = "Enter work details for "+bad+"."; return; }
      if(badH){ err.textContent = "Set the check-out hours (early / late) for "+badH+" – use the \u201cSet check-out hours\u201d button."; return; }
      var tmpOut = [], terr = "";
      tempDraftGet(d).forEach(function(t, i){
        if(terr) return;
        var nm = String(t.name||"").trim();
        if(!nm){ terr = "Enter the name of temporary labour #"+(i+1)+"."; return; }
        if(!t.under){ terr = "Select whom "+nm+" works under."; return; }
        if(!t.att){ terr = "Select attendance for "+nm+"."; return; }
        var tw = attWork(t.att);
        if(tw && !String(t.work||"").trim()){ terr = "Enter work details for "+nm+"."; return; }
        tmpOut.push({ id:t.id, contractId:(t.cid||myContractId()), name:nm, skill:t.skill, workingUnder:t.under, attendance:t.att,
          work: tw ? String(t.work).trim() : "", status: tw ? t.status : "OPEN", statusRemark: tw ? String(t.srem||"").trim() : "" });
      });
      if(terr){ err.textContent = terr; return; }
      var hadTemp = (state.amcTemp||[]).some(function(x){ return x.date === d && x.contractId === myContractId(); });
      if(!entries.length && !tmpOut.length && !hadTemp){ err.textContent = "Select attendance for at least one person."; return; }
      err.textContent = "";
      amcCall({ action:"amcDailySave", date:d, entries:entries, temp:tmpOut }, function(){ (state.amcStaff||[]).forEach(function(s){ delete amcDraft[dKey(s.id, d)]; }); delete amcTempDraft[myContractId()+"|"+d]; });
    };
  }
  /* ---------- Temporary labour: added afresh every day by the AMC login (each entry belongs to ONE date only) ---------- */

    var k = myContractId()+"|"+d;
    if(!amcTempDraft[k]) amcTempDraft[k] = (state.amcTemp||[]).filter(function(x){ return x.date === d && x.contractId === myContractId(); }).map(function(x){
      return { id:x.id, cid:x.contractId, name:x.name, skill:x.skill, under:x.workingUnder, att:x.attendance, work:x.work, status:x.status||"OPEN", srem:x.statusRemark||"" };

          '<td data-label="Name"><input type="text" data-tf="name" maxlength="100" placeholder="Name of labour" value="'+esc(t.name)+'"></td>'+
          '<td data-label="Contract"><select data-tf="cid">'+(state.contracts||[]).map(function(c){ return '<option value="'+esc(c.id)+'"'+((t.cid||myContractId())===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join("")+'</select></td>'+
          '<td data-label="Skill"><select data-tf="skill">'+AMC_SKILLS.map(function(k){ return '<option value="'+k+'"'+(t.skill===k?' selected':'')+'>'+k+'</option>'; }).join("")+'</select></td>'+
          '<td data-label="Attendance"><select data-tf="att"><option value="">Select</option>'+Object.keys(ATT).map(function(k){ return '<option value="'+k+'"'+(t.att===k?' selected':'')+'>'+ATT[k]+'</option>'; }).join("")+'</select></td>'+
          '<td data-label="Work details"><input type="text" data-tf="work" maxlength="300" placeholder="Work done" value="'+esc(t.work)+'"'+(w?'':' disabled')+'></td>'+
          '<td data-label="Status of work"><select data-tf="status"'+(w?'':' disabled')+'><option value="OPEN"'+(t.status==="OPEN"?' selected':'')+'>OPEN</option><option value="COMPLETED"'+(t.status==="COMPLETED"?' selected':'')+'>COMPLETED</option></select>'+
          '<input type="text" data-tf="srem" maxlength="200" placeholder="Status remarks" value="'+esc(t.srem)+'"'+(w?'':' disabled')+' style="margin-top:4px"></td>'+
          '<td data-label="Working under"><select data-tf="under"><option value="">Select</option>'+emps.map(function(e){ return '<option value="'+esc(e.id)+'"'+(t.under===e.id?' selected':'')+'>'+esc(e.name)+'</option>'; }).join("")+'</select></td>'+
          '<td class="act" style="width:auto"><button class="btn danger small" data-tdel="'+i+'" type="button">Remove</button></td></tr>';

    return h+'<button class="btn ghost small" id="tmpAdd" type="button" style="margin-top:8px">+ Add temporary labour</button>';

  function bindTemp(p){

  /* ---------- Follow-ups & Procurement (Master and Users) ---------- */
  var FU_ST = { open:"OPEN", closed:"CLOSED" }, fuFilter = "all", RSEP = "\u00A6";
  var PR_ST = { tbi:"TO BE INITIATED", proposed:"PROPOSED", awarded:"AWARDED", procured:"PROCURED" }, prFilter = "all";
  var PR_UNITS = ["Nos","Set","Pair","Mtr","Km","Kg","MT","Ltr","Box","Roll","Pkt","Lot","Job","Month","Year","LS"];
  function stOpts(map, sel){ return Object.keys(map).map(function(k){ return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+map[k]+'</option>'; }).join(""); }
  var remOpen = {};      // remark lists the user has expanded (kept across refreshes)
  function fuEntriesHTML(f){
    var ents = String(f.remarks||"").split(RSEP).filter(Boolean);
    if(!ents.length) return '<span style="color:var(--muted)">No remarks yet</span>';
    var open = !!remOpen[f.id], n = ents.length, last = ents[n-1], li = last.indexOf("\n");
    var pv = (li < 0 ? last : last.slice(li+1)).replace(/\s+/g," ").trim(); if(pv.length > 40) pv = pv.slice(0,40)+"…";
    var h = '<button type="button" class="remtog'+(open?' open':'')+'" data-remtog="'+esc(f.id)+'" aria-expanded="'+(open?'true':'false')+'"><span class="car">&#9656;</span><b>'+n+(n===1?' remark':' remarks')+'</b>'+(open ? '' : '<span class="pv">· '+esc(pv)+'</span>')+'</button>';
    if(open) h += '<div class="rtree">'+ents.map(function(x){
      var i = x.indexOf("\n"), head = i < 0 ? "" : x.slice(0,i), body = i < 0 ? x : x.slice(i+1);
      return '<div class="rn"><small style="color:var(--muted);display:block">'+esc(head)+'</small><span style="white-space:pre-wrap">'+esc(body)+'</span></div>';
    }).join("")+'</div>';
    return h;
  }
  function bindRemTog(p){
    Array.prototype.forEach.call(p.querySelectorAll("[data-remtog]"),function(b){
      b.onclick = function(){ var id = b.getAttribute("data-remtog"); remOpen[id] = !remOpen[id]; softRender(); };
    });
  }
  function fuStamp(text){ return fmtStamp(Date.now())+" · "+(session ? ((session.displayName)||session.id) : "")+"\n"+text.replace(/\u00A6/g,"|"); }
  function fuObj(f, remark){ return { id:f.id, details:f.details, status:f.status, remark: remark||"", created:f.created }; }

    var p = $("panel"), all = state.fu = state.fu || [], master = isMaster();

    var h = '<div class="panel-head"><h3>Follow-up</h3><div class="stats"><span>Total <b>'+all.length+'</b></span><span>Open <b>'+nOpen+'</b></span><span>Closed <b>'+(all.length-nOpen)+'</b></span></div></div>'+

  function prCheck(x){

    if(x.status === "procured"){ if(!x.poNo) return "PO no. is mandatory when status is PROCURED."; if(!x.poDate) return "PO date is mandatory when status is PROCURED."; }

  /* ---------- Employee panel ---------- */
  function bindHead(e, done){
    var p = $("panel");
    var bw = $("backWorks"); if(bw) bw.onclick = function(){ activeTab = "works"; render(); };
    Array.prototype.forEach.call(p.querySelectorAll("[data-view]"),function(b){
      b.onclick = function(){ empView = b.getAttribute("data-view"); render(); if(empView === "claims") claimFetch(); };
    });
    var ac = $("availChg");
    if(ac) ac.onclick = function(){
      availSave(e.id, availOf(e.id) !== "yes", function(){ render(); }, function(){});
    };
    if(!isMaster()) return;
    $("renameEmp").onclick = function(){
      empFormModal("Edit employee", e, function(v){
        e.userId = v.userId; e.name = v.name; e.desig = v.desig; e.roles = v.roles;
        commit([{ t:"emp.put", emp:{ id:e.id, userId:e.userId, name:encEmp(e) } }]); render();
      });
    };
    var cd = $("clearDone");
    if(cd) cd.onclick = function(){
      if(!done) return;
      confirmModal("Delete all "+done+" completed works of "+e.name+" on "+fmtDate(viewDate)+"?", function(){
        var gone = e.works.filter(function(x){ return x.done && x.date===viewDate; });
        e.works = e.works.filter(function(x){ return !(x.done && x.date===viewDate); });
        commit(gone.map(function(x){ return { t:"work.del", id:x.id }; })); render();
      });
    };
    $("delEmp").onclick = function(){
      confirmModal("Delete employee “"+e.name+"”, their works and calendar events? This cannot be undone.", function(){
        state.employees = state.employees.filter(function(x){ return x.id!==e.id; });
        state.events = state.events.filter(function(x){ return x.scope!==e.id; });
        activeTab = "dash";
        commit([{ t:"emp.del", id:e.id }]); render();
      });
    };
  }

  function renderPanel(){
    if(activeTab === "home"){ renderHome(); return; }
    if(activeTab === "works"){ renderWorks(); return; }
    if(activeTab === "dash"){ renderDashboard(); return; }
    if(activeTab === "assign"){ renderAssignments(); return; }
    if(activeTab === "maint"){ renderMaint(); return; }
    if(activeTab === "follow"){ renderFollow(); return; }
    if(activeTab === "proc"){ renderProc(); return; }
    if(activeTab === "amp"){ renderAmp(); return; }
    if(activeTab === "amc"){ renderAmc(); return; }
    if(activeTab === "misc"){ renderMisc(); return; }
    if(activeTab === "contracts"){ contractsModal(); activeTab = "home"; return; }
    if(isSupport()){ renderSupportHome(); return; }
    var e = emp(activeTab), p = $("panel");
    if(!e){ p.innerHTML = '<div class="empty">No employee selected.</div>'; return; }

    var dayWorks = e.works.filter(function(w){ return w.date === viewDate; });
    var total = dayWorks.length, done = dayWorks.filter(function(w){ return w.done; }).length;
    var pct = total ? Math.round(done/total*100) : 0;
    var canClaims = SYNC && !!session && session.role === "user" && e.id === myEmpId();       // Claims: visible to the employee himself only
    if(empView === "claims" && !canClaims) empView = "work";
    if(empView === "appr" && !canEditWorks(e)) empView = "work";
    var work = empView === "work";
    var canW = canEditWorks(e);       // only the employee himself and Master can add / change these works

    var h = '<div style="margin-bottom:10px"><button class="btn ghost small" id="backWorks" type="button">&lsaquo; All employees</button></div>';
    h += '<div class="panel-head"><div><h3 style="display:inline">'+esc(e.name)+'</h3>'+(e.desig?'<span class="desig" style="display:inline-block;margin-left:8px">'+esc(e.desig)+'</span>':'')+rolesHTML(e)+'</div>';
    if(work) h += '<div class="stats"><span>Total <b>'+total+'</b></span><span>Done <b>'+done+'</b></span><span>Pending <b>'+(total-done)+'</b></span></div>';
    h += '</div>';
    h += '<div style="margin:-4px 0 10px">'+availChip(e.id)+(canW ? ' <button class="btn ghost small" id="availChg" type="button">'+(availOf(e.id) ? 'Change' : 'Set')+'</button>' : '')+'</div>';
    h += '<div class="viewsw"><button type="button" data-view="work" class="'+(work?"active":"")+'">Worklist</button>'+
         '<button type="button" data-view="cal" class="'+(empView==="cal"?"active":"")+'">Calendar</button>'+
         '<button type="button" data-view="range" class="'+(empView==="range"?"active":"")+'">Search / Date range</button>'+
         (canW ? '<button type="button" data-view="appr" class="'+(empView==="appr"?"active":"")+'">Appraisal</button>' : '')+
         (canClaims ? '<button type="button" data-view="claims" class="'+(empView==="claims"?"active":"")+'">Claims</button>' : '')+'</div>';
    if(isMaster()){
      h += '<div class="mbar">'+
           '<button class="btn ghost small" id="renameEmp" type="button">Edit employee</button>'+
           (work?'<button class="btn ghost small" id="clearDone" type="button">Clear completed (this date)</button>':'')+
           '<button class="btn danger small" id="delEmp" type="button">Delete employee</button></div>';
    }

    if(empView === "claims"){ claimsView(e, p, h, done); return; }
    if(empView === "range"){ rangeView(e, p, h); return; }
    if(empView === "appr"){ apprView(e, p, h); return; }
    if(!work){
      h += calHTML(e.id);
      p.innerHTML = h;
      bindHead(e, done); bindCal(e.id, p);
      return;
    }

    var overdue = e.works.filter(function(w){ return !w.done && w.date < viewDate && w.date <= today(); });
    var byDate = {};
    overdue.forEach(function(w){ byDate[w.date] = (byDate[w.date]||0)+1; });
    var oDates = Object.keys(byDate).sort().reverse();

    var myA = state.assignments.filter(function(a){ return a.to===e.id && !a.done; });
    if(myA.length){
      var myLate = myA.filter(asOverdue).length;
      h += '<div class="carry"><div class="carry-txt"><b>'+myA.length+' assignment'+(myA.length>1?'s':'')+'</b> pending for '+esc(e.name)+(myLate?' ('+myLate+' overdue)':'')+'</div>'+
           '<button class="btn small" id="viewAssign" type="button">View assignments</button></div>';
    }
    var inX = canW ? xfersIn(e.id) : [];
    if(inX.length){
      h += '<div class="xin"><b style="font-size:.88rem">Transfer request'+(inX.length>1?'s':'')+' for you</b>'+inX.map(function(x){
        return '<div class="xr"><div class="xt">'+esc(x.text)+wpriTag(x)+'<small>From '+esc(x.fromName)+' &middot; for '+fmtDate(x.date)+'</small></div>'+
               '<div><button class="btn small" data-xacc="'+esc(x.id)+'" type="button">Accept</button> <button class="btn ghost small" data-xdec="'+esc(x.id)+'" type="button">Decline</button></div></div>';
      }).join("")+'</div>';
    }
    h += '<div class="datebar">'+
         '<button class="btn ghost small" id="dPrev" type="button" aria-label="Previous day">‹ Previous</button>'+
         '<input type="date" id="dPick" value="'+viewDate+'" aria-label="Select date">'+
         '<button class="btn ghost small" id="dNext" type="button" aria-label="Next day">Next ›</button>'+
         '<button class="btn small" id="dToday" type="button"'+(viewDate===today()?' disabled':'')+'>Today</button>'+
         '<button class="btn ghost small" id="dExport" type="button" title="Export the worklist of this date as PDF">Export PDF</button>'+
         '<span class="dlabel">'+esc(dayLabel(viewDate))+'</span></div>';

    if(!canW){
      if(overdue.length) h += '<div class="carry"><div class="carry-txt" style="color:var(--muted)">'+overdue.length+' pending from earlier dates</div></div>';
    } else if(!overdue.length){
      h += '<div class="carry"><div class="carry-txt" style="color:var(--muted)">No pending works from earlier dates.</div>'+
           '<button class="btn small" type="button" disabled>Bring all to '+fmtDate(viewDate)+'</button></div>';
    } else {
      h += '<div class="carry"><div class="carry-txt"><b>'+overdue.length+' pending</b> from earlier dates: '+
        oDates.slice(0,8).map(function(d){
          return '<button type="button" class="chip" data-jump="'+d+'">'+fmtDate(d)+' ('+byDate[d]+')</button>';
        }).join("")+(oDates.length>8?' …':'')+'</div>'+
        '<button class="btn small" id="bringAll" type="button">Bring all to '+fmtDate(viewDate)+'</button></div>';
    }

    h += '<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';

    if(canW) h += '<div class="add-row">'+
         '<div class="field"><label for="wText">Add work for '+fmtDate(viewDate)+'</label><input type="text" id="wText" placeholder="e.g. Inspect 33 kV breaker, feeder 2" maxlength="300"></div>'+
         '<div class="field"><label for="wPri">Priority</label><select id="wPri">'+wpriOptions("normal")+'</select></div>'+
         '<button class="btn" id="wAdd" type="button">Add work</button></div>';

    h += '<div class="filters">'+
      ['all','pending','done'].map(function(f){
        return '<button type="button" data-f="'+f+'" class="'+(filter===f?"active":"")+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>';
      }).join("")+'</div>';

    var list = dayWorks.filter(function(w){
      return filter==="all" || (filter==="done"?w.done:!w.done);
    }).sort(function(a,b){
      if(!!a.done !== !!b.done) return a.done ? 1 : -1;          // completed works go to the bottom
      if(a.done) return (a.doneAt||0)-(b.doneAt||0) || a.created-b.created;   // ...in the order they were completed
      return a.created-b.created;
    });

    if(!list.length){
      h += '<div class="empty">'+(total? "No works match this filter." : "No work entered for "+fmtDate(viewDate)+". Add the first work above.")+'</div>';
    } else {
      h += '<table><thead><tr><th>Done</th><th>Work details</th><th></th></tr></thead><tbody>';
      list.forEach(function(w){
        var xo = xferOut(w.id), xdc = !xo && !w.done ? xferDeclined(w.id) : null;
        h += '<tr class="'+(w.done?"done":"")+'">'+
          '<td class="chk"><input type="checkbox" data-done="'+esc(w.id)+'" '+(w.done?"checked":"")+(canW?'':' disabled')+' aria-label="Mark complete"></td>'+
          '<td class="txt"><span class="wt wp-'+wpri(w)+'">'+esc(w.text)+'</span>'+wpriTag(w)+
            (w.movedFrom?'<span class="moved">Transferred from '+fmtDate(w.movedFrom)+'</span>':'')+
            (w.xferFrom?'<span class="moved">Transferred from '+esc(w.xferFrom)+'</span>':'')+
            (xo?'<span class="xnote">Waiting for '+esc(xo.toName)+' to accept (for '+fmtDate(xo.date)+')</span>':'')+
            (xdc?'<span class="xnote no">Declined by '+esc(xdc.toName)+'</span>':'')+
            (w.done&&w.doneAt?'<span class="doneat">Completed '+fmtStamp(w.doneAt)+'</span>':'')+
            (w.done&&w.comment?'<span class="cmt">Comment: '+esc(w.comment)+'</span>':'')+
            (w.done&&w.apr&&canW?'<span class="stag">&#9733; Appraisal</span>':'')+(w.done&&w.mh?'<span class="stag">&#9733; Monthly highlight</span>':'')+'</td>'+
          '<td class="act">'+(!canW ? '' : (w.done ? starBtn(w.id,"apr",w.apr)+starBtn(w.id,"mh",w.mh)+' ' : '')+
            (xo ? '<button class="btn ghost small" data-xcan="'+esc(xo.id)+'" type="button">Cancel transfer</button> '
                : (!w.done?'<button class="btn ghost small" data-move="'+esc(w.id)+'" type="button">Transfer</button> ':''))+
            '<button class="btn ghost small" data-edit="'+esc(w.id)+'" type="button">Edit</button>'+
            (isMaster()?' <button class="btn danger small" data-del="'+esc(w.id)+'" type="button">Delete</button>':''))+
          '</td></tr>';
      });
      h += '</tbody></table>';
    }
    p.innerHTML = h;
    bindHead(e, done);
    var va = $("viewAssign");
    if(va) va.onclick = function(){ activeTab = "assign"; assignTo = e.id; assignFilter = "pending"; render(); };

    function findWork(id){ return e.works.find(function(x){ return x.id===id; }); }
    function goDate(d){ if(!d) return; viewDate = d; filter = "all"; render(); }
    $("dPrev").onclick = function(){ goDate(addDays(viewDate,-1)); };
    $("dNext").onclick = function(){ goDate(addDays(viewDate,1)); };
    $("dToday").onclick = function(){ goDate(today()); };
    $("dPick").onchange = function(){ goDate(this.value); };
    $("dExport").onclick = function(){ workExport(e, viewDate); };
    Array.prototype.forEach.call(p.querySelectorAll("[data-jump]"),function(b){
      b.onclick = function(){ goDate(b.getAttribute("data-jump")); };
    });
    var ba = $("bringAll");
    if(ba) ba.onclick = function(){
      var ops = [];
      overdue.forEach(function(w){ w.movedFrom = w.date; w.date = viewDate; ops.push(wput(e,w)); });
      commit(ops); render();
    };

    function addWork(){
      var t = $("wText").value.trim();
      if(!t){ $("wText").focus(); return; }
      var w = { id: uid(), text: t, date: viewDate, done:false, doneAt:null, movedFrom:"", comment:"", created: Date.now(), priority: $("wPri").value };
      e.works.push(w);
      commit([wput(e,w)]); render();
      $("wPri").value = "normal";
      $("wText").focus();
    }
    if(canW){
      $("wAdd").onclick = addWork;
      $("wText").addEventListener("keydown",function(ev){ if(ev.key==="Enter") addWork(); });
    }

    Array.prototype.forEach.call(p.querySelectorAll("[data-f]"),function(b){
      b.onclick = function(){ filter = b.getAttribute("data-f"); renderPanel(); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-done]"),function(c){
      c.onchange = function(){
        var w = findWork(c.getAttribute("data-done"));
        if(c.checked){                      // closing a work: ask for an optional comment
          c.checked = false;
          completeModal(e,w);
        } else {                            // re-opening a work
          w.done = false; w.doneAt = null; w.comment = ""; w.apr = false; w.mh = false;
          commit([wput(e,w)]); render();
        }
      };
    });
    bindStars(p, e, function(){ render(); });
    Array.prototype.forEach.call(p.querySelectorAll("[data-move]"),function(b){
      b.onclick = function(){ transferModal(e, findWork(b.getAttribute("data-move"))); };
    });
    function xById(id){ return (state.xfers||[]).find(function(x){ return x.id === id; }); }
    Array.prototype.forEach.call(p.querySelectorAll("[data-xacc]"),function(b){ b.onclick = function(){ var x = xById(b.getAttribute("data-xacc")); if(x) xferAccept(x); }; });
    Array.prototype.forEach.call(p.querySelectorAll("[data-xdec]"),function(b){ b.onclick = function(){ var x = xById(b.getAttribute("data-xdec")); if(x) xferDecline(x); }; });
    Array.prototype.forEach.call(p.querySelectorAll("[data-xcan]"),function(b){ b.onclick = function(){ var x = xById(b.getAttribute("data-xcan")); if(x) xferCancel(x); }; });
    Array.prototype.forEach.call(p.querySelectorAll("[data-del]"),function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-del");
        confirmModal("Delete this work entry?", function(){
          e.works = e.works.filter(function(x){ return x.id!==id; });
          commit([{ t:"work.del", id:id }]); render();
        });
      };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-edit]"),function(b){
      b.onclick = function(){ editWorkModal(e, findWork(b.getAttribute("data-edit"))); };
    });
  }

  /* ---------- Modals ---------- */
  function openModal(inner){
    $("modalRoot").innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';
    $("ov").addEventListener("mousedown",function(e){ if(e.target.id==="ov") closeModal(); });
  }
  function closeModal(){
    $("modalRoot").innerHTML = "";
    if(pendingRefresh){
      var pr = pendingRefresh; pendingRefresh = null;
      setTimeout(function(){
        if(pr.v === version && !queue.length && !flushing && !modalOpen()){
          lastText = pr.r.text; applyData(pr.r.json.data); softRender();
        }
      },0);
    }
  }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  function confirmModal(msg, onYes){
    openModal('<h3>Please confirm</h3><p>'+esc(msg)+'</p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn danger" id="mYes" type="button">Delete</button></div>');
    $("mNo").onclick = closeModal;
    $("mYes").onclick = function(){ closeModal(); onYes(); };
  }
  function promptModal(title,label,val,onOk){
    openModal('<h3>'+esc(title)+'</h3><div class="field"><label for="mIn">'+esc(label)+'</label>'+
      '<input type="text" id="mIn" maxlength="60" value="'+esc(val||"")+'"></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save</button></div>');
    var inp = $("mIn"); inp.focus(); inp.select();
    function ok(){ var v = inp.value.trim(); if(!v) return; closeModal(); onOk(v); }
    $("mNo").onclick = closeModal; $("mOk").onclick = ok;
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") ok(); });
  }
  function addEmployeeModal(){
    empFormModal("Add employee", {}, function(v){
      var n = { id: uid(), userId: v.userId, name: v.name, desig: v.desig, roles: v.roles, works: [] };
      state.employees.push(n); activeTab = n.id;
      if(!state.users.some(function(u){ return u.id === n.userId; })) state.users.push({id:n.userId,pass:"",role:"user"});
      // The server response is the source of truth. Do not force a second render here;
      // flush() will apply the saved snapshot after the backend confirms the write.
      commit([{ t:"emp.put", emp:{ id:n.id, userId:n.userId, name:encEmp(n) } }]);
      render();   // show the new employee immediately; the server reply then confirms it
    });
  }
  function empFormModal(title, cur, onSave){
    var sel = (cur.roles||[]).slice(), other = "";
    sel.forEach(function(r){ if(r.indexOf("Other: ")===0) other = r.slice(7); });
    function has(r){ return r === "OTHER (SPECIFY)" ? !!other : sel.indexOf(r) >= 0; }
    openModal('<h3>'+esc(title)+'</h3>'+
      '<div class="field"><label for="efUid">Employee No. / User ID</label><input type="text" id="efUid" maxlength="40" autocapitalize="off" value="'+esc(cur.userId||"")+'"><small style="color:var(--muted)">This is the ID the employee will use to log in.</small></div>'+
      '<div class="field"><label for="efName">Employee name</label><input type="text" id="efName" maxlength="60" value="'+esc(cur.name||"")+'"></div>'+
      '<div class="field"><label for="efDes">Designation</label><select id="efDes"><option value="">Select designation</option>'+
        DESIGS.map(function(d){ return '<option value="'+esc(d)+'"'+(d===cur.desig?' selected':'')+'>'+esc(d)+'</option>'; }).join("")+'</select></div>'+
      '<label>Roles (select one or more)</label><div class="chkgrid">'+
        ROLES.map(function(r){ return '<label class="chkitem"><input type="checkbox" data-role="'+esc(r)+'"'+(has(r)?' checked':'')+'> '+esc(r)+'</label>'; }).join("")+'</div>'+
      '<div class="field'+(other?'':' hidden')+'" id="efOtherWrap"><label for="efOther">Other role (specify)</label><input type="text" id="efOther" maxlength="40" value="'+esc(other)+'"></div>'+
      '<p class="error" id="efErr"></p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save</button></div>');
    $("efName").focus();
    $("mNo").onclick = closeModal;
    function otherBox(){ return document.querySelector('[data-role="OTHER (SPECIFY)"]'); }
    otherBox().onchange = function(){
      $("efOtherWrap").classList.toggle("hidden", !this.checked);
      if(this.checked) $("efOther").focus();
    };
    function clean(x){ return x.replace(/[\u00A7|]/g," ").replace(/\s+/g," ").trim(); }
    $("mOk").onclick = function(){
      var userId = clean($("efUid").value);
      var name = clean($("efName").value);
      if(!userId){ $("efErr").textContent = "Enter the Employee No. / User ID."; $("efUid").focus(); return; }
      if(!name){ $("efErr").textContent = "Enter the employee name."; $("efName").focus(); return; }
      var roles = [];
      Array.prototype.forEach.call(document.querySelectorAll("[data-role]"),function(c){
        var r = c.getAttribute("data-role");
        if(c.checked && r !== "OTHER (SPECIFY)") roles.push(r);
      });
      if(otherBox().checked){
        var o = clean($("efOther").value);
        if(!o){ $("efErr").textContent = "Specify the other role."; $("efOther").focus(); return; }
        roles.push("Other: "+o);
      }
      var rec = { userId: userId, name: name, desig: $("efDes").value, roles: roles };
      if(encEmp(rec).length > 300){ $("efErr").textContent = "Too many roles selected for the space available. Untick a few."; return; }
      closeModal(); onSave(rec);
    };
  }
  function editWorkModal(e,w){
    openModal('<h3>Edit work</h3>'+
      (isMaster()?'<div class="field"><label for="eDate">Date</label><input type="date" id="eDate" value="'+esc(w.date)+'"></div>':'')+
      '<div class="field"><label for="eText">Work details</label><input type="text" id="eText" maxlength="300" value="'+esc(w.text)+'"></div>'+
      '<div class="field"><label for="ePriW">Priority</label><select id="ePriW">'+wpriOptions(wpri(w))+'</select></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Save changes</button></div>');
    $("eText").focus();
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      var t = $("eText").value.trim(); if(!t) return;
      w.text = t; w.priority = $("ePriW").value; if(isMaster() && $("eDate")) w.date = $("eDate").value || w.date;
      closeModal(); commit([wput(e,w)]); render();
    };
  }
  function completeModal(e,w){
    openModal('<h3>Mark work as complete</h3>'+
      '<p style="margin-top:0">'+esc(w.text)+'</p>'+
      '<div class="field"><label for="cText">Comment (optional)</label>'+
      '<textarea id="cText" maxlength="300" placeholder="e.g. Replaced fuse, tested OK"></textarea></div>'+
      '<div class="stpick"><span>Optional:</span>'+
        '<span class="l">'+starBtn("c","apr",false).replace('data-star="c"','id="cApr"')+' Add to Appraisal</span>'+
        '<span class="l">'+starBtn("c","mh",false).replace('data-star="c"','id="cMh"')+' Add to Monthly highlights</span></div>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Mark complete</button></div>');
    $("cText").focus();
    Array.prototype.forEach.call([$("cApr"), $("cMh")],function(b){
      b.onclick = function(){ var on = !b.classList.contains("on"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); };
    });
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      w.done = true; w.doneAt = Date.now(); w.comment = $("cText").value.trim();
      w.apr = $("cApr").classList.contains("on"); w.mh = $("cMh").classList.contains("on");
      closeModal(); commit([wput(e,w)]); render();
    };
  }
  function transferModal(e,w){
    var from = w.date;
    var def = from < today() ? today() : addDays(from,1);
    var others = state.employees.filter(function(x){ return x.id !== e.id; });
    var selfLbl = (isMaster() && e.id !== myEmpId()) ? "Same employee ("+e.name+")" : "Myself";
    openModal('<h3>Transfer work</h3>'+
      '<p style="margin-top:0">'+esc(w.text)+' <small style="color:var(--muted)">&middot; on '+fmtDate(from)+'</small></p>'+
      '<div class="field"><label for="tTo">Transfer to</label><select id="tTo"><option value="">'+esc(selfLbl)+'</option>'+
        others.map(function(x){ return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label for="tDate">Date</label><input type="date" id="tDate" value="'+def+'"></div>'+
      '<div class="quick"><button class="chip" id="tYest" type="button">Yesterday</button>'+
      '<button class="chip" id="tToday" type="button">Today</button>'+
      '<button class="chip" id="tTom" type="button">Tomorrow</button>'+
      '<button class="chip" id="tWeek" type="button">Next week</button></div>'+
      '<p class="xhint hidden" id="tNote"></p>'+
      '<p class="error" id="tErr"></p>'+
      '<div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="mOk" type="button">Transfer</button></div>');
    var t0 = today();
    $("tYest").onclick = function(){ $("tDate").value = addDays(t0,-1); };
    $("tToday").onclick = function(){ $("tDate").value = t0; };
    $("tTom").onclick = function(){ $("tDate").value = addDays(t0,1); };
    $("tWeek").onclick = function(){ $("tDate").value = addDays(t0,7); };
    $("tTo").onchange = function(){
      var o = emp(this.value);
      $("tNote").classList.toggle("hidden", !o);
      if(o) $("tNote").textContent = o.name+" must accept before it is added to the worklist.";
      $("mOk").textContent = o ? "Send request" : "Transfer";
      $("tErr").textContent = "";
    };
    $("mNo").onclick = closeModal;
    $("mOk").onclick = function(){
      var d = $("tDate").value, to = $("tTo").value;
      if(!d){ $("tErr").textContent = "Pick a date."; return; }
      if(!to && d === from){ $("tErr").textContent = "Pick a date different from "+fmtDate(from)+"."; return; }
      closeModal();
      if(to){ xferSend(e, w, to, d); return; }
      w.movedFrom = from; w.date = d;
      commit([wput(e,w)]); render();
    };
  }

  /* ---------- Contracts & AMC users (Master) ---------- */
  function contractsModal(){
    if(!isMaster()) return;
    if(SYNC){
      openModal('<h3>Contracts & AMC</h3><p style="color:var(--muted)">Loading…</p>');
      api({action:"contractList"}).then(function(r){
        state.contracts=r.json.contracts||[]; state.amcUsers=r.json.users||[]; drawContractsModal();
      }).catch(function(err){ openModal('<h3>Contracts & AMC</h3><p class="error">'+esc(err.server?err.message:"Cannot reach the server.")+'</p><div class="row"><button class="btn" id="mNo" type="button">Close</button></div>'); $("mNo").onclick=closeModal; });
    } else drawContractsModal();
  }
  function drawContractsModal(msg){
    var contracts=state.contracts||[], users=state.amcUsers||[];
    var crows=contracts.map(function(c,i){
      var cu=users.filter(function(u){return u.contractId===c.id;});
      return '<li><div style="flex:1 1 100%"><b>'+esc(c.name)+'</b>'+
        (c.number?' <small>('+esc(c.number)+')</small>':'')+
        '<small style="display:block;color:var(--muted)">'+esc(c.agency||'')+
        (c.from?' &middot; '+esc(c.from):'')+(c.to?' to '+esc(c.to):'')+
        ' &middot; '+cu.length+' AMC user'+(cu.length===1?'':'s')+'</small></div>'+
        '<button class="btn ghost small" data-cedit="'+i+'" type="button">Edit</button>'+
        '<button class="btn danger small" data-cdel="'+i+'" type="button">Delete</button></li>';
    }).join("") || '<li><small>No contracts created yet.</small></li>';
    var urows=users.map(function(u,i){
      var c=contracts.find(function(x){return x.id===u.contractId;}), e=state.employees.find(function(x){return x.id===u.employeeId;});
      return '<li><div style="flex:1 1 100%"><b>'+esc(u.displayName||u.id)+'</b> <small>('+esc(u.id)+')</small>'+
        '<small style="display:block;color:var(--muted)">Contract: '+esc(c?c.name:u.contractId||"—")+' &middot; Working under: '+esc(e?e.name:u.employeeId||"—")+'</small></div>'+
        '<button class="btn ghost small" data-uedit="'+i+'" type="button">Edit</button>'+
        '<button class="btn small" data-transfer="'+i+'" type="button">Transfer</button>'+
        '<button class="btn danger small" data-udel="'+i+'" type="button">Remove</button></li>';
    }).join("") || '<li><small>No AMC users yet.</small></li>';
    openModal('<h3>Contracts & AMC</h3>'+
      '<p class="okmsg">'+esc(msg||"")+'</p>'+
      '<h4>Contracts</h4><ul class="ulist">'+crows+'</ul>'+
      '<div class="row"><button class="btn" id="newContract" type="button">+ Create contract</button></div>'+
      '<h4 style="margin-top:20px">AMC / Support Staff users</h4><ul class="ulist">'+urows+'</ul>'+
      '<div class="row"><button class="btn" id="newAmc" type="button">+ Add AMC user</button><button class="btn ghost" id="mNo" type="button">Close</button></div>');
    $("mNo").onclick=closeModal;
    $("newContract").onclick=function(){ contractEditModal(null); };
    $("newAmc").onclick=function(){ amcUserEditModal(null); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-cedit]"),function(b){b.onclick=function(){contractEditModal(contracts[+b.getAttribute("data-cedit")]);};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-cdel]"),function(b){
      b.onclick=function(){var c=contracts[+b.getAttribute("data-cdel")]; if(!confirm("Delete contract “"+c.name+"”?"))return;
        if(!SYNC){state.contracts=contracts.filter(function(x){return x.id!==c.id;});drawContractsModal("Contract deleted.");return;}
        api({action:"contractDel",id:c.id}).then(function(r){applyAdminData(r);drawContractsModal("Contract deleted.");}).catch(function(err){drawContractsModal(err.server?err.message:"Cannot reach the server.");});
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-uedit]"),function(b){b.onclick=function(){amcUserEditModal(users[+b.getAttribute("data-uedit")]);};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-transfer]"),function(b){b.onclick=function(){amcTransferModal(users[+b.getAttribute("data-transfer")]);};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-udel]"),function(b){
      b.onclick=function(){var u=users[+b.getAttribute("data-udel")]; if(!confirm("Remove AMC user "+u.id+"?"))return;
        if(!SYNC){state.amcUsers=users.filter(function(x){return x.id!==u.id;});state.users=state.users.filter(function(x){return x.id!==u.id;});saveLocal();drawContractsModal("AMC user removed.");return;}
        api({action:"amcUserDel",id:u.id}).then(function(r){applyAdminData(r);drawContractsModal("AMC user removed.");}).catch(function(err){drawContractsModal(err.server?err.message:"Cannot reach the server.");});
      };
    });
  }
  function contractEditModal(c){
    c=c||{id:uid(),name:"",agency:"",number:"",from:"",to:"",created:Date.now()};
    openModal('<h3>'+(c.name?'Edit contract':'Create contract')+'</h3>'+
      '<div class="field"><label for="cName">Contract name</label><input id="cName" value="'+esc(c.name)+'" maxlength="150"></div>'+
      '<div class="field"><label for="cAgency">Agency / contractor</label><input id="cAgency" value="'+esc(c.agency)+'" maxlength="150"></div>'+
      '<div class="field"><label for="cNumber">Contract number</label><input id="cNumber" value="'+esc(c.number)+'" maxlength="100"></div>'+
      '<div class="row"><div><label for="cFrom">From</label><input type="date" id="cFrom" value="'+esc(c.from)+'"></div><div><label for="cTo">To</label><input type="date" id="cTo" value="'+esc(c.to)+'"></div></div>'+
      '<p class="error" id="cErr"></p><div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="cSave" type="button">Save</button></div>');
    $("mNo").onclick=drawContractsModal;
    $("cSave").onclick=function(){
      var x={id:c.id,name:$("cName").value.trim(),agency:$("cAgency").value.trim(),number:$("cNumber").value.trim(),from:$("cFrom").value,to:$("cTo").value,created:c.created};
      if(!x.name){$("cErr").textContent="Contract name is required.";return;}
      if(x.from&&x.to&&x.to<x.from){$("cErr").textContent="End date cannot be before start date.";return;}
      if(!SYNC){var i=state.contracts.findIndex(function(z){return z.id===x.id;});if(i<0)state.contracts.push(x);else state.contracts[i]=x;saveLocal();drawContractsModal("Contract saved.");return;}
      $("cSave").disabled=true;api({action:"contractPut",contract:x}).then(function(r){applyAdminData(r);drawContractsModal("Contract saved.");}).catch(function(err){$("cErr").textContent=err.server?err.message:"Cannot reach the server.";$("cSave").disabled=false;});
    };
  }
  function amcUserEditModal(u){
    u=u||{id:uid(),displayName:"",contractId:"",employeeId:"",pass:""};
    var contracts=state.contracts||[], emps=state.employees||[];
    openModal('<h3>'+(u.displayName?'Edit AMC user':'Add AMC user')+'</h3>'+
      '<div class="field"><label for="uName">Name</label><input id="uName" value="'+esc(u.displayName||"")+'" maxlength="100"></div>'+
      '<div class="field"><label for="uId">Login ID</label><input id="uId" value="'+esc(u.id||"")+'" maxlength="40" autocapitalize="off" '+(u.displayName?'disabled':'')+'></div>'+
      '<div class="field"><label for="uPw">Password</label><input id="uPw" type="text" placeholder="'+(u.displayName?'Leave blank to keep current password':'Password')+'"></div>'+
      '<div class="field"><label for="uContract">Contract</label><select id="uContract">'+contracts.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===u.contractId?' selected':'')+'>'+esc(c.name)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label for="uEmp">Tagged POWERGRID employee</label><select id="uEmp">'+emps.map(function(e){return '<option value="'+esc(e.id)+'"'+(e.id===u.employeeId?' selected':'')+'>'+esc(e.name)+'</option>';}).join("")+'</select></div>'+
      '<p class="error" id="uErr"></p><div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="uSave" type="button">Save AMC user</button></div>');
    $("mNo").onclick=drawContractsModal;
    $("uSave").onclick=function(){
      var id=$("uId").value.trim(), pw=$("uPw").value, x={id:id,displayName:$("uName").value.trim(),contractId:$("uContract").value,employeeId:$("uEmp").value,pass:pw};
      if(!id||!x.displayName||!x.contractId||!x.employeeId||(!u.displayName&&!pw)){ $("uErr").textContent="Name, login ID, password, contract and employee tag are required.";return; }
      if(!contracts.length){ $("uErr").textContent="No contracts are available. Create and save a contract first.";return; }
      if(!emps.length){ $("uErr").textContent="No POWERGRID employees are available. Check the Employees sheet first.";return; }
      if(!SYNC){
        var ix=state.amcUsers.findIndex(function(z){return z.id===id;}), obj={id:id,displayName:x.displayName,contractId:x.contractId,employeeId:x.employeeId,role:"support"};
        if(ix<0 && !pw){ $("uErr").textContent="Password is required for a new AMC user."; return; }
        if(ix<0)state.amcUsers.push(obj);else state.amcUsers[ix]=obj;
        var lu=state.users.find(function(z){return z.id===id;});
        if(!lu)state.users.push({id:id,pass:pw,role:"support"}); else if(pw) lu.pass=pw;
        saveLocal();drawContractsModal("AMC user saved.");return;
      }
      $("uSave").disabled=true;
      api({action:"amcUserPut",user:{id:id,displayName:x.displayName,contractId:x.contractId,employeeId:x.employeeId,pass:pw||"UNCHANGED"}}).then(function(r){
        applyAdminData(r);drawContractsModal("AMC user saved.");
      }).catch(function(err){$("uErr").textContent=err.server?err.message:"Cannot reach the server.";$("uSave").disabled=false;});
    };
  }
  function amcTransferModal(u){
    var opts=state.employees.map(function(e){return '<option value="'+esc(e.id)+'"'+(e.id===u.employeeId?' selected':'')+'>'+esc(e.name)+'</option>';}).join("");
    openModal('<h3>Transfer AMC user</h3><p>Current employee: <b>'+esc((state.employees.find(function(e){return e.id===u.employeeId;})||{}).name||u.employeeId)+'</b></p>'+
      '<div class="field"><label for="trEmp">Transfer to POWERGRID employee</label><select id="trEmp">'+opts+'</select></div>'+
      '<p class="error" id="trErr"></p><div class="row"><button class="btn ghost" id="mNo" type="button">Cancel</button><button class="btn" id="trSave" type="button">Transfer</button></div>');
    $("mNo").onclick=drawContractsModal;
    $("trSave").onclick=function(){
      var to=$("trEmp").value;
      if(to===u.employeeId){$("trErr").textContent="Select a different employee.";return;}
      if(!SYNC){u.employeeId=to;saveLocal();drawContractsModal("AMC user transferred.");return;}
      api({action:"amcTransfer",userId:u.id,employeeId:to}).then(function(r){applyAdminData(r);drawContractsModal("AMC user transferred.");}).catch(function(err){$("trErr").textContent=err.server?err.message:"Cannot reach the server.";});
    };
  }

  /* ---------- Manage login users (master sees and sets passwords) ---------- */
  function usersModal(){
    openModal('<h3>Manage user logins</h3><p style="color:var(--muted)">Loading…</p>');
    function loadPw(done){
      if(!SYNC){ userPass = {}; state.users.forEach(function(u){ userPass[u.id] = u.pass; }); done(""); return; }
      api({ action: "userList" }).then(function(r){
        userPass = {}; (r.json.users || []).forEach(function(u){ userPass[u.id] = u.pass; }); done("");
      }).catch(function(err){
        userPass = null;
        done(err.server ? "Could not load passwords ("+err.message+")." : "Cannot reach the server.");
      });
    }
    function pwOf(id){ return userPass && userPass[id] != null ? userPass[id] : null; }
    function body(msg, ok){
      var li = state.users.map(function(u,i){
        var pw = pwOf(u.id);
        return '<li><div style="flex:1 1 100%"><b>'+esc(u.id)+'</b> &nbsp; Password: '+
            (pw === null ? '<small>(not available)</small>' : pw === '' ? '<small>(not recorded – set a new password to see it here)</small>' : '<code>'+esc(pw)+'</code>')+'</div>'+
          '<div class="row" style="flex:1 1 100%;margin:0"><input type="text" id="upw'+i+'" placeholder="New password">'+
          '<button class="btn small" style="flex:0 0 auto" data-pwset="'+i+'" type="button">Set password</button>'+
          '<button class="btn danger small" style="flex:0 0 auto" data-rm="'+i+'" type="button">Remove</button></div></li>';
      }).join("") || '<li><small>No user logins. Add one below.</small></li>';
      openModal('<h3>Manage user logins</h3>'+
        '<ul class="ulist">'+li+'</ul>'+
        '<div class="row"><div><label for="nuId">New user ID</label><input type="text" id="nuId" autocapitalize="off"></div>'+
        '<div><label for="nuPw">Password</label><input type="text" id="nuPw"></div></div>'+
        '<p class="'+(ok?'okmsg':'error')+'" id="nuErr">'+esc(msg||"")+'</p>'+
        '<div class="row"><button class="btn ghost" id="mNo" type="button">Close</button><button class="btn" id="nuAdd" type="button">Add user</button></div>');
      $("mNo").onclick = closeModal;
      $("nuAdd").onclick = function(){
        var id = $("nuId").value.trim(), pw = $("nuPw").value;
        if(!id || !pw){ body("Enter both a user ID and a password."); return; }
        if(id.toLowerCase()==="master" || state.users.some(function(u){return u.id.toLowerCase()===id.toLowerCase();})){
          body("That user ID is already taken."); return;
        }
        state.users.push(SYNC ? { id:id } : { id:id, pass:pw });
        userPass = userPass || {}; userPass[id] = pw;
        commit([{ t:"user.put", id:id, pass:pw }]); body("User added.", true);
      };
      Array.prototype.forEach.call(document.querySelectorAll("[data-pwset]"),function(b){
        b.onclick = function(){
          var i = +b.getAttribute("data-pwset"), u = state.users[i], pw = $("upw"+i).value;
          if(!pw){ body("Type a new password for "+u.id+" first."); return; }
          if(!SYNC) u.pass = pw;
          userPass = userPass || {}; userPass[u.id] = pw;
          commit([{ t:"user.put", id:u.id, pass:pw }]); body("Password updated for "+u.id+".", true);
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"),function(b){
        b.onclick = function(){
          var u = state.users.splice(+b.getAttribute("data-rm"),1)[0];
          if(userPass) delete userPass[u.id];
          commit([{ t:"user.del", id:u.id }]); body("");
        };
      });
    }
    loadPw(function(m){ body(m); });
  }
  $("manageUsersBtn").onclick = usersModal;

  /* ---------- Install as an app (Android / iPhone / desktop Chrome) ---------- */
  (function(){
    var deferred = null, root = document.documentElement;
    function standalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    function offer(){ if(!standalone()) root.classList.add("can-install"); }
    window.addEventListener("beforeinstallprompt", function(ev){ ev.preventDefault(); deferred = ev; offer(); });   // Android Chrome / Edge / Samsung
    window.addEventListener("appinstalled", function(){ deferred = null; root.classList.remove("can-install"); });
    if(ios) offer();                                                                                              // iOS has no prompt: show how-to
    document.addEventListener("click", function(ev){
      var b = ev.target.closest && ev.target.closest("[data-install]"); if(!b) return;
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(c){ if(c && c.outcome === "accepted") root.classList.remove("can-install"); deferred = null; });
      } else {
        openModal('<h3>Install this app</h3>'+
          '<ol style="margin:0 0 12px;padding-left:20px;line-height:1.7">'+
          '<li>Tap the <b>Share</b> button (square with an arrow) in Safari.</li>'+
          '<li>Scroll and tap <b>Add to Home Screen</b>.</li>'+
          '<li>Tap <b>Add</b>. The app icon appears on your home screen.</li></ol>'+
          '<p style="color:var(--muted);font-size:.88rem;margin:0 0 12px">On iPhone this works only from Safari. If this page is open in another app or browser, open it in Safari first.</p>'+
          '<div class="row"><button class="btn" id="mNo" type="button">Got it</button></div>');
        $("mNo").onclick = closeModal;
      }
    });
    if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
      window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
    }
  })();

  setStatus("ok");
  setRole("user");
})();
</script>
</body>
